<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🌞 Welcome to My Daily Effort Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* ===== Base Styles ===== */
    body {
      text-align: center;
      font-family: "Poppins", "Comic Sans MS", Arial, sans-serif;
      background: white;
      color: #333;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      visibility: hidden; /* hide until DOM ready */
      margin: 0;
    }

    h1.hero-title {
      font-size: 2.2em;
      font-weight: 600;
      animation: fadeInDown 1s ease-out forwards;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 40px;
      animation: fadeInUp 1.5s ease-out forwards;
    }

    .info-box {
      background: rgba(255, 255, 255, 0.85);
      padding: 25px 40px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      width: 60%;
      max-width: 600px;
      animation: fadeIn 2s ease-in-out forwards;
    }

    .info-text {
      font-size: 1.1em;
      color: #444;
      margin-top: 15px;
      min-height: 60px;
      transition: opacity 0.5s ease-in-out;
    }

    button.cta-btn {
      margin-top: 40px;
      padding: 14px 44px;
      font-size: 1.05em;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: #ffffff;
      background: linear-gradient(135deg, #4CAF50, #2e7d32);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(46, 125, 50, 0.35);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    button.cta-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 45px rgba(46, 125, 50, 0.45);
    }

    button.cta-btn:active {
      transform: translateY(0);
      box-shadow: 0 10px 22px rgba(46, 125, 50, 0.3);
    }

    /* ===== Logo ===== */
    .logo-container {
      position: fixed;
      top: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 1000;
    }

    .app-logo {
      width: 200px; /* smaller for faster load */
      height: auto;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .app-logo:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 28px rgba(0,0,0,0.25);
    }

    /* ===== Animations ===== */
    @keyframes fadeInDown { from { opacity:0; transform: translateY(-30px);} to { opacity:1; transform: translateY(0);} }
    @keyframes fadeInUp { from { opacity:0; transform: translateY(30px);} to { opacity:1; transform: translateY(0);} }
    @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
    @keyframes sproutOnce { 0% {transform: scale(0.3) translateY(8px);opacity:0;} 60% {transform: scale(0.6) translateY(-3px);opacity:1;} 100% {transform: scale(0.9) translateY(-3px);} }

    .seed {
      display: inline-block;
      transform-origin: center bottom;
      animation: sproutOnce 2.8s ease-out forwards;
      vertical-align: baseline;
      margin: 0;
      padding: 0;
      line-height: 1;
      position: relative;
      top: 1px;
    }

    /* Fade-out for messages */
    .fade-out { opacity: 0; }
    .fade-in { opacity: 1; }

  </style>
</head>
<body>
  <!-- Logo -->
  <div class="logo-container">
    <img src="images/comfort.png" alt="App Logo" class="app-logo">
  </div>

  <h1 class="hero-title">
    Turning daily small actions into lifelong gro<span class="seed">🌱</span>th
  </h1>

  <p>Empowering families to grow, learn, and shine together ✨</p>

  <div class="info-box">
    <div id="infoText" class="info-text fade-in">
      💡 Track your child’s progress and celebrate small wins!
    </div>
  </div>

  <button id="startBtn" class="cta-btn">Grow With Us</button>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1️⃣ Show body after DOM ready
      document.body.style.visibility = "visible";

      // 2️⃣ Redirect if already logged in
      const user = localStorage.getItem("currentUser");
      if (user) {
        window.location.replace("welcome.html");
        return;
      }

      // 3️⃣ Button click
      document.getElementById("startBtn").addEventListener("click", () => {
        window.location.href = "ask-user.html";
      });

      // 4️⃣ Rotating messages (optimized)
      const messages = [
        "💡 Track your child’s progress and celebrate small wins!",
        "👨‍👩‍👧 Build stronger family connections through shared goals.",
        "⭐ Motivate your kids with stars and kind words of encouragement.",
        "🎯 Teach consistency and commitment through daily habits.",
        "🎁 Reward progress — even the small steps — to keep motivation high!",
        "💬 Encourage open talk about goals, dreams, and challenges."
      ];

      const infoText = document.getElementById("infoText");
      let index = 0;

      setInterval(() => {
        infoText.classList.add("fade-out");
        setTimeout(() => {
          index = (index + 1) % messages.length;
          infoText.textContent = messages[index];
          infoText.classList.remove("fade-out");
          infoText.classList.add("fade-in");
        }, 500); // matches CSS transition
      }, 4000);
    });
  </script>
</body>
</html>
