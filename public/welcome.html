<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🌞 Welcome to My Daily Effort Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Preload logo -->
  <link rel="preload" as="image" href="images/comfort.png" />

  <style>
    /* ===== Reset ===== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: "Poppins", "Segoe UI", Arial, sans-serif;
      background: #ffffff;
      color: #333;
    }

    body {
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #fff;
}


    /* ===== Layout ===== */
    .page {
      max-width: 900px;
      width: 100%;
      padding: 40px 20px;
      text-align: center;
    }

    /* ===== Logo ===== */
    .logo-container {
      position: fixed;
      top: 16px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    .app-logo {
      width: 140px;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }

    /* ===== Hero ===== */
    .hero-title {
      font-size: 2.4rem;
      font-weight: 600;
      margin-bottom: 16px;
      opacity: 0;
      transform: translateY(-20px);
      animation: fadeDown 0.8s ease forwards;
    }

    .hero-sub {
      font-size: 1.2rem;
      margin-bottom: 40px;
      color: #555;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.8s ease forwards;
      animation-delay: 0.2s;
    }

    /* ===== Info Box ===== */
    .info-box {
      background: rgba(255, 255, 255, 0.85);
      padding: 28px 36px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      max-width: 620px;
      margin: 0 auto 48px;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 0.4s;
    }

    .info-text {
      font-size: 1.1rem;
      min-height: 48px;
      transition: opacity 0.4s ease;
    }

    /* ===== CTA ===== */
    .cta-btn {
      padding: 14px 44px;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #fff;
      background: linear-gradient(135deg, #4CAF50, #2e7d32);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(46, 125, 50, 0.35);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 0.6s;
    }

    .cta-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 40px rgba(46, 125, 50, 0.45);
    }

    /* ===== Seed Animation ===== */
    .seed {
      display: inline-block;
      transform-origin: center bottom;
      animation: sproutOnce 2.2s ease-out forwards;
      margin-left: 2px;
    }

    /* ===== Animations ===== */
    @keyframes fadeDown {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes sproutOnce {
      0% { transform: scale(0.3) translateY(8px); opacity: 0; }
      60% { transform: scale(0.7) translateY(-2px); opacity: 1; }
      100% { transform: scale(1) translateY(0); }
    }

    /* ===== Fade utility ===== */
    .fade-out { opacity: 0; }

    /* ===== Responsive ===== */
    @media (max-width: 600px) {
      .hero-title { font-size: 1.8rem; }
      .hero-sub { font-size: 1rem; }
      .app-logo { width: 110px; }
    }
  </style>
</head>

<body>
  <!-- Logo -->
  <div class="logo-container">
    <img src="images/comfort.png" alt="App Logo" class="app-logo" width="140" height="90" />
  </div>

  <!-- Page -->
  <main class="page">
    <h1 class="hero-title">
      Turning daily small actions into lifelong gro<span class="seed">🌱</span>th
    </h1>

    <p class="hero-sub">
      Empowering families to grow, learn, and shine together ✨
    </p>

    <div class="info-box">
      <div id="infoText" class="info-text">
        💡 Track your child’s progress and celebrate small wins!
      </div>
    </div>

    <button id="startBtn" class="cta-btn">
      Grow With Us
    </button>
  </main>

  <script>
    // ---- Render Gate ----
    document.addEventListener("DOMContentLoaded", () => {
      const user = localStorage.getItem("currentUser");
      if (user) {
        window.location.replace("welcome.html");
        return;
      }



      // CTA
      document.getElementById("startBtn").addEventListener("click", () => {
        window.location.href = "ask-user.html";
      });

      // Message rotator (optimized)
      const messages = [
        "💡 Track your child’s progress and celebrate small wins!",
        "👨‍👩‍👧 Build stronger family connections through shared goals.",
        "⭐ Motivate your kids with stars and kind words of encouragement.",
        "🎯 Teach consistency and commitment through daily habits.",
        "🎁 Reward progress — even the small steps — to keep motivation high!",
        "💬 Encourage open talk about goals, dreams, and challenges."
      ];

      const infoText = document.getElementById("infoText");
      let index = 0;

      setInterval(() => {
        infoText.classList.add("fade-out");

        setTimeout(() => {
          index = (index + 1) % messages.length;
          infoText.textContent = messages[index];
          infoText.classList.remove("fade-out");
        }, 400);

      }, 4000);
    });
  </script>
</body>
</html>
