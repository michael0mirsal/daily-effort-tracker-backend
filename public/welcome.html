<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🌞 Welcome to My Daily Effort Tracker</title>
  <script>
    const user = localStorage.getItem("currentUser");
    if (user) {
      window.location.replace("welcome.html");
    }
  </script>
  <style>
    body {
      text-align: center;
      font-family: "Poppins", "Comic Sans MS", Arial, sans-serif;
      padding-top: 80px;
      background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
      color: #333;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-size: 2.2em;
      margin-bottom: 10px;
      animation: fadeInDown 1s ease-out;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 40px;
      animation: fadeInUp 1.5s ease-out;
    }

    button {
      padding: 15px 40px;
      font-size: 1.2em;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: transform 0.3s, background 0.3s;
      animation: bounceIn 2s infinite alternate;
    }

    button:hover {
      background-color: #3e9e45;
      transform: scale(1.05);
    }

    .info-box {
      background: rgba(255, 255, 255, 0.85);
      padding: 25px 40px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      width: 60%;
      max-width: 600px;
      animation: fadeIn 2s ease-in-out;
    }

    .info-text {
      font-size: 1.1em;
      color: #444;
      margin-top: 15px;
      min-height: 60px;
      transition: opacity 1s;
    }

    /* ✨ Animations */
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes bounceIn {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }

/* ===== MARKETING LOGO (TOP-LEFT) ===== */
.logo-container {
  position: fixed;
  top: 24px;
  left: 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 1000;
}

/* Logo image */
.app-logo {
  width: 1680px;
  height: 300px;
  border-radius: 12px; /* modern rounded square */
  box-shadow: 0 6px 18px rgba(0,0,0,0.15);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

/* Hover effect (marketing feel) */
.logo-container:hover .app-logo {
  transform: scale(1.05);
  box-shadow: 0 10px 28px rgba(0,0,0,0.25);
}

/* App name text */
.app-name {
  font-size: 1.2em;
  font-weight: 600;
  letter-spacing: 0.5px;
  color: #2c3e50;
  white-space: nowrap;
}

/* Sparkles 
.sparkle {
  position: absolute;
  font-size: 24px;
  color: #fff;
  text-shadow: 0 0 10px #fff, 0 0 20px #fffa, 0 0 30px #fffa;
  opacity: 0.8;
  animation: sparkleAnim 2s linear infinite;
}
*/
/* Randomize sparkle positions 
.sparkle1 { top: 10px; left: 20px; animation-delay: 0s; }
.sparkle2 { top: 50px; left: 110px; animation-delay: 0.5s; }
.sparkle3 { top: 120px; left: 60px; animation-delay: 1s; }
*/
/* Sparkle animation: blink and float 
@keyframes sparkleAnim {
  0%, 100% { opacity: 0.8; transform: scale(1) translateY(0); }
  50% { opacity: 0; transform: scale(1.3) translateY(-10px); }
}
*/


  </style>
</head>
<body>
  <!-- Logo with magical glow -->
  <div class="logo-container">
    <img src="images/comfort.png" alt="App Logo" class="app-logo">
    <div class="sparkle sparkle1">✨</div>
    <div class="sparkle sparkle2">✨</div>
    <div class="sparkle sparkle3">✨</div>
  </div>

  <h1>🌈 Welcome to My Daily Effort Tracker</h1>
  <p>Empowering families to grow, learn, and shine together ✨</p>

  <div class="info-box">
    <div id="infoText" class="info-text">
      💡 Track your child’s progress and celebrate small wins!
    </div>
  </div>

  <button id="startBtn">🚀 Start / Login</button>
  <script>
    const API_URL = "http://localhost:3000";// or 3000 if you use that
    // ✅ Redirect if already logged in
    
    document.getElementById("startBtn").addEventListener("click", () => {
      window.location.href = "ask-user.html";
    });

    // ✨ Rotating motivational messages
    const messages = [
      "💡 Track your child’s progress and celebrate small wins!",
      "👨‍👩‍👧 Build stronger family connections through shared goals.",
      "⭐ Motivate your kids with stars and kind words of encouragement.",
      "🎯 Teach consistency and commitment through daily effort.",
      "🎁 Reward progress — even the small steps — to keep motivation high!",
      "💬 Encourage open talk about goals, dreams, and challenges."
    ];

    let index = 0;
    const infoText = document.getElementById("infoText");

    setInterval(() => {
      infoText.style.opacity = 0;
      setTimeout(() => {
        index = (index + 1) % messages.length;
        infoText.innerHTML = messages[index];
        infoText.style.opacity = 1;
      }, 1000);
    }, 4000);
  </script>

</body>
</html>
