<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🌞 Welcome to FemtoGrow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  

  <style>
    body {
      text-align: center;
      font-family: "Poppins", Arial, sans-serif;
      background: white;
      color: #333;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* ===== LOGO ===== */
    .logo-container {
      position: fixed;
      top: -30px;
      left: -20px;
      z-index: 1000;
    }

    .app-logo {
      width: 420px;
      max-width: 90vw;
    }

    .logo-svg {
      width: 100%;
      height: auto;
      display: block;
      animation: logoFadeIn 1.5s ease-out;
    }

    @keyframes logoFadeIn {
      from { opacity: 0; transform: translateY(-20px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ===== HERO ===== */
    .hero-title {
      font-size: 2.2em;
      font-weight: 600;
      margin-top: 120px;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 40px;
    }

    /* ===== INFO BOX ===== */
    .info-box {
      background: rgba(255, 255, 255, 0.95);
      padding: 25px 40px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      width: 60%;
      max-width: 600px;
    }

    .info-text {
      font-size: 1.1em;
      color: #444;
      margin-top: 15px;
      min-height: 60px;
      transition: opacity 1s;
    }

    /* ===== CTA BUTTON ===== */
    .cta-btn {
      margin-top: 40px;
      padding: 14px 44px;
      font-size: 1.05em;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: #ffffff;
      background: linear-gradient(135deg, #4CAF50, #2e7d32);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(46, 125, 50, 0.35);
      transition: all 0.3s ease;
    }

    .cta-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 45px rgba(46, 125, 50, 0.45);
    }

    .cta-btn:active {
      transform: translateY(0);
      box-shadow: 0 10px 22px rgba(46, 125, 50, 0.3);
    }
  </style>
</head>

<body>

  <!-- ===== LOGO (SVG INLINE) ===== -->
  <div class="logo-container">
    <div class="app-logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 290" class="logo-svg">
        <defs>
          <linearGradient id="leafLight" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#9BE000"/>
            <stop offset="1" stop-color="#46A400"/>
          </linearGradient>

          <linearGradient id="leafDark" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#6BC200"/>
            <stop offset="1" stop-color="#2E8E00"/>
          </linearGradient>

          <linearGradient id="seedGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6A3A12"/>
            <stop offset="1" stop-color="#2D1608"/>
          </linearGradient>

          <linearGradient id="soilGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1E8E3E"/>
            <stop offset="1" stop-color="#0C6B2A"/>
          </linearGradient>

          <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5"
                  markerWidth="9" markerHeight="9" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#21B3AE"/>
          </marker>
        </defs>

        <!-- ICON -->
        <g transform="translate(40,40)">
          <path d="M 35 110 C 90 55, 165 35, 235 40"
                fill="none" stroke="#21B3AE" stroke-width="10"
                stroke-linecap="round" marker-end="url(#arrowHead)"/>

          <path d="M 45 155 C 120 130, 185 130, 295 145 C 320 150, 335 158, 350 168
                   L 350 188 C 250 178, 165 182, 45 195 Z"
                fill="url(#soilGrad)"/>

          <ellipse cx="35" cy="178" rx="24" ry="18" fill="url(#seedGrad)"/>
        </g>

        <!-- WORDMARK -->
        <g transform="translate(400,70)">
          <text x="0" y="70" font-family="Poppins, Arial, sans-serif"
                font-size="92" font-weight="700">
            <tspan fill="#5F676D">Femto</tspan>
            <tspan fill="#2E9E35">Grow</tspan>
          </text>

          <text x="150" y="145" font-family="Poppins, Arial, sans-serif"
                font-size="40" font-weight="600" fill="#5F676D">
            Track • Learn • Grow
          </text>
        </g>
      </svg>
    </div>
  </div>

  <!-- ===== HERO ===== -->
  <h1 class="hero-title">
    Turning daily small actions into lifelong growth 🌱
  </h1>

  <p>Empowering families to grow, learn, and shine together ✨</p>

  <div class="info-box">
    <div id="infoText" class="info-text">
      💡 Track your child’s progress and celebrate small wins!
    </div>
  </div>

  <button id="startBtn" class="cta-btn">Grow With Us</button>

  <script>
    document.getElementById("startBtn").addEventListener("click", () => {
      window.location.href = "ask-user.html";
    });

    const messages = [
      "💡 Track your child’s progress and celebrate small wins!",
      "👨‍👩‍👧 Build stronger family connections through shared goals.",
      "⭐ Motivate your kids with stars and kind words of encouragement.",
      "🎯 Teach consistency and commitment through daily habits.",
      "🎁 Reward progress — even the small steps — to keep motivation high!",
      "💬 Encourage open talk about goals, dreams, and challenges."
    ];

    let index = 0;
    const infoText = document.getElementById("infoText");

    setInterval(() => {
      infoText.style.opacity = 0;
      setTimeout(() => {
        index = (index + 1) % messages.length;
        infoText.innerHTML = messages[index];
        infoText.style.opacity = 1;
      }, 1000);
    }, 4000);
  </script>

</body>
</html>
