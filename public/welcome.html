<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🌞 Welcome to My Daily Effort Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* ===== Body & Layout ===== */
    body {
      font-family: "Poppins", "Comic Sans MS", Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: white;
      color: #333;
      overflow-x: hidden;
    }

    h1.hero-title {
      font-size: 2.2em;
      font-weight: 600;
      animation: fadeInDown 1s ease-out forwards;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 40px;
      animation: fadeInUp 1.5s ease-out forwards;
    }

    .info-box {
      background: rgba(255, 255, 255, 0.85);
      padding: 25px 40px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      width: 60%;
      max-width: 600px;
      animation: fadeIn 2s ease-in-out forwards;
    }

    .info-text {
      font-size: 1.1em;
      color: #444;
      min-height: 60px;
      opacity: 1;
      transition: opacity 0.5s;
    }

    button.cta-btn {
      padding: 14px 44px;
      font-size: 1.05em;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #4CAF50, #2e7d32);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(46, 125, 50, 0.35);
      transition: transform 0.3s, box-shadow 0.3s;
      animation: bounceIn 2s 1s forwards; /* delayed to not block render */
    }

    button.cta-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 45px rgba(46, 125, 50, 0.45);
    }

    button.cta-btn:active {
      transform: translateY(0);
      box-shadow: 0 10px 22px rgba(46, 125, 50, 0.3);
    }

    /* ===== Logo ===== */
    .logo-container {
      position: fixed;
      top: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 1000;
    }

    .app-logo {
      width: 200px;  /* smaller for faster load */
      height: auto;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .seed {
      display: inline-block;
      transform-origin: center bottom;
      animation: sproutOnce 2.8s ease-out forwards;
      vertical-align: baseline;
      margin: 0;
      padding: 0;
      line-height: 1;
      position: relative;
      top: 1px;
    }

    /* ===== Animations ===== */
    @keyframes fadeInDown { from {opacity:0; transform:translateY(-30px);} to {opacity:1; transform:translateY(0);} }
    @keyframes fadeInUp { from {opacity:0; transform:translateY(30px);} to {opacity:1; transform:translateY(0);} }
    @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
    @keyframes bounceIn { from {transform: translateY(0);} to {transform: translateY(-10px);} }
    @keyframes sproutOnce {
      0% { transform: scale(0.3) translateY(8px); opacity:0; }
      60% { transform: scale(0.6) translateY(-3px); opacity:1; }
      100% { transform: scale(0.9) translateY(-3px); }
    }
  </style>
</head>
<body>

  <!-- Logo -->
  <div class="logo-container">
    <img src="images/comfort.png" alt="App Logo" class="app-logo" loading="lazy">
  </div>

  <h1 class="hero-title">
    Turning daily small actions into lifelong gro<span class="seed">🌱</span>th
  </h1>

  <p>Empowering families to grow, learn, and shine together ✨</p>

  <div class="info-box">
    <div id="infoText" class="info-text">
      💡 Track your child’s progress and celebrate small wins!
    </div>
  </div>

  <button id="startBtn" class="cta-btn">Grow With Us</button>

  <script>
    // ===== Redirect if logged in =====
    document.addEventListener("DOMContentLoaded", () => {
      const user = localStorage.getItem("currentUser");
      if (user) {
        window.location.replace("welcome.html");
        return;
      }

      // Button click
      document.getElementById("startBtn").addEventListener("click", () => {
        window.location.href = "ask-user.html";
      });

      // Rotating messages
      const messages = [
        "💡 Track your child’s progress and celebrate small wins!",
        "👨‍👩‍👧 Build stronger family connections through shared goals.",
        "⭐ Motivate your kids with stars and kind words of encouragement.",
        "🎯 Teach consistency and commitment through daily habits.",
        "🎁 Reward progress — even the small steps — to keep motivation high!",
        "💬 Encourage open talk about goals, dreams, and challenges."
      ];

      let index = 0;
      const infoText = document.getElementById("infoText");

      setInterval(() => {
        infoText.style.opacity = 0;
        setTimeout(() => {
          index = (index + 1) % messages.length;
          infoText.textContent = messages[index];
          infoText.style.opacity = 1;
        }, 500);
      }, 3500); // slightly faster, smoother
    });
  </script>

</body>
</html>
