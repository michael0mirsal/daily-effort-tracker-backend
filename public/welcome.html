<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🌞 Welcome to FemtoGrow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  

  <style>
    body {
      text-align: center;
      font-family: "Poppins", Arial, sans-serif;
      background: white;
      color: #333;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* ===== LOGO ===== */
    .logo-container {
      position: fixed;
      top: -30px;
      left: -20px;
      z-index: 1000;
    }

    .app-logo {
      width: 120px;
      max-width: 90vw;
    }

    .logo-svg {
      width: 100%;
      height: auto;
      display: block;
      animation: logoFadeIn 1.5s ease-out;
    }

    @keyframes logoFadeIn {
      from { opacity: 0; transform: translateY(-20px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ===== HERO ===== */
    .hero-title {
      font-size: 2.2em;
      font-weight: 600;
      margin-top: 120px;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 40px;
    }

    /* ===== INFO BOX ===== */
    .info-box {
      background: rgba(255, 255, 255, 0.95);
      padding: 25px 40px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      width: 60%;
      max-width: 600px;
    }

    .info-text {
      font-size: 1.1em;
      color: #444;
      margin-top: 15px;
      min-height: 60px;
      transition: opacity 1s;
    }

    /* ===== CTA BUTTON ===== */
    .cta-btn {
      margin-top: 40px;
      padding: 14px 44px;
      font-size: 1.05em;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: #ffffff;
      background: linear-gradient(135deg, #4CAF50, #2e7d32);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(46, 125, 50, 0.35);
      transition: all 0.3s ease;
    }

    .cta-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 45px rgba(46, 125, 50, 0.45);
    }

    .cta-btn:active {
      transform: translateY(0);
      box-shadow: 0 10px 22px rgba(46, 125, 50, 0.3);
    }
  </style>
</head>

<body>

  <!-- ===== LOGO (SVG INLINE) ===== -->
  <div class="logo-container">
    <div class="app-logo">
      <?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500">
  <defs>
    <linearGradient id="leafG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6BD34A"/>
      <stop offset="100%" stop-color="#1E9B3B"/>
    </linearGradient>

    <linearGradient id="arrowG" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2BBBAD"/>
      <stop offset="100%" stop-color="#19A6C8"/>
    </linearGradient>

    <linearGradient id="soilG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E6B3A"/>
      <stop offset="100%" stop-color="#0A8A4B"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  
  <!-- WORDMARK -->
  <g transform="translate(640,200)">
    <text x="0" y="0"
          font-family="Poppins, Montserrat, Arial, sans-serif"
          font-size="110"
          font-weight="500"
          fill="#4B4F55">Femto</text>

    <text x="340" y="0"
          font-family="Poppins, Montserrat, Arial, sans-serif"
          font-size="110"
          font-weight="700"
          fill="#2FAE43">Grow</text>

    <text x="160" y="70"
          font-family="Poppins, Montserrat, Arial, sans-serif"
          font-size="44"
          font-weight="500"
          fill="#6B7077">Track • Learn • Grow</text>
  </g>
</svg>
    </div>
  </div>

  <!-- ===== HERO ===== -->
  <h1 class="hero-title">
    Turning daily small actions into lifelong growth 🌱
  </h1>

  <p>Empowering families to grow, learn, and shine together ✨</p>

  <div class="info-box">
    <div id="infoText" class="info-text">
      💡 Track your child’s progress and celebrate small wins!
    </div>
  </div>

  <button id="startBtn" class="cta-btn">Grow With Us</button>

  <script>
    document.getElementById("startBtn").addEventListener("click", () => {
      window.location.href = "ask-user.html";
    });

    const messages = [
      "💡 Track your child’s progress and celebrate small wins!",
      "👨‍👩‍👧 Build stronger family connections through shared goals.",
      "⭐ Motivate your kids with stars and kind words of encouragement.",
      "🎯 Teach consistency and commitment through daily habits.",
      "🎁 Reward progress — even the small steps — to keep motivation high!",
      "💬 Encourage open talk about goals, dreams, and challenges."
    ];

    let index = 0;
    const infoText = document.getElementById("infoText");

    setInterval(() => {
      infoText.style.opacity = 0;
      setTimeout(() => {
        index = (index + 1) % messages.length;
        infoText.innerHTML = messages[index];
        infoText.style.opacity = 1;
      }, 1000);
    }, 4000);
  </script>

</body>
</html>
