  <style>
    body {
      text-align: center;
      font-family: "Poppins", "Comic Sans MS", Arial, sans-serif;

      color: #333;

      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

    h1 {
      font-size: 2.2em;
      margin-bottom: 10px;
      animation: fadeInDown 1s ease-out;

    p {
      font-size: 1.2em;
      margin-bottom: 40px;
      animation: fadeInUp 1.5s ease-out;
    }

    button {
      padding: 15px 40px;
      font-size: 1.2em;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: transform 0.3s, background 0.3s;
      animation: bounceIn 2s infinite alternate;
    }

    button:hover {
      background-color: #3e9e45;
      transform: scale(1.05);
    }

    .info-box {
      background: rgba(255, 255, 255, 0.85);
      padding: 25px 40px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      width: 60%;
      max-width: 600px;
      animation: fadeIn 2s ease-in-out;
    }

    .info-text {
      font-size: 1.1em;
      color: #444;
      margin-top: 15px;
      min-height: 60px;
      transition: opacity 1s;
    }

    /* ✨ Animations */
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes bounceIn {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }

/* ===== Growing Seed Animation ===== */
.seed {
  display: inline-block;
  transform-origin: center bottom;
  animation: sproutOnce 2.8s ease-out forwards;
  vertical-align: baseline;
  margin: 0;
  padding: 0;
  line-height: 1;
  position: relative;
  top: 1px; /* adjust ±1px if needed */
}

@keyframes sproutOnce {
  0% {
    transform: scale(0.3) translateY(8px);
    opacity: 0;
  }
  60% {
    transform: scale(0.6) translateY(-3px);
    opacity: 1;
  }
  100% {
    transform: scale(0.9) translateY(-3px);
  }
}

 <h1 class="hero-title">
  Turning daily small actions into lifelong gro<span class="seed">🌱</span>th
</h1>




  <p>Empowering families to grow, learn, and shine together ✨</p>

  <div class="info-box">
    <div id="infoText" class="info-text">
      💡 Track your child’s progress and celebrate small wins!
    </div>
  </div>

  <button id="startBtn" class="cta-btn">Grow With Us</button>
  <script>
    const API_URL = "https://daily-effort-tracker-backend.onrender.com";// or 3000 if you use that
    // ✅ Redirect if already logged in
    
    document.getElementById("startBtn").addEventListener("click", () => {
      window.location.href = "ask-user.html";
    });

    // ✨ Rotating motivational messages
    const messages = [
      "💡 Track your child’s progress and celebrate small wins!",
      "👨‍👩‍👧 Build stronger family connections through shared goals.",
      "⭐ Motivate your kids with stars and kind words of encouragement.",
      "🎯 Teach consistency and commitment through daily habits.",
      "🎁 Reward progress — even the small steps — to keep motivation high!",
      "💬 Encourage open talk about goals, dreams, and challenges."
    ];

    let index = 0;
    const infoText = document.getElementById("infoText");

    setInterval(() => {
      infoText.style.opacity = 0;
      setTimeout(() => {
        index = (index + 1) % messages.length;
        infoText.innerHTML = messages[index];
        infoText.style.opacity = 1;
      }, 1000);
    }, 4000);
  </script>
