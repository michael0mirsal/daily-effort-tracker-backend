<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🌞 Welcome to My Daily Effort Tracker</title>

  <!-- Preload font for faster render -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">

  <style>
    body {
      text-align: center;
      font-family: "Poppins", "Comic Sans MS", Arial, sans-serif;
      padding-top: 0;
      background: white;
      color: #333;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-size: 2.2em;
      margin-bottom: 10px;
      animation: fadeInDown 1s ease-out;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 40px;
      animation: fadeInUp 1.5s ease-out;
    }

    button {
      padding: 15px 40px;
      font-size: 1.2em;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: transform 0.3s, background 0.3s;
      will-change: transform;
    }

    button:hover {
      background-color: #3e9e45;
      transform: scale(1.05);
    }

    .info-box {
      background: rgba(255, 255, 255, 0.85);
      padding: 25px 40px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      width: 60%;
      max-width: 600px;
      animation: fadeIn 1.5s ease-in-out;
    }

    .info-text {
      font-size: 1.1em;
      color: #444;
      margin-top: 15px;
      min-height: 60px;
      transition: opacity 0.5s;
    }

    @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* Growing Seed Animation */
    .seed {
      display: inline-block;
      transform-origin: center bottom;
      animation: sproutOnce 2.8s ease-out forwards;
      vertical-align: baseline;
      margin: 0;
      padding: 0;
      line-height: 1;
      position: relative;
      top: 1px;
      will-change: transform, opacity;
    }

    @keyframes sproutOnce {
      0% { transform: scale(0.3) translateY(8px); opacity: 0; }
      60% { transform: scale(0.6) translateY(-3px); opacity: 1; }
      100% { transform: scale(0.9) translateY(-3px); }
    }

    /* Logo */
    .logo-container {
      position: fixed;
      top: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 1000;
    }

    .app-logo {
      width: 230px; /* smaller for faster load */
      height: 150px;
      border-radius: 12px;
    }

    .cta-btn {
      margin-top: 40px;
      padding: 14px 44px;
      font-size: 1.05em;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: #fff;
      background: linear-gradient(135deg, #4CAF50, #2e7d32);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(46, 125, 50, 0.35);
      transition: all 0.3s ease;
      will-change: transform, box-shadow;
    }

    .cta-btn:hover { transform: translateY(-2px); box-shadow: 0 18px 45px rgba(46, 125, 50, 0.45); }
    .cta-btn:active { transform: translateY(0); box-shadow: 0 10px 22px rgba(46, 125, 50, 0.3); }

    .hero-title { font-size: 2.2em; font-weight: 600; text-align: center; }

    /* Optional sparkle (if you want animated sparkles later) */
    .sparkle { opacity: 0; }
  </style>
</head>
<body>
  <!-- Logo -->
  <div class="logo-container">
    <img src="images/comfort.png" alt="App Logo" class="app-logo" loading="lazy">
    <div class="sparkle sparkle1">✨</div>
    <div class="sparkle sparkle2">✨</div>
    <div class="sparkle sparkle3">✨</div>
  </div>

  <h1 class="hero-title">
    Turning daily small actions into lifelong gro<span class="seed">🌱</span>th
  </h1>

  <p>Empowering families to grow, learn, and shine together ✨</p>

  <div class="info-box">
    <div id="infoText" class="info-text">
      <!-- First message will be injected by JS -->
    </div>
  </div>

  <button id="startBtn" class="cta-btn">Grow With Us</button>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Redirect if logged in
      const user = localStorage.getItem("currentUser");
      if (user) window.location.replace("welcome.html");

      // Button click
      const startBtn = document.getElementById("startBtn");
      startBtn.addEventListener("click", () => window.location.href = "ask-user.html");

      // Rotating messages
      const messages = [
        "💡 Track your child’s progress and celebrate small wins!",
        "👨‍👩‍👧 Build stronger family connections through shared goals.",
        "⭐ Motivate your kids with stars and kind words of encouragement.",
        "🎯 Teach consistency and commitment through daily effort.",
        "🎁 Reward progress — even the small steps — to keep motivation high!",
        "💬 Encourage open talk about goals, dreams, and challenges."
      ];

      const infoText = document.getElementById("infoText");
      let index = 0;

      // Show first message immediately
      infoText.innerHTML = messages[0];
      infoText.style.opacity = 1;

      function rotateMessage() {
        infoText.style.opacity = 0;
        setTimeout(() => {
          index = (index + 1) % messages.length;
          infoText.innerHTML = messages[index];
          infoText.style.opacity = 1;
        }, 500);
      }

      // Start rotation after 4s
      setTimeout(() => setInterval(rotateMessage, 4000), 4000);

      // Start button bounce after page load
      window.addEventListener("load", () => {
        startBtn.style.animation = "bounceIn 2s infinite alternate";
      });
    });
  </script>
</body>
</html>
