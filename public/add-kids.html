<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>👶 Manage Family Kids</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
      background: linear-gradient(135deg, #fff0f5, #ffe4e1);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
    }
    input, select, button {
      padding: 10px;
      margin: 8px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #4f9ef7;
      width: 250px;
    }
    button {
      background-color: #4f9ef7;
      color: white;
      cursor: pointer;
      border: none;
      transition: background 0.3s;
      width: 150px;
    }
    button:hover { background-color: #357acb; }
    h2 { color: #2c3e50; margin-bottom: 20px; }
    #kidsList {
      margin-top: 20px;
      text-align: left;
      width: 320px;
    }
    .kidItem {
      background: rgba(255,255,255,0.85);
      padding: 8px 10px;
      border-radius: 6px;
      margin: 5px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .kidItem span {
      font-weight: bold;
    }
    .kidActions button {
      width: auto;
      padding: 5px 10px;
      margin-left: 5px;
      font-size: 13px;
    }
    .message {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>👶 Manage Family Kids</h2>

  <input id="kidName" placeholder="Kid's name" /><br/>
  <input id="kidAge" placeholder="Age (optional)" type="number" /><br/>
  <select id="kidRole">
    <option value="kid">Kid 👧/👦</option>
  </select><br/>
  <button onclick="addKid()">➕ Add Kid</button>
  <div class="message" id="msg"></div>

  <div id="kidsList"></div>
  <button onclick="finish()" style="margin-top:20px;">✅ Finish & Save</button>

  <script>
    const msg = document.getElementById('msg');
    const kidsListDiv = document.getElementById('kidsList');

    // ✅ Retrieve family info from localStorage
    const familyData = JSON.parse(localStorage.getItem('currentFamily') || '{}');
    if (!familyData.family || !familyData.passkey) {
      alert('Family info missing. Please create a family first.');
      window.location.href = 'signup.html';
    }

    let kids = [];

    // 🧠 Load existing kids from backend
    async function loadKids() {
      try {
        const res = await fetch(`/api/families/family/${familyData.family}`);
        const data = await res.json();
        if (data[0]?.members) {
          kids = data[0].members.filter(m => m.role === 'kid');
          renderKids();
        }
      } catch (err) {
        console.error("Error loading kids:", err);
      }
    }

    function renderKids() {
      kidsListDiv.innerHTML = '';
      kids.forEach((k, index) => {
        const div = document.createElement('div');
        div.className = 'kidItem';
        div.innerHTML = `
          <span>${k.name}${k.age ? ' (' + k.age + ' yrs)' : ''}</span>
          <div class="kidActions">
            <button onclick="editKid(${index})">✏️ Edit</button>
            <button onclick="deleteKid(${index})">🗑️ Delete</button>
          </div>
        `;
        kidsListDiv.appendChild(div);
      });
    }

    function addKid() {
      const name = document.getElementById('kidName').value.trim();
      const age = document.getElementById('kidAge').value.trim();
      const role = document.getElementById('kidRole').value;

      if (!name) {
        msg.style.color = 'red';
        msg.textContent = '❌ Please enter kid\'s name';
        return;
      }

      kids.push({ name, age: age || null, role });
      renderKids();

      document.getElementById('kidName').value = '';
      document.getElementById('kidAge').value = '';
      msg.textContent = '';
    }

    function editKid(index) {
      const kid = kids[index];
      const newName = prompt("Edit name:", kid.name);
      if (!newName) return;

      const newAge = prompt("Edit age (optional):", kid.age || '');
      kids[index].name = newName.trim();
      kids[index].age = newAge ? parseInt(newAge) : null;

      renderKids();
    }

    async function deleteKid(index) {
      const kid = kids[index];
      if (!confirm(`Delete ${kid.name}?`)) return;

      try {
        const res = await fetch('/api/families/delete-member', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            family: familyData.family,
            name: kid.name
          })
        });
        if (!res.ok) throw new Error("Failed to delete on server");

        kids.splice(index, 1);
        renderKids();
      } catch (err) {
        console.error(err);
        alert("Error deleting kid: " + err.message);
      }
    }

    async function finish() {
      if (kids.length === 0) {
        msg.style.color = 'red';
        msg.textContent = '❌ Add at least one kid';
        return;
      }

      try {
        for (const kid of kids) {
          const res = await fetch('/api/families/add-member', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              family: familyData.family,
              name: kid.name,
              role: kid.role
            })
          });

          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'Failed to add kid');
        }

        msg.style.color = 'green';
        msg.textContent = '🎉 All kids saved successfully! Redirecting...';
        setTimeout(() => {
          window.location.href = 'signin.html';
        }, 1500);

      } catch (err) {
        msg.style.color = 'red';
        msg.textContent = '❌ Error: ' + err.message;
        console.error(err);
      }
    }

    loadKids(); // Load existing kids at start
  </script>
</body>
</html>
