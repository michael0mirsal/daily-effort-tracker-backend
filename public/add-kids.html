<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>👶 Manage Family Kids</title>
  <style>
    body {
      font-family: 'Comic Sans MS', Arial, sans-serif;
      text-align: center;
      padding: 40px;
      background: linear-gradient(135deg, #fff0f5, #ffe4e1);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      position: relative;
    }

    h2 {
      font-size: 2em;
      color: #2c3e50;
      margin-bottom: 20px;
      animation: fadeInDown 1s ease;
    }

    .form-box {
      background: rgba(255,255,255,0.85);
      padding: 25px 35px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      animation: fadeInUp 1s ease;
      backdrop-filter: blur(6px);
    }

    input, select {
      padding: 10px;
      margin: 8px;
      font-size: 16px;
      border-radius: 12px;
      border: 2px solid #74b9ff;
      width: 260px;
      transition: transform 0.2s, box-shadow 0.3s;
    }

    input:focus, select:focus {
      outline: none;
      transform: scale(1.03);
      box-shadow: 0 0 10px rgba(116,185,255,0.6);
    }

    button {
      background-color: #ff7675;
      color: white;
      cursor: pointer;
      border: none;
      border-radius: 14px;
      padding: 10px 20px;
      margin-top: 10px;
      font-size: 16px;
      transition: transform 0.2s, background 0.3s;
    }

    button:hover {
      background-color: #d63031;
      transform: scale(1.1) rotate(-2deg);
    }

    #kidsList {
      margin-top: 20px;
      text-align: left;
      width: 320px;
    }

    .kidItem {
      background: rgba(255,255,255,0.9);
      padding: 8px 10px;
      border-radius: 10px;
      margin: 5px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }

    .kidActions button {
      width: auto;
      padding: 5px 10px;
      margin-left: 5px;
      font-size: 13px;
      background-color: #74b9ff;
      color: white;
      border: none;
      border-radius: 8px;
      transition: transform 0.2s, background 0.3s;
    }

    .kidActions button:hover {
      background-color: #0984e3;
      transform: scale(1.05);
    }

    .message {
      margin-top: 15px;
      font-weight: bold;
      font-size: 1em;
    }

    /* Floating emojis */
    .float {
      position: absolute;
      font-size: 22px;
      opacity: 0.8;
      animation: floatUp 9s linear infinite;
      pointer-events: none;
    }

    @keyframes floatUp {
      from { transform: translateY(100vh) scale(1); opacity: 1; }
      to { transform: translateY(-10vh) scale(1.4); opacity: 0; }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #motivation {
      position: absolute;
      bottom: 15px;
      font-size: 1.2em;
      color: #d63031;
      font-weight: bold;
      opacity: 0;
      animation: fadeText 7s infinite;
    }

    @keyframes fadeText {
      0%, 100% { opacity: 0; }
      20%, 80% { opacity: 1; }
    }
  </style>
</head>
<body>

  <h2>👶 Manage Family Kids</h2>

  <div class="form-box">
    <input id="kidName" placeholder="Kid's name" /><br/>
    <input id="kidAge" placeholder="Age (optional)" type="number" /><br/>
    <input type="file" id="avatarFile" accept="image/*" />
    <button onclick="handleAvatarUpload()">Upload Avatar</button>

    <select id="kidRole">
      <option value="kid">Kid 👧/👦</option>
    </select><br/>
    <button onclick="addKid()">➕ Add Kid</button>
    <div class="message" id="msg"></div>
  </div>

  <div id="kidsList"></div>
  <button onclick="finish()" style="margin-top:20px;">✅ Finish & Save</button>
  <div id="motivation">🌟 Encourage your kids and celebrate their daily efforts!</div>

  <script>
    const API_URL = "https://daily-effort-tracker-backend-production-2184.up.railway.app";
    const msg = document.getElementById('msg');
    const kidsListDiv = document.getElementById('kidsList');
    const familyData = JSON.parse(localStorage.getItem('currentFamily') || '{}');
    if (!familyData.family || !familyData.passkey) {
      alert('Family info missing. Please create a family first.');
      window.location.href = 'signup.html';
    }

    let kids = [];

async function updateAvatar(memberId, file) {
  // 1. Upload file to Cloudinary
  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", "YOUR_UPLOAD_PRESET"); // from Cloudinary

  const cloudRes = await fetch(
    "https://api.cloudinary.com/v1_1/YOUR_CLOUD_NAME/image/upload",
    { method: "POST", body: formData }
  );

  if (!cloudRes.ok) throw new Error("Cloudinary upload failed");

  const cloudData = await cloudRes.json();
  const avatarUrl = cloudData.secure_url;

  // 2. Update avatar in your backend
  const res = await fetch(`${API_URL}/api/families/family/update-avatar`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ memberId, avatarUrl })
  });

  if (!res.ok) throw new Error("Backend update failed");

  const data = await res.json();
  console.log(data);
}



// ===============================
// 1) Load Kids From API
// ===============================
async function loadKids() {
  try {
    const res = await fetch(`${API_URL}/api/families/family/${familyData.family}`);
    const data = await res.json();

    const family = data[0];
    if (family?.members) {
      // members are now full documents
      kids = family.members.filter(m => m.role === 'kid');
      renderKids();
    }
  } catch (err) {
    console.error("Error loading kids:", err);
  }
}

// ===============================
// 2) Render Kids UI
// ===============================
function renderKids() {
  kidsListDiv.innerHTML = '';
  kids.forEach((k, index) => {
    const div = document.createElement('div');
    div.className = 'kidItem';
    div.innerHTML = `
    <img src="${k.avatar || 'default-avatar.png'}" width="40" height="40" style="border-radius:50%; margin-right:8px;" />
      <span>${k.name}${k.age ? ' (' + k.age + ' yrs)' : ''}</span>
      <div class="kidActions">
        <button onclick="editKid(${index})">✏️ Edit</button>
        <button onclick="deleteKid(${index})">🗑️ Delete</button>
      </div>
    `;
    kidsListDiv.appendChild(div);
  });
}

// ===============================
// 3) Add Kid (local only)
// ===============================
function addKid() {
  const name = document.getElementById('kidName').value.trim();
  const age = document.getElementById('kidAge').value.trim();
  const role = document.getElementById('kidRole').value;

  if (!name) {
    msg.style.color = 'red';
    msg.textContent = '❌ Please enter kid\'s name';
    return;
  }

  kids.push({
    name,
    age: age || null,
    role
  });

  renderKids();
  document.getElementById('kidName').value = '';
  document.getElementById('kidAge').value = '';
  msg.textContent = '';
}

// ===============================
// 4) Edit Kid (local only)
// ===============================
function editKid(index) {
  const kid = kids[index];
  const newName = prompt("Edit name:", kid.name);
  if (!newName) return;

  const newAge = prompt("Edit age (optional):", kid.age || '');

  kids[index].name = newName.trim();
  kids[index].age = newAge ? parseInt(newAge) : null;

  renderKids();
}

// ===============================
// 5) Delete Kid (backend + local)
// ===============================
async function deleteKid(index) {
  const kid = kids[index];
  if (!confirm(`Delete ${kid.name}?`)) return;

  // Delete locally if kid not saved in DB
  if (!kid._id) {
    kids.splice(index, 1);
    renderKids();
    return;
  }

  try {
    const res = await fetch(`${API_URL}/api/families/delete-member`, {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        family: familyData.family,
        name: kid.name
      })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.message || "Failed to delete on server");

    // Remove from local list
    kids.splice(index, 1);
    renderKids();

  } catch (err) {
    console.error(err);
    alert("Error deleting kid: " + err.message);
  }
}


// ===============================
// 6) Save All Kids To Server
// ===============================
async function finish() {
  if (kids.length === 0) {
    msg.style.color = 'red';
    msg.textContent = '❌ Add at least one kid';
    return;
  }

  try {
    for (const kid of kids) {
      const res = await fetch(`${API_URL}/api/families/add-member`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          family: familyData.family,
          name: kid.name,
          role: kid.role,
          age: kid.age || null   // only if you support age
        })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Failed to add kid');
    }

    msg.style.color = 'green';
    msg.textContent = '🎉 All kids saved successfully! Redirecting...';

    setTimeout(() => {
      window.location.href = 'signin.html';
    }, 1500);

  } catch (err) {
    msg.style.color = 'red';
    msg.textContent = '❌ Error: ' + err.message;
    console.error(err);
  }
}


    loadKids();

    // Floating emojis
    const emojis = ['💖','⭐','✨','🌈','🎈','🍭'];
    function createFloat() {
      const el = document.createElement('div');
      el.className = 'float';
      el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.animationDuration = (6 + Math.random() * 5) + 's';
      el.style.fontSize = (16 + Math.random() * 26) + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 9000);
    }
    setInterval(createFloat, 800);

    // Motivational messages
    const messages = [
      "🌟 Encourage your kids daily!",
      "🎯 Celebrate their achievements!",
      "💖 Motivation + Love = Growth!",
      "🎈 Make learning fun and joyful!",
      "⭐ Track progress and inspire effort!"
    ];
    const mot = document.getElementById("motivation");
    let i = 0;
    setInterval(() => {
      mot.textContent = messages[i % messages.length];
      i++;
    }, 7000);
  </script>
</body>
</html>
