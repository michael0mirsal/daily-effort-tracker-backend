<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🏠 Family Stars App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #dff9fb, #c7ecee);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      margin-bottom: 15px;
      color: #2c3e50;
    }

    input, select {
      padding: 10px;
      margin: 8px;
      border: 2px solid #4f9ef7;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 30px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #2980b9;
    }

    .section {
      background: rgba(255,255,255,0.7);
      padding: 20px 40px;
      border-radius: 15px;
      margin: 15px 0;
    }
  </style>
</head>
<body>

  <h1>👨‍👩‍👧 Family Stars App</h1>

  <!-- Section 1: Sign Up / Sign In Choice -->
  <div class="section">
    <p>Please choose:</p>
    <button onclick="goToSignup()">🆕 Sign Up (New Family)</button>
    <button onclick="showLoginForm()">🔐 Sign In (Existing Family)</button>
  </div>

  <!-- Section 2: Login Form (hidden initially) -->
  <div class="section" id="loginSection" style="display:none;">
    <h2>👋 Welcome Back!</h2>
    <input type="text" id="username" placeholder="Enter your nickname" />
    <select id="role">
      <option value="kid">Kid 👧</option>
      <option value="parent">Parent 👩‍👧</option>
    </select>
    <br>
    <button onclick="login()">🚀 Login</button>
  </div>

  <script>
    function goToSignup() {
      window.location.href = "signup.html";
    }

    function showLoginForm() {
      document.getElementById("loginSection").style.display = "block";
    }

    function login() {
      const username = document.getElementById("username").value.trim();
      const role = document.getElementById("role").value;

      if (!username) {
        alert("Please enter your nickname");
        return;
      }

      const userData = { nickname: username, role };
      localStorage.setItem("currentUser", JSON.stringify(userData));

      window.location.href = "choose.html";
    }
  </script>

</body>
</html>
