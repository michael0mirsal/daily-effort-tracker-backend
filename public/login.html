<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🏠 Family Stars App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #dff9fb, #c7ecee);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 { margin-bottom: 15px; color: #2c3e50; }
    input, select { padding: 10px; margin: 8px; border: 2px solid #4f9ef7; border-radius: 10px; font-size: 16px; }
    button { background-color: #3498db; color: white; border: none; border-radius: 12px; padding: 12px 30px; margin: 10px; font-size: 16px; cursor: pointer; transition: background 0.3s; }
    button:hover { background-color: #2980b9; }
    .section { background: rgba(255,255,255,0.7); padding: 20px 40px; border-radius: 15px; margin: 15px 0; }
  </style>
</head>
<body>

  <h1>👨‍👩‍👧 Family Stars App</h1>

  <!-- Section 1: Sign Up / Sign In Choice -->
  <div class="section" id="choiceSection">
    <p>Please choose:</p>
    <button onclick="goToSignup()">🆕 Sign Up (New Family)</button>
    <button onclick="showLoginForm()">🔐 Sign In (Existing Family)</button>
  </div>

  <!-- Section 2: Login Form (hidden initially) -->
  <div class="section" id="loginSection" style="display:none;">
    <h2>👋 Welcome Back!</h2>
    <input type="text" id="familyName" placeholder="Enter family name" /><br/>
    <input type="text" id="nickname" placeholder="Enter your nickname" /><br/>
    <select id="role">
      <option value="kid">Kid 👧</option>
      <option value="parent">Parent 👩‍👧</option>
    </select>
    <br>
    <input type="password" id="passkey" placeholder="Family pass key" /><br/>
    <button onclick="login()">🚀 Login</button>
  </div>

  <script>
  function goToSignup() {
    window.location.href = "signup.html";
  }

  function showLoginForm() {
    document.getElementById("choiceSection").style.display = "none";
    document.getElementById("loginSection").style.display = "block";
  }

  async function login() {
    const family = document.getElementById("familyName").value.trim();
    const name = document.getElementById("nickname").value.trim(); // rename here
    const role = document.getElementById("role").value;
    const passkey = document.getElementById("passkey").value.trim();

    if (!family || !name || !passkey) {
      alert("Please fill all fields");
      return;
    }

    try {
      const res = await fetch("https://daily-effort-tracker-backend-production.up.railway.app/api/families/signin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, role, passkey }) // ✅ send 'name'
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.message || "Login failed");

      localStorage.setItem("currentUser", JSON.stringify({
        family: data.family.name,
        dad: data.family.dad,
        mom: data.family.mom,
        name: name,
        role: role
      }));

      window.location.href = "choose.html";
    } catch (err) {
      alert("❌ Error: " + err.message);
    }
  }
</script>


</body>
</html>
