<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🏠 Family Tracker</title>
  <style>
    body {
      font-family: "Poppins", "Comic Sans MS", sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #a8edea, #fed6e3);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #2c3e50;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 2em;
      animation: fadeInDown 1s ease-out;
    }

    p.subtitle {
      font-size: 1.1em;
      margin-bottom: 30px;
      color: #555;
      animation: fadeInUp 1.5s ease-out;
    }

    .section {
      background: rgba(255,255,255,0.85);
      padding: 25px 40px;
      border-radius: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      margin: 10px 0;
      width: 320px;
      animation: fadeIn 2s ease-in-out;
    }

    input, select {
      padding: 10px;
      margin: 8px;
      border: 2px solid #4f9ef7;
      border-radius: 10px;
      font-size: 16px;
      width: 90%;
    }

    button {
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 30px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.3s, background 0.3s;
    }

    button:hover {
      background-color: #2980b9;
      transform: scale(1.05);
    }

    #homeBtn {
      background-color: #6fcf97;
      margin-top: 25px;
    }

    #homeBtn:hover {
      background-color: #57b883;
    }

    .tip-box {
      background: rgba(255, 255, 255, 0.7);
      border-radius: 15px;
      padding: 15px 25px;
      font-size: 1em;
      color: #333;
      width: 70%;
      max-width: 500px;
      margin-top: 20px;
      animation: fadeIn 2s ease-in-out;
    }

    .floating {
      position: absolute;
      font-size: 22px;
      opacity: 0.5;
      animation: float 8s linear infinite;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes float {
      0% { transform: translateY(0) translateX(0); opacity: 0.7; }
      50% { opacity: 1; }
      100% { transform: translateY(-800px) translateX(50px); opacity: 0; }
    }
  </style>
</head>
<body>

  <h1>👨‍👩‍👧 Family Tracker</h1>
  <p class="subtitle">Track 🌟 Motivate ❤️ Celebrate</p>

  <!-- Section 1: Sign Up / Sign In -->
  <div class="section" id="choiceSection">
    <p>Welcome! Please choose:</p>
    <button onclick="goToSignup()">🆕 Create New Family</button>
    <button onclick="showLoginForm()">🔐 Existing Family Login</button>
  </div>

  <!-- Section 2: Login Form -->
  <div class="section" id="loginSection" style="display:none;">
    <h2>👋 Welcome Back!</h2>
    <input type="text" id="familyName" placeholder="Enter family name" /><br/>
    <input type="text" id="name" placeholder="Enter your name" /><br/>

    <select id="role">
      <option value="dad">Dad 👨</option>
      <option value="mom">Mom 👩</option>
      <option value="kid">Kid 👧/👦</option>
    </select><br>

    <input type="password" id="passkey" placeholder="Family pass key" /><br/>
    <button id="loginBtn" onclick="login()">🚀 Login</button>
    <div id="loginNote" style="font-size:0.9em;color:#666;margin-top:6px;"></div>
  </div>

  <button id="homeBtn" onclick="goHome()">🏠 Home Page</button>

  <div class="tip-box" id="tipBox">
    💡 Kids grow stronger when their effort is seen and celebrated!
  </div>

  <script>
  // -----------------------
  // Basic navigation helpers
  // -----------------------
  function goToSignup() { window.location.href = "signup.html"; }
  function showLoginForm() {
    document.getElementById("choiceSection").style.display = "none";
    document.getElementById("loginSection").style.display = "block";
  }
  function goHome() { window.location.href = "welcome.html"; }

  // -----------------------
  // Security & UX settings
  // -----------------------
  const API_BASE = "https://daily-effort-tracker-backend.onrender.com";
  const loginBtn = document.getElementById("loginBtn");
  const loginNote = document.getElementById("loginNote");

  // Client-side "cooldown" after repeated failed attempts (soft protection).
  // NOTE: real protection MUST be implemented server-side (rate limiting / lockouts).
  let failedAttempts = 0;
  let cooldownUntil = 0; // timestamp ms

  function setCooldown(seconds) {
    cooldownUntil = Date.now() + seconds * 1000;
    loginBtn.disabled = true;
    loginNote.textContent = `Too many attempts. Please wait ${seconds} seconds...`;
    const interval = setInterval(() => {
      const remaining = Math.max(0, Math.ceil((cooldownUntil - Date.now()) / 1000));
      if (remaining <= 0) {
        clearInterval(interval);
        loginBtn.disabled = false;
        loginNote.textContent = "";
      } else {
        loginNote.textContent = `Too many attempts. Please wait ${remaining}s...`;
      }
    }, 500);
  }

  // Minimal HTTPS enforcement notice
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
    // show a non-blocking warning — server must run with HTTPS in production
    console.warn("Warning: login page is not served over HTTPS. This is insecure in production.");
    // small user-visible message
    loginNote.textContent = "⚠️ For security use HTTPS in production.";
  }

  // -----------------------
  // Robust login flow
  // -----------------------
  async function login() {
    // quick client-side cooldown check
    if (Date.now() < cooldownUntil) {
      alert("Please wait before retrying login.");
      return;
    }

    const family = document.getElementById("familyName").value.trim();
    const name = document.getElementById("name").value.trim();
    // we still include role in request only for UX, but backend MUST ignore and verify server-side
    const userRoleInput = document.getElementById("role").value;
    const passkey = document.getElementById("passkey").value.trim();

    if (!family || !name || !passkey) {
      alert("❌ Please fill in all fields.");
      return;
    }

    loginBtn.disabled = true;
    loginNote.textContent = "Checking…";

    try {
      // Send family + passkey to backend. Backend must:
      //  - verify passkey for the family
      //  - NOT expose sensitive data if passkey is wrong
      //  - return only minimal necessary data (family name, members, roles)
      // Backend contract expectations are described in comments below.
      const res = await fetch(`${API_BASE}/api/families/signin`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ family, name, role: userRoleInput, passkey })
      });

      const data = await res.json().catch(() => ({}));

      // Handle common failure cases with helpful messages
      if (!res.ok) {
        // If backend returns 409 with list of families, handle client-side selection (see below).
        if (res.status === 409 && data.families) {
          // Backend signals multiple families match member name (rare). Ask user to confirm family.
          const choice = prompt("Multiple families found for that name. Enter the exact family name to use:\n" +
                                data.families.map(f => f.name).join(", "));
          if (choice) {
            // re-call login using the explicit family from user
            document.getElementById("familyName").value = choice;
            loginBtn.disabled = false;
            loginNote.textContent = "";
            return login(); // call again with updated family
          } else {
            loginBtn.disabled = false;
            loginNote.textContent = "";
            return;
          }
        }

        // Generic error
        const msg = data.message || `Login failed (status ${res.status})`;
        failedAttempts++;
        if (failedAttempts >= 5) {
          // client-side cooldown (soft). Backend MUST implement server-side rate limiting.
          setCooldown(30); // 30s cooldown client-side
        }
        alert("❌ " + msg);
        loginBtn.disabled = false;
        loginNote.textContent = "";
        return;
      }

      // ------------------------
      // At this point res.ok === true
      // data should contain either:
      //  - { message: "...", family: <familyObject> }  (family-mode)
      //  - { message: "...", family: <familyObject>, user: { name, role } } (member-mode)
      //  - OR (in older backend) just the family object or array — handle gracefully below
      // ------------------------

      // Normalize family object:
      // Backend SHOULD return family in data.family (preferred). If older backend returns an array or object,
      // we try to handle both safely. We do NOT accept an arbitrary array as authoritative without checks.
      let fam = null;
      if (data.family && typeof data.family === "object") {
        fam = data.family;
      } else if (Array.isArray(data) && data.length === 1 && typeof data[0] === "object") {
        fam = data[0];
      } else if (typeof data === "object" && data.name) {
        // fallback — server returned single family object directly
        fam = data;
      } else {
        // Unexpected server response — do not proceed
        console.error("Unexpected signin response:", data);
        alert("⚠️ Unexpected response from server. Check console for details.");
        loginBtn.disabled = false;
        loginNote.textContent = "";
        return;
      }

      // Validate family shape minimally
      if (!fam.name) {
        console.error("Invalid family object:", fam);
        alert("⚠️ Server returned invalid family information.");
        loginBtn.disabled = false;
        loginNote.textContent = "";
        return;
      }

      // ------------------------
      // Server verified family passkey matched. Now we MUST determine role from server-side data.
      // Do NOT trust the role that was sent from the client.
      // ------------------------
      const nameLower = name.toLowerCase();
      const dadLower = (fam.dad || "").toLowerCase();
      const momLower = (fam.mom || "").toLowerCase();
      let detectedRole = null;

      if (dadLower && nameLower === dadLower) detectedRole = "dad";
      else if (momLower && nameLower === momLower) detectedRole = "mom";
      else if (Array.isArray(fam.members) && fam.members.some(m => (m.name || "").toLowerCase() === nameLower && (m.role || "kid") === "kid")) {
        detectedRole = "kid";
      }

      if (!detectedRole) {
        // The name didn't match any member in this family — possible mismatch or malicious attempt
        alert("❌ The entered name does not match any member of that family.");
        loginBtn.disabled = false;
        loginNote.textContent = "";
        return;
      }

      // ------------------------
      // Save only minimal, non-sensitive user info in localStorage.
      // Avoid storing the family's passhash or server tokens here.
      // localStorage is vulnerable to XSS — ensure your app prevents XSS site-wide.
      // ------------------------
      const safeUser = {
        family: fam.name,
        name,
        role: detectedRole
        // do not store dad/mom/passhash unless you have a deliberate reason
      };

      try {
        localStorage.setItem("currentUser", JSON.stringify(safeUser));
      } catch (err) {
        // localStorage may be restricted by tracking-protection; handle gracefully
        console.warn("Could not write to localStorage:", err);
      }

      // Successful login UX
      alert("✅ Welcome back, " + name + "!");
      // reset failed attempts
      failedAttempts = 0;
      loginBtn.disabled = false;
      loginNote.textContent = "";
      // Redirect to choose page (unchanged)
      window.location.href = "choose.html";

    } catch (err) {
      console.error("Login error:", err);
      failedAttempts++;
      if (failedAttempts >= 5) setCooldown(30);
      alert("❌ Error: " + (err.message || err));
      loginBtn.disabled = false;
      loginNote.textContent = "";
    }
  }

  // -----------------------
  // Rotating motivational tips (kept from original)
  // -----------------------
  const tips = [
    "💡 Kids grow stronger when their effort is seen and celebrated!",
    "🎯 Parents can track progress and build healthy routines.",
    "🌟 Every small win deserves a big smile!",
    "❤️ Connection grows when families share daily goals.",
    "🎁 Reward effort, not just success – it builds confidence.",
    "👨‍👩‍👧 Together, you can turn habits into happy memories."
  ];

  let tipIndex = 0;
  const tipBox = document.getElementById("tipBox");

  setInterval(() => {
    if (!tipBox) return;
    tipBox.style.opacity = 0;
    setTimeout(() => {
      tipIndex = (tipIndex + 1) % tips.length;
      tipBox.innerHTML = tips[tipIndex];
      tipBox.style.opacity = 1;
    }, 400);
  }, 5000);

  // -----------------------
  // Floating emojis (kept)
  // -----------------------
  function createFloatingEmoji() {
    const emojis = ["⭐", "💖", "🌈", "✨", "🎉"];
    const emoji = document.createElement("div");
    emoji.className = "floating";
    emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    emoji.style.left = Math.random() * window.innerWidth + "px";
    emoji.style.bottom = "-50px";
    emoji.style.animationDuration = 6 + Math.random() * 5 + "s";
    document.body.appendChild(emoji);
    setTimeout(() => emoji.remove(), 10000);
  }
  setInterval(createFloatingEmoji, 800);

  // -----------------------
  // Important: server-side recommendations (you must implement these on backend)
  // -----------------------
  // 1) Rate limiting / lockout for failed signin attempts (IP + account) — critical.
  // 2) On signin, verify family passkey BEFORE returning family data. If passkey invalid, return 401.
  // 3) Avoid returning the family's passhash or any secret in the response.
  // 4) When multiple families match a member name, return 409 with a safe list: { families: [{name}, ...] }.
  // 5) Prefer returning { family: { name, dad, mom, members:[{name,role},...] } } as the response shape.
  // 6) Consider separate per-member passkeys or different roles with distinct credentials for stronger separation.
  // 7) Use HTTPS and secure cookies or short-lived tokens for any authentication tokens you introduce.
  // -----------------------

  </script>

</body>
</html>
