<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🌞 Kids Daily Stars Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Comic Neue', 'Comic Sans MS', Arial, sans-serif;
      background: linear-gradient(to bottom, #fff8dc 0%, #ffecb3 100%);
      padding: 20px;
      text-align: center;
    }
    #familyName {
      font-size: 2rem;
      font-weight: bold;
      color: #ff6f00;
      text-shadow: 2px 2px #ffe082;
      margin-bottom: 10px;
    }
    #motivation {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 15px;
      color: #ff6f00;
      text-shadow: 2px 2px #ffe082;
      animation: floatColors 3s infinite alternate, floatY 3s infinite alternate;
    }
    @keyframes floatColors {
      0% { color: #ff6f00; text-shadow: 2px 2px #ffe082; }
      50% { color: #ff9800; text-shadow: 2px 2px #ffcc80; }
      100% { color: #ff6f00; text-shadow: 2px 2px #ffe082; }
    }
    @keyframes floatY {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }
    h2 { 
      color: #ff6f00; 
      font-size: 2rem;
      margin-bottom: 15px; 
      text-shadow: 2px 2px #ffe082;
    }
    #backBtn {
      background: #ff9800;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: bold;
      z-index: 1000;
      left: 50%;
      
      position: relative;
      cursor: pointer;
      margin-bottom: 25px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }
    #backBtn:hover {
      background: #fb8c00;
      transform: scale(1.05);
    }
    #logoutBtn {
      background: #ff9800;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 25px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }
    #logoutBtn:hover {
      background: #fb8c00;
      transform: scale(1.05);
    }
    #kidsChartsContainer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
    }
    .chart-card {
      width: 360px;
      background: linear-gradient(to bottom right, #fff3e0, #ffe0b2);
      padding: 20px;
      border-radius: 25px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .chart-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.35);
    }
    .chart-card h3 {
      margin: 10px 0;
      color: #ff6f00;
      font-size: 1.5rem;
    }
    .winner-badge {
      position: absolute;
      top: -12px;
      left: 25%;
      transform: translateX(-50%);
      background: radial-gradient(circle, #ffd700 0%, #ffb300 100%);
      padding: 8px 15px;
      border-radius: 20px;
      font-weight: bold;
      color: #000;
      font-size: 1rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      animation: bounce 1s ease infinite alternate;
    }
    @keyframes bounce {
      0% { transform: translateX(-50%) translateY(0); }
      100% { transform: translateX(-50%) translateY(-5px); }
    }
    canvas {
      margin-top: 10px;
    }
  </style>
</head>
<body>
<button id="backBtn">⬅️ Back</button>
<button id="logoutBtn">Logout</button>
<div id="familyName"></div>
<div id="motivation">✨ Keep shining and earn your stars every day! ✨</div>
<h2>📊 Kids Daily Stars</h2>
<div id="kidsChartsContainer"></div>

<script>
document.getElementById("backBtn").onclick = ()=>{window.location.href="choose.html";};
document.getElementById("logoutBtn").addEventListener("click", () => {
  localStorage.removeItem("currentUser");
  window.location.href = "login.html";
});

// Convert UTC date string to local YYYY-M-D
function toLocalYMD(dateStr) {
  const d = new Date(dateStr);
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${d.getFullYear()}-${m}-${day}`;
}


// Get current week starting from last Saturday
function getWeekDates() {
  const today = new Date();
  const dayOfWeek = today.getDay(); // 0=Sun, 6=Sat
  const diffToSat = (dayOfWeek + 1) % 7; // days since last Saturday
  const weekDates = [];

  for (let i = 0; i < 7; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() - diffToSat + i); // last Sat + i
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    weekDates.push(`${d.getFullYear()}-${m}-${day}`);
  }

  return weekDates;
}



async function createKidsCharts() {
  const currentUser = JSON.parse(localStorage.getItem("currentUser"));
  if (!currentUser) {
    alert("⚠ Please log in first.");
    window.location.href = "login.html";
    return;
  }

  document.getElementById("familyName").textContent =
    `🏡 ${currentUser.family}'s Family (${currentUser.role.toUpperCase()}: ${currentUser.name})`;

  const container = document.getElementById("kidsChartsContainer");
  container.innerHTML = "";

  const API_BASE = window.location.hostname.includes("localhost")
    ? "http://localhost:4000"
    : "https://daily-effort-tracker-backend-production.up.railway.app";

  try {
    // 1️⃣ Load the family info (single object)
    const res = await fetch(`${API_BASE}/api/families/${currentUser.family}`);
    if (!res.ok) throw new Error("Family not found");

    const families = await res.json();       // <-- rename to plural
if (!families || families.length === 0) {
  alert("⚠ Family data missing on the server.");
  return;
}

const family = families[0];              // <-- first family object
if (!family.members || family.members.length === 0) {
  alert("⚠ No members found in this family.");
  return;
}

const kids = family.members.filter(m => m.role === "kid");


    if (kids.length === 0) {
      container.innerHTML = "<p>No kids found in this family.</p>";
      return;
    }

    // 2️⃣ Load all weekly stars
    const weekRes = await fetch(`${API_BASE}/api/kidsStars/week?family=${encodeURIComponent(currentUser.family)}`);
    if (!weekRes.ok) throw new Error("Cannot load weekly stars");
    const weeklyStars = await weekRes.json();

    const weekDates = getWeekDates();
    const todayStr = toLocalYMD(new Date());
    const totals = {};

    // 3️⃣ Assign stars to each kid
    kids.forEach(kid => {
      const kidWeekData = weeklyStars.find(entry =>
        entry.family.toLowerCase() === currentUser.family.toLowerCase() &&
        entry.name.toLowerCase() === kid.name.toLowerCase()
      );

      kid.starsPerDay = kidWeekData?.starsPerDay || [];
      totals[kid.name] = kid.starsPerDay
        .filter(d => weekDates.includes(toLocalYMD(d.date)))
        .reduce((sum, d) => sum + (d.stars || 0), 0);
    });

    // 4️⃣ Determine weekly winner
    const winnerName = Object.keys(totals).reduce((a, b) =>
      totals[a] >= totals[b] ? a : b
    );

    // 5️⃣ Render charts
    kids.forEach(k =>
      createChartForKid(k, k.name === winnerName, totals[k.name], weekDates, todayStr)
    );

  } catch (err) {
    console.error("❌ Error:", err);
    alert("⚠ Failed to load stars. Please try again.");
  }
}



function createChartForKid(kid, isWinner = false, totalStars = 0, weekDates, todayStr) {
  const container = document.getElementById("kidsChartsContainer");
  const chartWrapper = document.createElement("div");
  chartWrapper.className = "chart-card";

  if (isWinner) {
    const badge = document.createElement("div");
    badge.className = "winner-badge";
    badge.textContent = `🏆 Weekly Winner – ${totalStars} Stars!`;
    chartWrapper.appendChild(badge);
  }

  const title = document.createElement("h3");
  title.textContent = kid.name;
  chartWrapper.appendChild(title);

  const canvas = document.createElement("canvas");
  chartWrapper.appendChild(canvas);
  container.appendChild(chartWrapper);

  const weekdays = ["Sat", "Sun", "Mon", "Tue", "Wed", "Thu", "Fri"];
  const dataArr = [];
  const bgColors = [];
  const labels = [];

  weekDates.forEach((dateStr, idx) => {
    const found = kid.starsPerDay?.find(d => toLocalYMD(new Date(d.date)) === dateStr);
    const stars = found ? found.stars : 0;
    dataArr.push(stars);
    bgColors.push(dateStr === todayStr ? "#ff6f00" : "#ffd54f");
    const [year, month, day] = dateStr.split("-");
    labels.push(`${weekdays[idx]}\n(${month}-${day})`);
  });

  const ctx = canvas.getContext("2d");
  const gradient = ctx.createLinearGradient(0, 0, 0, 300);
  gradient.addColorStop(0, "#ffe082");
  gradient.addColorStop(1, "#ff6f00");

  const maxStars = Math.max(...dataArr);
  const yMax = maxStars + 5;

  new Chart(canvas, {
    type: "bar",
    data: {
      labels,
      datasets: [{
        label: `${kid.name}'s Stars`,
        data: dataArr,
        backgroundColor: bgColors.map(c => c === "#ff6f00" ? "#ff6f00" : gradient),
        borderColor: "#ffb74d",
        borderWidth: 1,
        borderRadius: 10,
        hoverBackgroundColor: "#ff8f00"
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false },
        tooltip: { enabled: true },
        datalabels: { anchor: "end", align: "top", color: "#ff6f00", font: { weight: "bold", size: 14 } }
      },
      scales: {
        x: { ticks: { font: { size: 12 } } },
        y: { beginAtZero: true, max: yMax, ticks: { stepSize: 1 } }
      },
      animation: { duration: 1000, easing: "easeOutBounce" }
    },
    plugins: [ChartDataLabels]
  });
}

window.addEventListener("DOMContentLoaded", createKidsCharts);
</script>


</body>
</html>
