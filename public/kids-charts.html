<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🌞 Kids Daily Stars Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Comic Neue', 'Comic Sans MS', Arial, sans-serif;
      background: linear-gradient(to bottom, #fff8dc 0%, #ffecb3 100%);
      padding: 20px;
      text-align: center;
    }
    #familyName {
      font-size: 2rem;
      font-weight: bold;
      color: #ff6f00;
      text-shadow: 2px 2px #ffe082;
      margin-bottom: 10px;
    }
    #motivation {
      font-size: 1.6rem;
      font-weight: bold;
      margin-bottom: 15px;
      color: #ff6f00;
      text-shadow: 2px 2px #ffe082;
      animation: floatColors 3s infinite alternate, floatY 3s infinite alternate;
    }
    @keyframes floatColors {
      0% { color: #ff6f00; text-shadow: 2px 2px #ffe082; }
      50% { color: #ff9800; text-shadow: 2px 2px #ffcc80; }
      100% { color: #ff6f00; text-shadow: 2px 2px #ffe082; }
    }
    @keyframes floatY {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }
    h2 { 
      color: #ff6f00; 
      font-size: 1.8rem;
      margin-bottom: 15px; 
      text-shadow: 2px 2px #ffe082;
    }
    #logoutBtn {
      background: #ff9800;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 25px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }
    #logoutBtn:hover {
      background: #fb8c00;
      transform: scale(1.05);
    }
    #kidsChartsContainer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
    }
    .chart-card {
      width: 360px;
      background: linear-gradient(to bottom right, #fff3e0, #ffe0b2);
      padding: 20px;
      border-radius: 25px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .chart-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.35);
    }
    .chart-card h3 {
      margin: 10px 0;
      color: #ff6f00;
      font-size: 1.5rem;
    }
    canvas {
      margin-top: 10px;
    }
  </style>
</head>
<body>

<button id="logoutBtn">Logout</button>
<div id="familyName"></div>
<div id="motivation">✨ Keep shining and earn your stars every day! ✨</div>
<h2>📊 Kids Daily Stars</h2>
<div id="kidsChartsContainer"></div>

<script>
document.getElementById("logoutBtn").addEventListener("click", () => {
  localStorage.removeItem("currentUser");
  window.location.href = "login.html";
});

function toLocalYMD(dateStr) {
  const d = new Date(dateStr);
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

async function createKidsCharts() {
  const currentUser = JSON.parse(localStorage.getItem("currentUser"));
  if (!currentUser) { alert("Please log in!"); window.location.href="login.html"; return; }

  // ✅ Show family name
  document.getElementById("familyName").textContent = `🏡 ${currentUser.family}'s Family`;

  const container = document.getElementById("kidsChartsContainer");
  container.innerHTML = "";

  try {
    const API_BASE = window.location.hostname.includes("localhost")
      ? "http://localhost:4000"
      : "https://daily-effort-tracker-backend-production.up.railway.app";

    // ✅ Get only this user's family data
    const res = await fetch(`${API_BASE}/api/families/family/${currentUser.family}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const family = await res.json();

    if (!family.members || family.members.length === 0) {
      container.innerHTML = "<p>No kids found in this family.</p>";
      return;
    }

    for (const kid of family.members) {
      await createChartForKid(kid, API_BASE);
    }

  } catch (err) {
    console.error("Error loading family charts:", err);
    alert("❌ Failed to load family charts!");
  }
}

async function createChartForKid(kid, API_BASE) {
  const container = document.getElementById("kidsChartsContainer");
  const chartCard = document.createElement("div");
  chartCard.className = "chart-card";
  const title = document.createElement("h3");
  title.textContent = `🧒 ${kid.name}`;
  chartCard.appendChild(title);
  const canvas = document.createElement("canvas");
  chartCard.appendChild(canvas);
  container.appendChild(chartCard);

  try {
    const res = await fetch(`${API_BASE}/api/stars/${kid.id}`);
    const starsData = await res.json();

    const days = starsData.map(d => toLocalYMD(d.date));
    const stars = starsData.map(d => d.stars);

    new Chart(canvas, {
      type: "bar",
      data: {
        labels: days,
        datasets: [{
          label: `${kid.name}'s Stars`,
          data: stars,
          backgroundColor: "#ffb74d"
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          tooltip: { enabled: true },
          datalabels: { anchor: 'end', align: 'top', color: '#ff6f00' }
        },
        scales: { y: { beginAtZero: true, max: 5 } }
      },
      plugins: [ChartDataLabels]
    });
  } catch (err) {
    console.error(`Error loading stars for kid ${kid.name}:`, err);
  }
}

window.addEventListener("DOMContentLoaded", createKidsCharts);
</script>

</body>
</html>
