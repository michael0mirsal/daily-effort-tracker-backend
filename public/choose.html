<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Choose Activity 🌻</title>
  <script src="https://www.gstatic.com/charts/loader.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: linear-gradient(135deg, #fceabb, #f8b500);
      font-family: "Comic Sans MS", cursive;
      color: #333;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: auto;
    }

    .circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      animation: float 10s infinite ease-in-out;
      z-index: 0;
    }

    .circle:nth-child(1) { width: 100px; height: 100px; top: 10%; left: 15%; animation-delay: 0s; }
    .circle:nth-child(2) { width: 120px; height: 120px; bottom: 20%; right: 20%; animation-delay: 2s; }
    .circle:nth-child(3) { width: 80px; height: 80px; bottom: 10%; left: 25%; animation-delay: 4s; }

    @keyframes float {
      0%, 100% { transform: translateY(0); opacity: 0.6; }
      50% { transform: translateY(-30px); opacity: 1; }
    }

    h1 { font-size: 2.5rem; margin-bottom: 5px; color: #ff6f00; text-shadow: 2px 2px #fff; z-index: 1; }
    h2 { font-size: 1.6rem; margin-top: 25px; color: #8b4513; text-shadow: 1px 1px #fff; z-index: 1; }

    #options { margin-top: 20px; z-index: 1; }

    #starsBox, #motivationText {
      border-radius: 20px;
      padding: 10px 25px;
      font-size: 1.2rem;
      font-weight: bold;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
      margin-bottom: 15px;
      animation: fadeIn 1.5s ease-in;
    }

    #starsBox { display: none; background: rgba(255, 255, 255, 0.6); color: #d35400; }
    #starsCount { color: #ff4500; font-size: 1.8rem; font-weight: bold; text-shadow: 2px 2px 6px rgba(255,200,0,0.6); display: inline-block; vertical-align: middle; }
    #motivationText { display: none; font-size: 1.4rem; color: #2e8b57; text-shadow: 1px 1px #fff; }

    button {
      display: inline-block;
      margin: 15px;
      padding: 15px 40px;
      font-size: 1.2rem;
      border-radius: 25px;
      border: none;
      cursor: pointer;
      background: linear-gradient(45deg, #fff3cd, #ffe082);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      color: #5c4033;
      transition: all 0.3s ease;
      font-weight: bold;
      z-index: 1;
      position: relative;
    }

    button:hover {
      transform: translateY(-4px) scale(1.05);
      background: linear-gradient(45deg, #fff9c4, #ffecb3);
      box-shadow: 0 6px 14px rgba(0,0,0,0.25);
    }

    #logoutBtn { background: linear-gradient(45deg, #ffb3b3, #ff8080); color: white; margin-top: 40px; }
    #logoutBtn:hover { background: linear-gradient(45deg, #ff9999, #ff6666); }

    footer { position: absolute; bottom: 10px; font-size: 0.9rem; color: rgba(80,50,20,0.6); z-index: 1; }

    /* Family tree container */
    #familyTree {
      width: 100%;
      max-width: 600px;
      height: 400px;
      margin-top: 30px;
      background: rgba(255,255,255,0.7);
      border-radius: 20px;
      padding: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    .highlighted {
      background-color: #ffeb3b !important;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="circle"></div>
  <div class="circle"></div>
  <div class="circle"></div>

  <h1 id="welcomeText">🌞 Welcome!</h1>
  <div id="starsBox">Today you earned <span id="starsCount">0⭐</span> Keep going!</div>
  <div id="motivationText">Keep supporting your kids! 🌟 Check their progress below!</div>
  <div id="options"></div>

  <!-- 🌳 Family Tree will appear here -->
  <div id="familyTree"></div>

  <button id="logoutBtn" onclick="logout()">🔒 Logout</button>
  <footer>Made with 🌻 Love and Joy</footer>

  <script>
    const user = JSON.parse(localStorage.getItem("currentUser") || 'null');
    if (!user) {
      alert("Not logged in");
      window.location.href = "signin.html";
    }

    document.getElementById("welcomeText").innerHTML =
      `🌞 Hello <b>${user.name}</b> from <b>${user.family}</b>!`;

    const optionsDiv = document.getElementById("options");

    function goToDailyEfforts() { window.location.href = "daily-efforts.html"; }
    function goToDailyRoutine() { window.location.href = "routine.html"; }

    if (user.role === "parent") {
      document.getElementById("motivationText").style.display = "block";
      optionsDiv.innerHTML = `
        <h2>👩‍👧 Parent Options</h2>
        <button onclick="window.location.href='kids-charts.html'">📊 View Children's Efforts</button>
      `;
    } else {
      document.getElementById("starsBox").style.display = "block";
      optionsDiv.innerHTML = `
        <h2>🧒 What would you like to do?</h2>
        <button onclick="goToDailyEfforts()">🌟 Daily Efforts</button>
        <button onclick="goToDailyRoutine()">📅 Daily Routine</button>
      `;

      // Load today's stars
      async function loadTodayStars() {
        const today = new Date().toLocaleDateString("en-CA");
        let totalStars = 0;
        try {
          const resEfforts = await fetch(`/api/efforts/search?name=${encodeURIComponent(user.name)}&date=${encodeURIComponent(today)}`);
          const effortsData = await resEfforts.json();
          if (Array.isArray(effortsData)) {
            effortsData.forEach(r => {
              if (Array.isArray(r.items))
                totalStars += r.items.reduce((sum, it) => sum + (Number(it.evaluation) || 0), 0);
            });
          }
          const resRoutines = await fetch(`/api/routines/search?name=${encodeURIComponent(user.name)}&date=${encodeURIComponent(today)}`);
          const routinesData = await resRoutines.json();
          if (Array.isArray(routinesData) && routinesData.length > 0) {
            const items = routinesData[0].items || [];
            totalStars += items.filter(i => i.done).length;
          }
          document.getElementById("starsCount").textContent = `${totalStars}⭐`;
        } catch (err) {
          console.error("❌ Error loading today's stars:", err);
          document.getElementById("starsCount").textContent = "❌ Error";
        }
      }
      loadTodayStars();
    }

    // 🌳 FAMILY TREE LOGIC
    google.charts.load('current', { packages: ["orgchart"] });
    google.charts.setOnLoadCallback(drawTree);

    async function drawTree() {
      const data = new google.visualization.DataTable();
      data.addColumn('string', 'Name');
      data.addColumn('string', 'Manager');
      data.addColumn('string', 'ToolTip');

      // Example: Fetch family from backend later
      // Simulating family from local data:
      const familyMembers = [
        { name: user.family, manager: '', tooltip: 'Family Root' },
        { name: 'Mom', manager: user.family, tooltip: 'Parent' },
        { name: 'Dad', manager: user.family, tooltip: 'Parent' },
        { name: 'Madrona', manager: 'Mom', tooltip: 'Kid' },
        { name: 'Leo', manager: 'Mom', tooltip: 'Kid' }
      ];

      data.addRows(familyMembers.map(m => [m.name, m.manager, m.tooltip]));

      const chart = new google.visualization.OrgChart(document.getElementById('familyTree'));
      chart.draw(data, { allowHtml: true });

      // Highlight the logged-in kid node
      setTimeout(() => {
        const cells = document.querySelectorAll('#familyTree .google-visualization-orgchart-node');
        cells.forEach(cell => {
          if (cell.textContent.includes(user.name)) {
            cell.classList.add('highlighted');
          }
        });
      }, 500);
    }

    function logout() {
      localStorage.removeItem("currentUser");
      window.location.href = "signin.html";
    }
  </script>
</body>
</html>
