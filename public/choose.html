<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Choose Activity 🌻</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: linear-gradient(135deg, #fceabb, #f8b500);
      font-family: "Comic Sans MS", cursive;
      color: #333;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
    }

    /* 🌳 Family Tree Section */
    #familyTree {
      flex: 0 0 35%;
      height: 90%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      border-right: 4px dashed rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.3);
      border-radius: 0 30px 30px 0;
      box-shadow: inset -5px 0 10px rgba(0, 0, 0, 0.1);
      padding: 20px;
    }

    .tree {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .tree-line {
      width: 2px;
      background-color: #8b4513;
      height: 20px;
      margin: 0 auto;
    }

    .member {
      background: #fff3cd;
      padding: 10px 20px;
      border-radius: 50%;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      font-size: 1.1rem;
      color: #5c4033;
      position: relative;
      transition: transform 0.3s ease, background 0.3s ease;
    }

    .member:hover {
      transform: scale(1.1);
      background: #ffecb3;
    }

    .highlighted {
      background: #ffeb3b !important;
      box-shadow: 0 0 20px #ffcc00;
    }

    .parents {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 15px;
      position: relative;
    }

    .children {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 15px;
      position: relative;
    }

    /* connecting lines between parents and children */
    .connector {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 2px;
      background-color: #8b4513;
      z-index: 0;
    }

    /* 🌞 Right Section - main content */
    #mainContent {
      flex: 0 0 65%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      position: relative;
    }

    h1 { font-size: 2.5rem; margin-bottom: 5px; color: #ff6f00; text-shadow: 2px 2px #fff; }
    h2 { font-size: 1.6rem; margin-top: 25px; color: #8b4513; text-shadow: 1px 1px #fff; }

    #starsBox, #motivationText {
      border-radius: 20px;
      padding: 10px 25px;
      font-size: 1.2rem;
      font-weight: bold;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
      margin-bottom: 15px;
    }

    #starsBox { display: none; background: rgba(255, 255, 255, 0.6); color: #d35400; }
    #starsCount { color: #ff4500; font-size: 1.8rem; font-weight: bold; text-shadow: 2px 2px 6px rgba(255,200,0,0.6); }
    #motivationText { display: none; font-size: 1.4rem; color: #2e8b57; text-shadow: 1px 1px #fff; }

    button {
      margin: 15px;
      padding: 15px 40px;
      font-size: 1.2rem;
      border-radius: 25px;
      border: none;
      cursor: pointer;
      background: linear-gradient(45deg, #fff3cd, #ffe082);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      color: #5c4033;
      transition: all 0.3s ease;
      font-weight: bold;
    }

    button:hover {
      transform: translateY(-4px) scale(1.05);
      background: linear-gradient(45deg, #fff9c4, #ffecb3);
    }

    #logoutBtn {
      background: linear-gradient(45deg, #ffb3b3, #ff8080);
      color: white;
      margin-top: 30px;
    }

    #logoutBtn:hover { background: linear-gradient(45deg, #ff9999, #ff6666); }

    footer {
      position: absolute;
      bottom: 10px;
      font-size: 0.9rem;
      color: rgba(80,50,20,0.6);
    }
  </style>
</head>
<body>
  <!-- 🌳 LEFT: Family Tree -->
  <div id="familyTree">
    <div class="tree">
      <div class="member" id="familyRoot">👨‍👩‍👧 The Smith Family</div>
      <div class="tree-line"></div>

      <div class="parents">
        <div class="member" id="mom">👩 Mom</div>
        <div class="member" id="dad">👨 Dad</div>
        <div class="connector"></div>
      </div>

      <div class="tree-line"></div>

      <div class="children">
        <div class="member" id="kid1">🧒 Madrona</div>
        <div class="member" id="kid2">👦 Leo</div>
      </div>
    </div>
  </div>

  <!-- 🌞 RIGHT: Main Page -->
  <div id="mainContent">
    <h1 id="welcomeText">🌞 Welcome!</h1>
    <div id="starsBox">Today you earned <span id="starsCount">0⭐</span> Keep going!</div>
    <div id="motivationText">Keep supporting your kids! 🌟 Check their progress below!</div>
    <div id="options"></div>
    <button id="logoutBtn" onclick="logout()">🔒 Logout</button>
    <footer>Made with 🌻 Love and Joy</footer>
  </div>

  <script>
    const user = JSON.parse(localStorage.getItem("currentUser") || 'null');
    if (!user) {
      alert("Not logged in");
      window.location.href = "signin.html";
    }

    document.getElementById("welcomeText").innerHTML =
      `🌞 Hello <b>${user.name}</b> from <b>${user.family}</b>!`;

    const optionsDiv = document.getElementById("options");

    function goToDailyEfforts() { window.location.href = "daily-efforts.html"; }
    function goToDailyRoutine() { window.location.href = "routine.html"; }

    if (user.role === "parent") {
      document.getElementById("motivationText").style.display = "block";
      optionsDiv.innerHTML = `
        <h2>👩‍👧 Parent Options</h2>
        <button onclick="window.location.href='kids-charts.html'">📊 View Children's Efforts</button>
      `;
    } else {
      document.getElementById("starsBox").style.display = "block";
      optionsDiv.innerHTML = `
        <h2>🧒 What would you like to do?</h2>
        <button onclick="goToDailyEfforts()">🌟 Daily Efforts</button>
        <button onclick="goToDailyRoutine()">📅 Daily Routine</button>
      `;
    }

    // 🌟 Highlight current kid in family tree
    function highlightKid() {
      const kidNodes = document.querySelectorAll('.member');
      kidNodes.forEach(node => {
        if (node.textContent.includes(user.name)) {
          node.classList.add('highlighted');
        }
      });
    }
    highlightKid();

    function logout() {
      localStorage.removeItem("currentUser");
      window.location.href = "signin.html";
    }
  </script>
</body>
</html>
