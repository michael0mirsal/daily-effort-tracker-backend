<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Family Tree - Kids Style</title>

<style>
:root{
  --bg: #0b1220;
  --panel: rgba(255,255,255,.06);
  --panel2: rgba(255,255,255,.10);
  --text: rgba(255,255,255,.92);
  --muted: rgba(255,255,255,.65);
  --line: rgba(255,255,255,.22);
  --ring: rgba(255,255,255,.25);
  --r: 18px;
  --shadow: 0 18px 50px rgba(0,0,0,.35);
}

*{box-sizing:border-box;}
body{
  margin:0;
  height:100vh;
  display:flex;
  color:var(--text);
  font-family: system-ui, sans-serif;
  background:
    radial-gradient(900px 500px at 10% 5%, rgba(130,117,72,.15), transparent 60%),
    radial-gradient(800px 450px at 95% 10%, rgba(6,182,212,.25), transparent 55%),
    linear-gradient(180deg, #232621, #665443d1 10%, #96caa7);
}

/* Layout */
.left-half{
  width:30%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.right-half{
  width:70%;
  background: linear-gradient(180deg, #8c9fc5, #dcdeaf);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:20px;
  text-align:center;
  position:relative;
}

/* Header */
h1{margin:0;font-weight:900;font-size:28px;}
footer{position:absolute;bottom:10px;font-size:0.9rem;color:rgba(80,50,20,0.6);}

/* ================= Tree Container ================= */
.tree {
  width:100%;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

.tree ol {
  list-style:none;
  padding:0;
  margin:0;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.tree li {
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:25px 15px;
}

/* ================= Vertical Line from Parent to Children ================= */
.tree li > ol {
  position:relative;
  margin-top:20px;
}

/* vertical line down from parent to horizontal children line */
.tree li > ol::before {
  content:"";
  position:absolute;
  top:-20px;
  left:50%;
  transform:translateX(-50%);
  width:2px;
  height:20px;
  background:rgba(255,255,255,.5);
  border-radius:2px;
}

/* ================= Horizontal Connector for Children ================= */
.tree li > ol::after {
  content:"";
  position:absolute;
  top:0;
  left:5%;
  width:90%;
  height:2px;
  background:rgba(255,255,255,.5);
  border-radius:2px;
}

/* ================= Vertical Drop from Horizontal Line to Each Child ================= */
.tree li > ol > li::before {
  content:"";
  position:absolute;
  top:-20px;
  left:50%;
  transform:translateX(-50%);
  width:2px;
  height:20px;
  background:rgba(255,255,255,.5);
  border-radius:2px;
}

/* ================= Animations ================= */

@keyframes growDown {
  from { height: 0; opacity: 0; }
  to   { height: 20px; opacity: 1; }
}

@keyframes growAcross {
  from { width: 0; opacity: 0; }
  to   { width: 30%; opacity: 1; }
}

/* Pulsing glow */
@keyframes pulseGlow {
  0%,100% { box-shadow: 0 0 8px rgba(255,255,255,.2); }
  20%     { box-shadow: 0 0 18px rgba(255,255,255,.45); }
}

/* glow animation */
.tree > ol > li > ol::before,
.tree > ol > li > ol::before{
  animation:
    growDown .8s ease-out forwards,
    pulseGlow 3s infinite alternate;
}

/* ================= Person Cards ================= */
.person{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  min-width:140px;
  max-width:100%;
  padding:14px;
  border-radius: var(--r);
  border:1px solid var(--ring);
  background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.05));
  box-shadow: 0 14px 40px rgba(0,0,0,.35);
  backdrop-filter: blur(6px);
}
.person .top{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
}
.person .meta span {
  background: rgba(255, 255, 255, 0.08); /* subtle panel inside shadow box */
  padding: 3px 8px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.18);
  font-size: 12px;
  color: var(--text);
}

.person .meta {
  gap: 6px;       /* space between Age and Class */
  justify-content: center; /* center inside card */
}

.person.highlighted{box-shadow:0 0 25px gold;border:2px solid gold;}
.avatar{
  width:44px; height:44px;
  border-radius:14px;
  display:grid;
  place-items:center;
  font-weight:900;
  letter-spacing:.3px;
  border:1px solid rgba(255,255,255,.25);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
}
.a1{ background: linear-gradient(135deg, rgba(124,58,237,.85), rgba(236,72,153,.65)); }
.a2{ background: linear-gradient(135deg, rgba(6,182,212,.85), rgba(59,130,246,.65)); }
.a3{ background: linear-gradient(135deg, rgba(34,197,94,.85), rgba(245,158,11,.60)); }
.a4{ background: linear-gradient(135deg, rgba(245,158,11,.85), rgba(239,68,68,.65)); }
.a5{ background: linear-gradient(135deg, rgba(59,130,246,.85), rgba(124,58,237,.65)); }
.a6{ background: linear-gradient(135deg, rgba(236,72,153,.85), rgba(245,158,11,.55)); }

.namebox{text-align:left; flex:1 1 auto; min-width:0;}
.name{font-size:15px;font-weight:900;margin:0;line-height:1.1;white-space:normal;}
.meta{margin-top:3px;color:var(--muted);font-size:12px;display:flex;gap:8px;flex-wrap:wrap;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background: rgba(255,255,255,.06);}
.pill b{color: rgba(255,255,255,.85); font-weight:800;}
.note{width:100%;margin-top:2px;padding-top:10px;border-top:1px dashed rgba(255,255,255,.18);color: rgba(255,255,255,.75);font-size:12px;line-height:1.35;text-align:left;}


/* Couple */
.couple{
  display:flex; align-items:stretch; gap:10px;
  position:relative; padding:8px 10px; border-radius:22px;
  background: rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:0 10px 28px rgba(0,0,0,.25);
  flex-wrap:wrap;
}
.couple::after{
  content:""; position:absolute; left:50%; top:10%;
  transform:translate(-50%,-50%);
  width:30px;height:30px;
  border-radius:999px;
  display:grid; place-items:center;
  background: rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.18);
  color: rgba(255,255,255,.80);
  font-size:14px;
  pointer-events:none;
}
.couple .person{min-width:140px;flex:1 1 auto;}
.couple .person .avatar{width:42px;height:42px;border-radius:13px;}


/* Right Panel */
#starsBox,#motivationText{
  border-radius:20px;
  padding:10px 25px;
  font-size:1.2rem;
  font-weight:bold;
  box-shadow:0 3px 10px rgba(0,0,0,0.2);
  margin-bottom:15px;
}
#starsBox{display:none;background:rgba(255,255,255,0.6); color:#d35400;}
#motivationText{display:none;font-size:1.4rem;color:#2e8b57;text-shadow:1px 1px #fff;}

button{
  margin:10px;
  padding:15px 40px;
  font-size:1.2rem;
  border-radius:25px;
  border:none;
  cursor:pointer;
  background:linear-gradient(45deg, #fff3cd, #ffe082);
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
  color:#5c4033;
  transition:all 0.3s ease;
  font-weight:bold;
}
button:hover{ transform:translateY(-4px) scale(1.05); }
#logoutBtn{background:linear-gradient(45deg,#ffb3b3,#ff8080); color:white; margin-top:30px;}

@media (max-width:900px){
  body{flex-direction:column;}
  .left-half, .right-half{width:100%;}
}

.open-report-btn {
    background: linear-gradient(135deg, #4f8cff, #3b6be3);
    color: #ffe082;
    border: none;
    border-radius: 14px;
    padding: 16px 24px;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(0,0,0,.3);
  }

  .open-report-btn:hover {
    transform: translateY(-2px);
    opacity: 0.95;
  }
.bus-button {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 20px;
  font-size: 16px;
  background: linear-gradient(90deg, #007bff, #00aaff);
  color: white;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  transition: transform 0.2s, box-shadow 0.2s;
}

.bus-button .bus-icon {
  font-size: 24px;
}

.bus-button:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 12px rgba(0,0,0,0.3);
}

</style>
</head>

<body>

<div class="left-half">
  <h1>🌳 Family Tree</h1>
  <section class="tree" id="treeContainer">Loading tree...</section>
</div>

<div class="right-half">
  <h1 id="welcomeText">🌞 Welcome!</h1>
  <div id="starsBox"></div>
  <div id="motivationText">Keep supporting your kids! 🌟</div>
  <!-- 🔵 NEW: Notification Panel -->
<div id="notificationPanel" style="position: fixed; top: 20px; right: 20px; width: 320px; max-height: 500px; overflow-y:auto; z-index:1000;">
  <h3 style="margin:0 0 5px 0;">🔔 Notifications</h3>
  <ul id="notificationList" aria-live="polite" style="list-style:none; padding:0; margin:0; font-size:14px;"></ul>
</div>

  <div id="options"></div>
  <button id="openFamAttendance" class="bus-button" onclick="openfamilyattendance()">
  <span class="bus-icon">🚌</span>
  Attendance
</button>

  <button class="open-report-btn" id="nurseryReportBtn" onclick="openNurseryReport()">
  📘 Nursery Daily Report
</button>


  <button id="logoutBtn" onclick="logout()">🔒 Logout</button>
  <footer>Made with 🌻 Love and Joy</footer>
</div>

<script>
const API_BASE = "https://daily-effort-tracker-backend.onrender.com";
const user = JSON.parse(localStorage.getItem("currentUser") || "null");

// 🔵 NEW — Set nursery name dynamically on button
function setNurseryButtonName(name) {
  const btn = document.getElementById("nurseryReportBtn");
  if (btn) btn.innerText = `📘 ${name} Daily Report`;
}


if (!user) {
  alert("Not logged in");
  window.location.href = "signin.html";
}

document.getElementById("welcomeText").innerHTML =
  `🌞 Hello <b>${user.name}</b>, <b>${user.family}</b> Family!`;


// ================= Load Family Tree =================
async function loadFamilyTree() {
  const treeDiv = document.getElementById("treeContainer");
  treeDiv.innerHTML = "Loading family tree...";

  if (!user.familyId || user.familyId.length !== 24) {
    treeDiv.innerHTML = "❌ Invalid family ID";
    return;
  }

  try {
    // Fetch family + school info (members with class & nursery)
    const res = await fetch(`${API_BASE}/api/families/${user.familyId}/school-info`, {
      headers: {
        "Content-Type": "application/json",
        "x-family-id": user.familyId
      }
    });

    const data = await res.json();
    if (!data.success) {
      treeDiv.innerHTML = "❌ Failed to load family info";
      return;
    }

    const family = data.family;
    const members = data.members;

    treeDiv.innerHTML = `
      <ol>
        <li>
          <div class="person">
            <div class="name">👨‍👩‍👧 ${family.name}</div>
          </div>
          <ol>
            <li>
              <div class="couple">
                <div class="person"><div class="name">👩 ${family.mom}</div></div>
                <div class="person"><div class="name">👨 ${family.dad}</div></div>
              </div>
              <ol>
                ${members.map(k => `
                  <li>
                    <div class="person ${k.name.toLowerCase() === user.name.toLowerCase() ? 'highlighted' : ''}">
                      <div class="name">🧒 ${k.name}</div>
                      <div class="meta">
                        <span>Age: ${k.age || "-"}</span>
                        <span>Nursery: ${k.nursery?.name || "-"}</span>
                        <span>Class: ${k.class?.name || "-"}</span>
                        <span>Status: ${k.status || "-"}</span>
                      </div>
                    </div>
                  </li>
                `).join("")}
              </ol>
            </li>
          </ol>
        </li>
      </ol>
    `;
localStorage.setItem("currentFamilyMembers", JSON.stringify(members));
// 🔵 Pick current kid
    if (members.length) {
  const kid = members.find(k => k.name.toLowerCase() === user.name.toLowerCase()) || members[0];

  // Set nursery button
  setNurseryButtonName(kid.nursery?.name || "Nursery");

  // ✅ Save BOTH IDs correctly
  localStorage.setItem("currentFamilyMemberId", kid._id);      // Family table ID
  localStorage.setItem("currentSchoolMemberId", kid.schoolMemberId || kid._id); // School/Nursery ID
}




  } catch (err) {
    treeDiv.innerHTML = "❌ Failed to load family tree";
    console.error(err);
  }
}

function openNurseryReport() {
  const members = JSON.parse(localStorage.getItem("currentFamilyMembers") || "[]");

  if (!members.length) {
    alert("No family members loaded");
    return;
  }

  let kid = members.find(k => k.name.toLowerCase() === user.name.toLowerCase());
  if (!kid) kid = members[0];

  if (!kid.class || !kid.class._id) {
    alert("This child has no class assigned");
    return;
  }

  if (!kid._id || !kid.schoolMemberId) {
    alert("Invalid kid object");
    console.error("Invalid kid object:", kid);
    return;
  }

  // Save class
  localStorage.setItem("reportClass", JSON.stringify({
    _id: kid.class._id,
    name: kid.class.name,
    members: members.filter(m => m.class?._id === kid.class._id)
  }));

  // ✅ Save IDs correctly
  localStorage.setItem("reportMemberId", kid._id);              // Family member ID
  localStorage.setItem("reportMemberSchoolId", kid.schoolMemberId); // Nursery member ID

  // Open report page
  window.location.href = "./schtofamily-report.html";
}


function openfamilyattendance() {
  const members = JSON.parse(localStorage.getItem("currentFamilyMembers") || "[]");
  const user = JSON.parse(localStorage.getItem("currentUser") || "{}");

  if (!members.length) {
    alert("No family members loaded");
    return;
  }

  // Pick logged-in kid (fallback to first)
  let kid = members.find(k => k.name?.toLowerCase() === user.name?.toLowerCase());
  if (!kid) kid = members[0];

  if (!kid.class || !kid.class._id) {
    alert("This child has no class assigned");
    return;
  }

  if (!kid._id || !kid.schoolMemberId) {
    console.error("Invalid kid object", kid);
    alert("Invalid kid object");
    return;
  }

  // ================= SAVE CLASS =================
  localStorage.setItem("reportClass", JSON.stringify({
    _id: kid.class._id,
    name: kid.class.name
  }));

  // ================= SAVE FAMILY =================
  localStorage.setItem("reportFamily", JSON.stringify({
    _id: kid.familyId,
    name: kid.familyName || user.familyName || "Zarif"
  }));

  // ================= SAVE NURSERY =================
  const nurseryId = kid.nursery || kid.class?.nurseryId;
const nurseryName = kid.nurseryName || kid.class?.nurseryName || "To Be Me";

if (!nurseryId) {
  console.error("❌ Nursery ID is missing for this kid or class");
  alert("Cannot open attendance: Nursery not found");
  return;
}

localStorage.setItem("reportNursery", JSON.stringify({
  _id: nurseryId,
  name: nurseryName
}));

console.log("Saved Nursery object:", { _id: nurseryId, name: nurseryName });

  // ================= SAVE IDS =================
  localStorage.setItem("reportMemberId", kid._id);                 // family member
  localStorage.setItem("reportMemberSchoolId", kid.schoolMemberId); // nursery member

  // ================= DEBUG =================
  console.log("Saved Family:", kid.familyName);
  console.log("Saved Nursery:", nurseryName, "ID:", nurseryId);
  console.log("Saved Class:", kid.class.name);

  // ================= OPEN PAGE =================
  window.location.href = "./fam-attendance.html";
}




// ================= Load Stars =================
async function loadStars() {
  const starsBox = document.getElementById("starsBox");

  try {
    const res = await fetch(`${API_BASE}/api/kidsStars/week?family=${user.family}`);
    const allStars = await res.json();

    const today = new Date().toISOString().split("T")[0];
    const kidData = allStars.find(k => k.name === user.name && k.family === user.family);

    let todayStars = 0;
    if (kidData) {
      const todayRecord = kidData.starsPerDay.find(s => s.date === today);
      if (todayRecord) todayStars = todayRecord.stars;
    }

    if (user.role === "kid") {
      starsBox.style.display = "block";
      starsBox.innerHTML = `🌟 You earned <b>${todayStars}⭐</b> today!`;
    }

  } catch (err) {
    console.error(err);
  }
}


// ================= Role UI =================
const optionsDiv = document.getElementById("options");

if (user.role === "dad" || user.role === "mom") {
  document.getElementById("motivationText").style.display = "block";

  // Save familyId for other pages
  // Save family info for other pages
  localStorage.setItem('currentFamily', JSON.stringify({ family: user.family, passkey: user.passkey }));

  optionsDiv.innerHTML = `
    <h2>👩‍👧 Parent Options</h2>

    <button onclick="window.location.href='add-kids.html'">
      ➕ Add / Manage Kids
    </button>

    <button onclick="window.location.href='kids-charts.html'">
      📊 View Children's Efforts
    </button>
  `;
}


else if (user.role === "kid") {
  optionsDiv.innerHTML = `
    <h2>🧒 What would you like to do?</h2>
    <button onclick="window.location.href='index.html'">🌟 Daily Activities</button>
    <button onclick="window.location.href='routine.html'">📅 Daily Routine</button>
  `;
}


// ================= Logout =================
function logout() {
  localStorage.removeItem("currentUser");
  window.location.href = "signin.html";
}


// ================= Init =================
loadFamilyTree();
loadStars();
</script>
<!-- 🔵 NEW: Socket.IO client -->
<script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
<script>
if (!user) {
  console.warn("No user found. Notifications will not work.");
} else {
  const socket = io("https://daily-effort-tracker-backend.onrender.com");

  // ✅ Get the schoolMemberId saved from family tree
  const schoolMemberId = localStorage.getItem("currentSchoolMemberId");

if (schoolMemberId) {
  console.log("Joining socket room for kid:", schoolMemberId);
  socket.emit("join", schoolMemberId);
  } else {
    console.warn("No schoolMemberId found in localStorage");
  }

  // 🔔 Listen for notifications
  socket.on("notification", (data) => {
    console.log("🔔 New notification:", data);
    const notificationList = document.getElementById("notificationList");
    if (!notificationList) return;

    const li = document.createElement("li");
    li.style.background = "#fff3cd";
    li.style.border = "1px solid #ffeeba";
    li.style.padding = "8px 12px";
    li.style.marginBottom = "6px";
    li.style.borderRadius = "8px";
    li.innerHTML = `
      <b>${data.type}</b>: ${data.message}<br>
      <small>${new Date().toLocaleTimeString()}</small>
    `;
    notificationList.prepend(li);
  });
}
</script>





</body>
</html>
