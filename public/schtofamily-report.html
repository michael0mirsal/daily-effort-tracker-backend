<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Daily Report</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #6e51eb, #7ca4f5, #f2f28c);
      background-attachment: fixed;
      color: #fff;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .toolbar {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    select, input[type="date"], button {
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    button {
      background: #4f8cff;
      color: white;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .report-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .child-card {
      background: rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }

    .child-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      padding: 6px 12px;
      border-radius: 12px;
      background: #ffc107;
      color: #000;
      font-weight: bold;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
      gap: 15px;
      margin: 20px 0;
    }

    .kpi {
      background: rgba(255,255,255,.08);
      padding: 15px;
      border-radius: 12px;
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid rgba(255,255,255,.2);
      text-align: left;
    }

    .empty {
      opacity: 0.7;
      font-style: italic;
    }
    /* TOP BAR */
#topButtons {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-bottom: 20px;
}

button {
  padding: 10px 18px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-weight: 600;
}

#backBtn { background: #ecf0f1; }
#logoutBtn { background: var(--danger); color: white; }

  </style>
</head>

<body>

<div class="container">

  <h1 id="pageTitle">📘 Daily Performance Report</h1>
<h2 id="memberTitle"></h2>
<p id="reportDateTitle"></p>

<div id="topButtons">
        <button id="backBtn">⬅ Back</button>
        <button id="logoutBtn">Logout</button>
      </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <input type="date" id="reportDate" />
    <button onclick="loadKidReport()">Load Report</button>
  </div>

  <!-- Report Area -->
  <div id="reportContent"></div>

</div>

<script>
// ===== CONFIG =====
const API = "https://daily-effort-tracker-backend.onrender.com/api";

// ===== Load Signed-in Kid from localStorage =====
const currentFamilyMembers = JSON.parse(localStorage.getItem("currentFamilyMembers") || "[]");
const reportMemberId = localStorage.getItem("reportMemberId");
const reportMemberClassId = localStorage.getItem("reportMemberClassId");

const currentUser = currentFamilyMembers.find(
  m => m._id === reportMemberId || m.schoolMemberId === reportMemberId
);

/*
if (!currentUser || !currentUser._id) {
  alert("No signed in user found");
  window.location.href = "login.html";
}
*/
if (!currentUser.schoolMemberId) {
  console.warn("Warning: current user has no schoolMemberId, report may fail.");
}

const currentClass = JSON.parse(localStorage.getItem("reportClass"));
if (!currentClass || !currentClass.members || !currentClass.members.length) {
  alert("No nursery class found");
  window.location.href = "choose.html";
}

// ===== DOM Elements =====
const dateInput = document.getElementById("reportDate");
const reportArea = document.getElementById("reportContent");
dateInput.value = new Date().toISOString().slice(0,10);

// ===== Helpers =====
function getSelectedDate() { return dateInput.value; }

function updatePageTitle(nurseryName, memberName) {
  document.getElementById("pageTitle").innerHTML = `📘 ${nurseryName}`;
  document.getElementById("memberTitle").innerHTML = `Daily Performance Report for <b>${memberName}</b>`;
  document.getElementById("reportDateTitle").innerHTML = new Date(getSelectedDate()).toLocaleDateString();
}

// ===== Load Report for Signed-in Kid =====
async function loadKidReport() {
  // Use schoolMemberId if exists, otherwise kid's _id
  const reportMemberSchoolId = currentUser.schoolMemberId || currentUser._id;
  const memberName = currentUser.name || "Student";
  const date = getSelectedDate();

  updatePageTitle(currentClass.name, memberName);
  reportArea.innerHTML = `<h2>Loading Report (${date})...</h2>`;

  console.log("Report for member:", memberName);
  console.log("Family member ID:", currentUser._id);
  console.log("Class/Nursery member ID (used for filtering):", reportMemberSchoolId);

  try {
    // Fetch routines and activities for the class
    const [rRes, aRes] = await Promise.all([
      fetch(`${API}/sch-routine/load?classId=${currentClass._id}&date=${date}`),
      fetch(`${API}/sch-activities?classId=${currentClass._id}&date=${date}`)
    ]);

    let routines = rRes.ok ? await rRes.json() : [];
    if (!Array.isArray(routines)) routines = [routines];
    const activities = aRes.ok ? await aRes.json() : [];

    // Initialize kid report object
    const kid = {
      id: reportMemberSchoolId,
      name: memberName,
      totalTime: 0,
      routineStars: 0,
      activityStars: 0,
      routines: [],
      activities: []
    };

    // ===== Load routines =====
    routines.forEach(r => {
      const kidId = String(r.schoolMemberId || r.schoolMember || r.kidmember || r.kidId);
      const reportId = String(reportMemberSchoolId);

      console.log("Routine check:", kidId, "vs", reportId); // debug

      if (kidId !== reportId) return;

      (r.items || []).forEach(it => {
        if (it.done === true) {
          kid.routineStars += 1;
          kid.routines.push({ task: it.task, section: it.section });
        }
      });
    });

    // ===== Load activities =====
    activities.forEach(doc => {
      const kidId = String(doc.schoolMemberId || doc.schoolMember || doc.kidmember);
      const reportId = String(reportMemberSchoolId);

      console.log("Activity check:", kidId, "vs", reportId); // debug

      if (kidId !== reportId) return;

      (doc.items || []).forEach(it => {
        kid.totalTime += Number(it.timeMin || 0);
        kid.activityStars += Number(it.evaluation || 0);
        kid.activities.push(it);
      });
    });

    // ===== Render Report =====
    const totalStars = kid.routineStars + kid.activityStars;
    const grouped = {};
    kid.routines.forEach(r => {
      if (!grouped[r.section]) grouped[r.section] = [];
      grouped[r.section].push(r.task);
    });

    reportArea.innerHTML = `
      <div class="child-card">
        <div class="child-title">
          <h2>🧒 ${kid.name}</h2>
          <span class="badge">${totalStars} ⭐ Total</span>
        </div>
        <div class="kpi-grid">
          <div class="kpi"><h3>Total Time</h3><strong>${kid.totalTime} min</strong></div>
          <div class="kpi"><h3>Routine Stars</h3><strong>${kid.routineStars} ⭐</strong></div>
          <div class="kpi"><h3>Activity Stars</h3><strong>${kid.activityStars} ⭐</strong></div>
        </div>

        <h3>✅ Completed Routines</h3>
        ${
          kid.routines.length
            ? Object.entries(grouped).map(([section,tasks]) =>
                `<strong>${section.toUpperCase()}</strong>
                 <ul>${tasks.map(t => `<li>${t}</li>`).join('')}</ul>`
              ).join('')
            : `<p class="empty">No completed routines</p>`
        }

        <h3>📊 Activities</h3>
        ${
          kid.activities.length
            ? `<table>
                 <tr><th>Activity</th><th>Time</th><th>Stars</th><th>Note</th></tr>
                 ${kid.activities.map(a => `<tr>
                   <td>${a.activity}</td>
                   <td>${a.timeMin} min</td>
                   <td>${a.evaluation} ⭐</td>
                   <td>${a.note || "-"}</td>
                 </tr>`).join('')}
               </table>`
            : `<p class="empty">No activities recorded</p>`
        }
      </div>
    `;
  } catch(err) {
    console.error(err);
    reportArea.innerHTML = `<p style="color:red;">Error loading report</p>`;
  }
}

// ===== Event Listeners =====
dateInput.addEventListener("change", loadKidReport);

// ===== Auto Load =====
loadKidReport();

const backBtn = document.getElementById("backBtn");
  if (backBtn) backBtn.onclick = () => window.location.href = "sch-choose.html";

// ===== Logout =====
function logout() {
  localStorage.removeItem("currentUser");
  window.location.href = "login.html";
}
</script>





</body>
</html>
