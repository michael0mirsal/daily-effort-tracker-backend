<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Daily Report</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: #fff;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .toolbar {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    select, input[type="date"], button {
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    button {
      background: #4f8cff;
      color: white;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .report-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .child-card {
      background: rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }

    .child-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      padding: 6px 12px;
      border-radius: 12px;
      background: #ffc107;
      color: #000;
      font-weight: bold;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
      gap: 15px;
      margin: 20px 0;
    }

    .kpi {
      background: rgba(255,255,255,.08);
      padding: 15px;
      border-radius: 12px;
      text-align: center;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid rgba(255,255,255,.2);
      text-align: left;
    }

    .empty {
      opacity: 0.7;
      font-style: italic;
    }
    
  </style>
</head>

<body>

<div class="container">

  <h1 id="pageTitle">📘 Daily Performance Report</h1>
<h2 id="memberTitle"></h2>
<p id="reportDateTitle"></p>


  <!-- Toolbar -->
  <div class="toolbar">
    <select id="memberSelect"></select>
    <input type="date" id="reportDate" />
    <button onclick="loadSelectedMemberReport()">Load Report</button>
  </div>

  <!-- Report Area -->
  <div id="reportContent"></div>

</div>

<script>
// ===== CONFIG =====
const API = "https://daily-effort-tracker-backend.onrender.com/api";

// ===== Load Signed-in Kid from reportMemberId =====
const currentFamilyMembers = JSON.parse(localStorage.getItem("currentFamilyMembers") || "[]");
const reportMemberId = localStorage.getItem("reportMemberId");
const currentUser = currentFamilyMembers.find(m => m._id === reportMemberId);

if (!currentUser || !currentUser._id) {
  alert("No signed in user found");
  window.location.href = "login.html";
}

const currentClass = JSON.parse(localStorage.getItem("reportClass"));
if (!currentClass || !currentClass.members || !currentClass.members.length) {
  alert("No nursery class found");
  window.location.href = "choose.html";
}

// ===== DOM Elements =====
const dateInput = document.getElementById("reportDate");
const reportArea = document.getElementById("reportContent");
dateInput.value = new Date().toISOString().slice(0,10);

// ===== Helpers =====
function getSelectedDate() { return dateInput.value; }

function updatePageTitle(nurseryName, memberName) {
  document.getElementById("pageTitle").innerHTML = `📘 ${nurseryName}`;
  document.getElementById("memberTitle").innerHTML = `Daily Performance Report for <b>${memberName}</b>`;
  document.getElementById("reportDateTitle").innerHTML = new Date(getSelectedDate()).toLocaleDateString();
}

// ===== Load Report for Selected Kid =====
async function loadKidReport() {
  const memberId = currentUser._id;
  const memberName = currentUser.name || "Student";
  const date = getSelectedDate();

  updatePageTitle(currentClass.name, memberName);
  reportArea.innerHTML = `<h2>Loading Report (${date})...</h2>`;

  try {
    const [rRes, aRes] = await Promise.all([
      fetch(`${API}/sch-routine/load?classId=${currentClass._id}&date=${date}`),
      fetch(`${API}/sch-activities?classId=${currentClass._id}&date=${date}`)
    ]);

    let routines = rRes.ok ? await rRes.json() : [];
    if (!Array.isArray(routines)) routines = [routines];

    const activities = aRes.ok ? await aRes.json() : [];

    const kid = { id: memberId, name: memberName, totalTime:0, routineStars:0, activityStars:0, routines:[], activities:[] };

    // ===== Activities =====
    activities.forEach(doc => {
      const kidId = String(doc.schoolMember || doc.schoolMemberId || doc.kidmember);
      if (kidId !== memberId) return;
      (doc.items||[]).forEach(it => {
        kid.totalTime += Number(it.timeMin||0);
        kid.activityStars += Number(it.evaluation||0);
        kid.activities.push(it);
      });
    });

    // ===== Routines =====
    routines.forEach(r => {
      const kidId = String(r.schoolMember || r.schoolMemberId || r.kidmember || r.kidId);
      if (kidId !== memberId) return;
      (r.items||[]).forEach(it => {
        if (it.done===true) {
          kid.routineStars += 1;
          kid.routines.push({ task: it.task, section: it.section });
        }
      });
    });

    const totalStars = kid.routineStars + kid.activityStars;
    const grouped = {};
    kid.routines.forEach(r => {
      if (!grouped[r.section]) grouped[r.section] = [];
      grouped[r.section].push(r.task);
    });

    // ===== Render =====
    reportArea.innerHTML = `
      <div class="child-card">
        <div class="child-title">
          <h2>🧒 ${kid.name}</h2>
          <span class="badge">${totalStars} ⭐ Total</span>
        </div>
        <div class="kpi-grid">
          <div class="kpi"><h3>Total Time</h3><strong>${kid.totalTime} min</strong></div>
          <div class="kpi"><h3>Routine Stars</h3><strong>${kid.routineStars} ⭐</strong></div>
          <div class="kpi"><h3>Activity Stars</h3><strong>${kid.activityStars} ⭐</strong></div>
        </div>
        <h3>✅ Completed Routines</h3>
        ${
          kid.routines.length
            ? Object.entries(grouped).map(([section,tasks]) => 
                `<strong>${section.toUpperCase()}</strong><ul>${tasks.map(t=>`<li>${t}</li>`).join('')}</ul>`).join('')
            : `<p class="empty">No completed routines</p>`
        }
        <h3>📊 Activities</h3>
        ${
          kid.activities.length
            ? `<table>
                <tr><th>Activity</th><th>Time</th><th>Stars</th><th>Note</th></tr>
                ${kid.activities.map(a=>`<tr>
                  <td>${a.activity}</td><td>${a.timeMin} min</td><td>${a.evaluation} ⭐</td><td>${a.note||"-"}</td>
                </tr>`).join('')}
              </table>`
            : `<p class="empty">No activities recorded</p>`
        }
      </div>
    `;
  } catch(err) {
    console.error(err);
    reportArea.innerHTML = `<p style="color:red;">Error loading report</p>`;
  }
}

// ===== Event Listeners =====
dateInput.addEventListener("change", loadKidReport);

// ===== Auto Load =====
loadKidReport();

// ===== Logout =====
function logout() {
  localStorage.removeItem("currentUser");
  window.location.href = "login.html";
}
</script>




</body>
</html>
