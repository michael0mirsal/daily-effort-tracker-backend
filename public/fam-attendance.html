<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Family Attendance</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f5;
  padding: 20px;
}

/* ================= PAGE ================= */
h1 {
  text-align: center;
  white-space: pre-line;
}

.pads {
  display: flex;
  gap: 20px;
  margin-top: 20px;
}

.pad {
  flex: 1;
  min-height: 420px;
  background: white;
  border-radius: 12px;
  padding: 15px;
  border: 2px dashed #ccc;
}

.home-pad { border-color: #28a745; }
.bus-pad { border-color: #007bff; }

.pad h2 {
  text-align: center;
}

/* ================= MEMBER ================= */
.member {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #f8f9fa;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 8px;
  cursor: grab;
}

.member.current-user {
  border: 2px solid #ffc107;
  background: #fff3cd;
}

.avatar {
  width: 40px;
  height: 40px;
  background: #6c757d;
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.status {
  font-size: 12px;
  color: #666;
}
</style>
</head>

<body>

<h1 id="attendanceTitle">Family Attendance</h1>

<div class="pads">
  <div class="pad bus-pad" ondrop="drop(event)" ondragover="allowDrop(event)">
    <h2>🚌 Bus</h2>
    <div id="busPad"></div>
  </div>

  <div class="pad home-pad" ondrop="drop(event)" ondragover="allowDrop(event)">
    <h2>🏠 Home</h2>
    <div id="homePad"></div>
  </div>
</div>

<script>
// ===== CONFIG =====
const API = "https://daily-effort-tracker-backend.onrender.com/api";

// ===== Load Family/Class Info from localStorage =====
const currentFamilyMembers = JSON.parse(localStorage.getItem("currentFamilyMembers") || "[]");
const reportMemberId = localStorage.getItem("reportMemberId");
const currentClass = JSON.parse(localStorage.getItem("reportClass"));
const currentNursery = JSON.parse(localStorage.getItem("reportNursery") || "{}");

if (!currentClass || !currentClass.members || !currentClass.members.length) {
  alert("No member class found");
  window.location.href = "choose.html";
}

const currentUser = currentFamilyMembers.find(
  m => m._id === reportMemberId || m.schoolMemberId === reportMemberId
);

// ===== DOM Elements =====
const homePad = document.getElementById("homePad");
const busPad = document.getElementById("busPad");
const attendanceTitle = document.getElementById("attendanceTitle");

// ===== DRAG & DROP =====
function allowDrop(ev) { ev.preventDefault(); }
function drag(ev) { ev.dataTransfer.setData("id", ev.target.id); }
function drop(ev) {
  ev.preventDefault();
  const id = ev.dataTransfer.getData("id");
  const el = document.getElementById(id);
  ev.currentTarget.appendChild(el);

  const status = el.querySelector(".status");
  status.textContent = ev.currentTarget.classList.contains("home-pad")
    ? "Status: Home"
    : "Status: On Bus";
}

// ===== DAILY RESET =====
function shouldResetAttendance() {
  const now = new Date();
  const hour = now.getHours();
  const today = now.toISOString().split("T")[0];
  const lastReset = localStorage.getItem("attendanceLastReset");

  if (hour >= 7 && lastReset !== today) {
    localStorage.setItem("attendanceLastReset", today);
    return true;
  }
  return false;
}

// ===== RENDER MEMBERS =====
function renderMembers() {
  homePad.innerHTML = "";
  busPad.innerHTML = "";

  const members = currentClass.members || [];

  members.forEach(m => {
    const div = document.createElement("div");
    div.className = "member";
    div.id = m._id;
    div.draggable = true;
    div.ondragstart = drag;

    div.innerHTML = `
      <div class="avatar">${m.name[0]}</div>
      <div>
        <div>${m.name}</div>
        <div class="status">Status: ${m.familyId === currentUser.familyId ? "Home" : "On Bus"}</div>
      </div>
    `;

    // Logged-in member highlighted
    if (m._id === currentUser._id) div.classList.add("current-user");

    // Add to correct pad
    
      homePad.appendChild(div);
    
    
    
  });

  // Update page title: Family – Nursery – Class
  const familyName = currentUser?.familyName || "Family";
  const nurseryName = currentNursery?.name || "Nursery";
  const className = currentClass?.name || "Member Class";
  attendanceTitle.textContent = `${familyName} – ${nurseryName} – ${className}\nAttendance`;
}

// ===== INIT =====
if (shouldResetAttendance()) {
  renderMembers(); // reset pads at 7 AM
} else {
  renderMembers(); // otherwise just render
}

</script>
</body>
</html>
