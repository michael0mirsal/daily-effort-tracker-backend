<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Family Attendance</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f5;
  padding: 20px;
}

/* ================= PAGE ================= */
h1 {
  text-align: center;
  white-space: pre-line;
}

.pads {
  display: flex;
  gap: 20px;
  margin-top: 20px;
}

.pad {
  flex: 1;
  min-height: 420px;
  background: white;
  border-radius: 12px;
  padding: 15px;
  border: 2px dashed #ccc;
}

.home-pad { border-color: #28a745; }
.bus-pad { border-color: #007bff; }

.pad h2 {
  text-align: center;
}

/* ================= MEMBER ================= */
.member {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #f8f9fa;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 8px;
  cursor: grab;
}

.member.current-user {
  border: 2px solid #ffc107;
  background: #fff3cd;
}

.avatar {
  width: 40px;
  height: 40px;
  background: #6c757d;
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.status {
  font-size: 12px;
  color: #666;
}

/* ===== Mood Popup ===== */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 2000;
}

.popup {
  background: white;
  max-width: 420px;
  width: 90%;
  border-radius: 18px;
  padding: 30px;
  text-align: center;
}

.moods {
  margin-top: 25px;
  font-size: 52px;
}

.mood-btn {
  cursor: pointer;
  margin: 0 10px;
}

.mood-btn.selected {
  transform: scale(1.3);
}

.close-btn {
  position: absolute;
  right: 18px;
  top: 14px;
  cursor: pointer;
}

</style>
</head>

<body>

<h1 id="attendanceTitle">Attendance</h1>

<div class="pads" id="pads">
  <div class="pad bus-pad" ondrop="drop(event)" ondragover="allowDrop(event)">
    <h2>🚌 Bus</h2>
    <div id="busPad"></div>
  </div>

  <div class="pad home-pad" ondrop="drop(event)" ondragover="allowDrop(event)">
    <h2>🏠 Home</h2>
    <div id="homePad"></div>
  </div>
</div>

<div id="onClassLabel" style="display:none; text-align:center; font-size:24px; margin-top:50px; font-weight:bold;"></div>

<!-- ========== KID MOOD POPUP ========== -->
<div class="overlay" id="moodOverlay">
  <div class="popup">
    <div class="close-btn" onclick="closeMoodPopup()">✖</div>

    <h2>How did you feel today?</h2>
    <p>Choose the face that shows your feeling</p>

    <div class="moods">
      <span class="mood-btn" data-mood="very_happy">😄</span>
      <span class="mood-btn" data-mood="happy">🙂</span>
      <span class="mood-btn" data-mood="okay">😐</span>
      <span class="mood-btn" data-mood="sad">🙁</span>
      <span class="mood-btn" data-mood="very_sad">😢</span>
    </div>

    <div id="moodStatus" class="status"></div>
  </div>
</div>


<script>
// ================= CONFIG =================
const API = "https://daily-effort-tracker-backend.onrender.com/api";

// ================= LOAD CONTEXT =================
const currentFamilyMembers = JSON.parse(localStorage.getItem("currentFamilyMembers") || "[]");
const reportClass = JSON.parse(localStorage.getItem("reportClass") || "{}");
const reportFamily = JSON.parse(localStorage.getItem("reportFamily") || "{}");
const reportNursery = JSON.parse(localStorage.getItem("reportNursery") || "{}");
const reportMemberId = localStorage.getItem("reportMemberId");
const reportMemberSchoolId = localStorage.getItem("reportMemberSchoolId");

// ================= VALIDATION =================
if (!reportClass?._id || !reportMemberId) {
  alert("Attendance context missing");
  window.location.href = "choose.html";
}

// ================= FIND LOGGED-IN MEMBER =================
const currentUser = currentFamilyMembers.find(m => m._id === reportMemberId);
if (!currentUser) {
  alert("Logged-in family member not found");
  window.location.href = "choose.html";
}

async function fetchTodayAttendance() {
  const today = new Date().toISOString().split("T")[0];

  if (!reportClass?._id || !today) {
    console.warn("⛔ Skipping attendance fetch — missing classId or date");
    return [];
  }

  const params = new URLSearchParams({
    classId: reportClass._id,
    date: today
  });

  const res = await fetch(`${API}/attendance?${params.toString()}`);

  if (!res.ok) {
    const text = await res.text();
    console.error("Attendance fetch failed:", text);
    return [];
  }

  const json = await res.json();
  return json.data || [];
}

async function hasMoodForToday() {
  const today = getToday();

  if (!reportClass?._id || !reportMemberSchoolId) return false;

  const params = new URLSearchParams({
    classId: reportClass._id,
    date: today
  });

  try {
    const res = await fetch(`${API}/mood?${params.toString()}`);
    if (!res.ok) return false;

    const json = await res.json();
    const moods = json.data || [];

    return moods.some(
      m => m.schoolMember?._id === reportMemberSchoolId
    );
  } catch (err) {
    console.error("Mood check failed:", err);
    return false;
  }
}


// ================= DOM =================
const homePad = document.getElementById("homePad");
const busPad = document.getElementById("busPad");
const attendanceTitle = document.getElementById("attendanceTitle");

// ================= HELPERS =================
function allowDrop(ev) { ev.preventDefault(); }
function drag(ev) { ev.dataTransfer.setData("id", ev.target.id); }
function getToday() { return new Date().toISOString().split("T")[0]; }
function getCurrentTime() { return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: true }); }
// ✅ Decide if mood popup should appear
function shouldShowMoodPopup(currentAttendance, previousAttendance) {
  if (!currentAttendance || !previousAttendance) return false;

  if (currentAttendance._id === previousAttendance._id) return false;

  const currentStatus = currentAttendance.status;
  const currentNotes = (currentAttendance.notes || "").toLowerCase();

  const prevStatus = previousAttendance.status;
  const prevNotes = (previousAttendance.notes || "").toLowerCase();

  return (
    currentStatus === "absent" &&
    currentNotes.includes("marked by parent") &&
    prevStatus === "leave" &&
    prevNotes.includes("marked by teacher")
  );
}



// ================= ATTENDANCE API =================
async function markAttendance(status) {
  try {
    // -------------------- GET LOCAL STORAGE --------------------
    const schoolMember = localStorage.getItem("reportMemberSchoolId");
    const classData = localStorage.getItem("reportClass");
    const nurseryData = localStorage.getItem("reportNursery");
    const markedBy = localStorage.getItem("reportMemberId"); // parent ID

    const classId = classData ? JSON.parse(classData)?._id : null;
    const nursery = nurseryData ? JSON.parse(nurseryData)?._id : null;

    // -------------------- VALIDATE --------------------
    if (!schoolMember || !classId || !nursery || !markedBy) {
      console.error("❌ Missing required localStorage data", { schoolMember, classId, nursery, markedBy });
      alert("❌ Cannot mark attendance: Missing data");
      return;
    }

    console.log("🚀 Local data:");
    console.log({ schoolMember, classId, nursery, markedBy, status });

    // -------------------- MAP STATUS & NOTES --------------------
    let finalStatus = "";
    let noteText = "marked by parent";


    if (status === "home") {
      finalStatus = "absent";   // Kid at home
    } else if (status === "bus") {
      finalStatus = "leave";    // Kid leaving home → bus
    } else {
      console.error("❌ Unknown status:", status);
      alert("❌ Invalid status");
      return;
    }

    console.log("finalStatus (mapped):", finalStatus);
    console.log("notes:", noteText);
  
    // ⭐ Capture previous attendance BEFORE updating
const attendanceList = await fetchTodayAttendance();

const previousAttendance = attendanceList.find(
  a => a.schoolMember?._id === schoolMember
);

    // -------------------- BUILD DATA --------------------
    const now = new Date();
    const data = {
      date: now.toISOString().split("T")[0],
      nursery,
      classId,
      schoolMember,
      status: finalStatus,
      checkInTime: status === "bus" ? now.toLocaleTimeString("en-GB", { hour12: false, hour: "2-digit", minute: "2-digit" }) : null,
      leaveTime: status === "home" ? now.toLocaleTimeString("en-GB", { hour12: false, hour: "2-digit", minute: "2-digit" }) : null,
      markedBy,
      notes: noteText
    };

    console.log("📤 Data to send:", data);

    // -------------------- SEND REQUEST --------------------
    const res = await fetch(`${API}/attendance`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    if (!res.ok) {
      const text = await res.text();
      throw new Error(`HTTP ${res.status} - ${text}`);
    }

   alert(`✅ Notification Sent : ${finalStatus.toUpperCase()}`);

// ⭐ Re-fetch updated attendance
const updatedList = await fetchTodayAttendance();
const currentAttendance = updatedList.find(
  a => a.schoolMember?._id === schoolMember
);

const moodExists = await hasMoodForToday();

// TEMPORARY: bypass strict check
// ✅ Only show mood popup when appropriate
  if (!moodExists && shouldShowMoodPopup(currentAttendance, previousAttendance)) {
    openMoodPopup();
  }

await renderMembers();

  } catch (err) {
    console.error("Attendance error:", err);
    alert("❌ Failed to mark attendance");
  }
}





// ================= DRAG & DROP =================
async function drop(ev) {
  ev.preventDefault();
  const id = ev.dataTransfer.getData("id");
  const el = document.getElementById(id);
  ev.currentTarget.appendChild(el);

  const isBus = ev.currentTarget.classList.contains("bus-pad");
  const statusEl = el.querySelector(".status");
  statusEl.textContent = isBus ? "Status: On Bus" : "Status: Home";

  // Only mark for logged-in member
  if (id !== currentUser._id) return;
// Get previous attendance BEFORE marking
  // ⭐ Get previous attendance BEFORE marking
  const attendanceList = await fetchTodayAttendance();
  const previousAttendance = attendanceList.find(
    a => a.schoolMember?._id === reportMemberSchoolId
  );

  await markAttendance(isBus ? "bus" : "home", previousAttendance);
}

async function renderMembers() {
  homePad.innerHTML = "";
  busPad.innerHTML = "";

  const attendanceList = await fetchTodayAttendance();

  const todayAttendance = attendanceList.find(
    a => a.schoolMember?._id === reportMemberSchoolId
  );

  // ================= TITLE =================
  const familyName = reportFamily?.name || "Family";
  const nurseryName = reportNursery?.name || "Nursery";
  const className = reportClass?.name || "Class";

  attendanceTitle.textContent =
    `${familyName} – ${nurseryName} – ${className}\nAttendance`;

  // ================= PRESENT → ON CLASS =================
  if (todayAttendance?.status === "present") { 
  // Hide the pads
  document.getElementById("pads").style.display = "none";

  // Create the label
  const label = document.createElement("div");
  label.style.textAlign = "center";
  label.style.marginTop = "80px";
  label.style.fontSize = "32px";
  label.style.fontWeight = "bold";
  label.style.color = "#007bff";
  // Set the text to include the user's name
  label.textContent = `${currentUser.name} 🟢 On Class`;

  document.body.appendChild(label);
  return;
}
// ================= REMOVE DUPLICATE =================
  const existingEl = document.getElementById(currentUser._id);
  if (existingEl) existingEl.remove();

  // ================= CREATE MEMBER =================
  const div = document.createElement("div");
  div.className = "member current-user";
  div.id = currentUser._id;
  div.draggable = true;
  div.ondragstart = drag;

  let statusText = "Status: Home";
  let targetPad = homePad;

  if (todayAttendance?.status === "leave") {
    statusText = "Status: On Bus";
    targetPad = busPad;
  }

  div.innerHTML = `
    <div class="avatar">${currentUser.name[0]}</div>
    <div>
      <div>${currentUser.name}</div>
      <div class="status">${statusText}</div>
    </div>
  `;

  targetPad.appendChild(div);
  // ================= MOOD CHECK =================



}


// ================= INIT =================
if (reportClass?._id && reportMemberSchoolId) {
  renderMembers();
} else {
  console.warn("⛔ Attendance context not ready yet");
}
// ========== MOOD POPUP ==========
const moodOverlay = document.getElementById("moodOverlay");
const moodStatus = document.getElementById("moodStatus");
const moodBtns = document.querySelectorAll(".mood-btn");

function openMoodPopup() {
  moodOverlay.style.display = "flex";
}

function closeMoodPopup() {
  moodOverlay.style.display = "none";
}

moodBtns.forEach(btn => {
  btn.addEventListener("click", () => saveMood(btn.dataset.mood, btn));
});

function saveMood(mood, clickedBtn) {
  moodBtns.forEach(b => b.classList.remove("selected"));
  clickedBtn.classList.add("selected");

  fetch(`${API}/mood`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      date: getToday(),
      nursery: reportNursery._id,
      class: reportClass._id,
      schoolMember: reportMemberSchoolId,
      mood,
      recordedBy: "parent"
    })
  })
  .then(() => {
    moodStatus.textContent = "Mood saved 💙";
    setTimeout(closeMoodPopup, 1000);
  });
}

</script>

</body>
</html>
