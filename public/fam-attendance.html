<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Family Attendance</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f5;
  padding: 20px;
}

/* ================= PAGE ================= */
h1 {
  text-align: center;
  white-space: pre-line;
}

.pads {
  display: flex;
  gap: 20px;
  margin-top: 20px;
}

.pad {
  flex: 1;
  min-height: 420px;
  background: white;
  border-radius: 12px;
  padding: 15px;
  border: 2px dashed #ccc;
}

.home-pad { border-color: #28a745; }
.bus-pad { border-color: #007bff; }

.pad h2 {
  text-align: center;
}

/* ================= MEMBER ================= */
.member {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #f8f9fa;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 8px;
  cursor: grab;
}

.member.current-user {
  border: 2px solid #ffc107;
  background: #fff3cd;
}

.avatar {
  width: 40px;
  height: 40px;
  background: #6c757d;
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.status {
  font-size: 12px;
  color: #666;
}
</style>
</head>

<body>

<h1 id="attendanceTitle">Attendance</h1>

<div class="pads">
  <div class="pad bus-pad" ondrop="drop(event)" ondragover="allowDrop(event)">
    <h2>🚌 Bus</h2>
    <div id="busPad"></div>
  </div>

  <div class="pad home-pad" ondrop="drop(event)" ondragover="allowDrop(event)">
    <h2>🏠 Home</h2>
    <div id="homePad"></div>
  </div>
</div>

<script>
// ================= CONFIG =================
const API = "https://daily-effort-tracker-backend.onrender.com/api";

// ================= LOAD CONTEXT =================
const currentFamilyMembers = JSON.parse(localStorage.getItem("currentFamilyMembers") || "[]");
const reportClass = JSON.parse(localStorage.getItem("reportClass") || "{}");
const reportFamily = JSON.parse(localStorage.getItem("reportFamily") || "{}");
const reportNursery = JSON.parse(localStorage.getItem("reportNursery") || "{}");
const reportMemberId = localStorage.getItem("reportMemberId");
const reportMemberSchoolId = localStorage.getItem("reportMemberSchoolId");

// ================= VALIDATION =================
if (!reportClass?._id || !reportMemberId) {
  alert("Attendance context missing");
  window.location.href = "choose.html";
}

// ================= FIND LOGGED-IN MEMBER =================
const currentUser = currentFamilyMembers.find(m => m._id === reportMemberId);
if (!currentUser) {
  alert("Logged-in family member not found");
  window.location.href = "choose.html";
}

// ================= DOM =================
const homePad = document.getElementById("homePad");
const busPad = document.getElementById("busPad");
const attendanceTitle = document.getElementById("attendanceTitle");

// ================= HELPERS =================
function allowDrop(ev) { ev.preventDefault(); }
function drag(ev) { ev.dataTransfer.setData("id", ev.target.id); }
function getToday() { return new Date().toISOString().split("T")[0]; }
function getCurrentTime() { return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: true }); }

// ================= ATTENDANCE API =================
async function markAttendance(status) {
  try {
    // -------------------- GET LOCAL DATA --------------------
    const schoolMember = localStorage.getItem("reportMemberSchoolId");
    const classId = JSON.parse(localStorage.getItem("reportClass"))?._id;
    const nursery = JSON.parse(localStorage.getItem("reportNursery"))?._id;
    const markedBy = localStorage.getItem("reportMemberId"); // parent ID

    if (!schoolMember || !classId || !nursery || !markedBy) {
      alert("❌ Cannot mark attendance: Missing data");
      return;
    }

    const now = new Date();

    // -------------------- MAP STATUS & NOTES --------------------
    let backendStatus = "";
    let noteText = "";

    if (status === "absent") {
      backendStatus = "absent";
      noteText = "Marked by Parent";         // Kid at home
    } else if (status === "leave") {
      backendStatus = "leave";
      noteText = "Marked by Parent";         // Kid leaving home → bus
    } else {
      console.error("❌ Unknown status:", status);
      alert("❌ Invalid status");
      return;
    }

    // -------------------- BUILD DATA --------------------
    const data = {
      date: now.toISOString().split("T")[0],
      nursery,
      classId,
      schoolMember,
      status: backendStatus,
      checkInTime: status === "leave" ? now.toLocaleTimeString("en-GB", { hour12: false, hour: "2-digit", minute: "2-digit" }) : null,
      leaveTime: status === "absent" ? now.toLocaleTimeString("en-GB", { hour12: false, hour: "2-digit", minute: "2-digit" }) : null,
      markedBy,
      notes: noteText
    };

    console.log("📤 Data to send:", data);

    // -------------------- SEND REQUEST --------------------
    const res = await fetch(`${API}/attendance`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    if (!res.ok) {
      const text = await res.text();
      throw new Error(`HTTP ${res.status} - ${text}`);
    }

    alert(`✅ Notification Sent : ${backendStatus.toUpperCase()}`);
  } catch (err) {
    console.error("Attendance error:", err);
    alert("❌ Failed to mark attendance");
  }
}




// ================= DRAG & DROP =================
async function drop(ev) {
  ev.preventDefault();
  const id = ev.dataTransfer.getData("id");
  const el = document.getElementById(id);
  ev.currentTarget.appendChild(el);

  const isBus = ev.currentTarget.classList.contains("bus-pad");
  const statusEl = el.querySelector(".status");
  statusEl.textContent = isBus ? "Status: On Bus" : "Status: Home";

  // Only mark for logged-in member
  if (id !== currentUser._id) return;

  await markAttendance(isBus ? "present" : "home");
}

// ================= RENDER =================
function renderMembers() {
  homePad.innerHTML = "";
  busPad.innerHTML = "";

  const div = document.createElement("div");
  div.className = "member current-user";
  div.id = currentUser._id;
  div.draggable = true;
  div.ondragstart = drag;
  div.innerHTML = `
    <div class="avatar">${currentUser.name[0]}</div>
    <div>
      <div>${currentUser.name}</div>
      <div class="status">Status: Home</div>
    </div>
  `;
  homePad.appendChild(div);

  // ================= TITLE =================
  const familyName = reportFamily?.name || "Family";
  const nurseryName = reportNursery?.name || "Nursery";
  const className = reportClass?.name || "Class";

  const now = new Date();
  const date = now.toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" });
  const time = now.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit", hour12: true });

  attendanceTitle.textContent = `${familyName} – ${nurseryName} – ${className}\nAttendance\n📅 ${date} — ${time}`;

  console.log("Family:", familyName);
  console.log("Nursery:", nurseryName);
  console.log("Class:", className);
}

// ================= INIT =================
renderMembers();
</script>

</body>
</html>
