<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Attendance Story</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f5;
  padding: 20px;
}

/* ================= POPUP ================= */
.popup {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.popup-content {
  background: white;
  padding: 25px;
  width: 350px;
  border-radius: 10px;
  text-align: center;
}

.popup-content select,
.popup-content button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
}

/* ================= PAGE ================= */
h1 {
  text-align: center;
}

.pads {
  display: flex;
  gap: 20px;
  margin-top: 20px;
}

.pad {
  flex: 1;
  min-height: 420px;
  background: white;
  border-radius: 12px;
  padding: 15px;
  border: 2px dashed #ccc;
}

.class-pad { border-color: #28a745; }
.bus-pad { border-color: #007bff; }

.pad h2 {
  text-align: center;
}

/* ================= MEMBER ================= */

.avatar {
  width: 40px;
  height: 40px;
  background: #6c757d;
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.status {
  font-size: 12px;
  color: #666;
}
#attendanceTitle {
  white-space: pre-line;
}
/* Default member */
.member {
  padding: 10px;
  margin: 6px 0;
  border-radius: 10px;
  background: #f7f7f7;
  display: flex;
  align-items: center;
  gap: 10px;
}

/* 🚌 On Bus – highlighted */
.member.status-bus {
  background: #e0f2ff;
  border: 2px solid #2196f3;
  box-shadow: 0 0 8px rgba(33,150,243,0.4);
}

/* 🏫 Present – normal */
.member.status-present {
  background: #f4fff7;
  border: 1px solid #c8e6c9;
}

/* ❌ Absent – classic / muted */
.member.status-absent {
  background: #f5f5f5;
  opacity: 0.6;
  border: 1px dashed #bdbdbd;
}

</style>
</head>

<body>

<!-- ================= CLASS POPUP ================= -->
<div id="classPopup" class="popup">
  <div class="popup-content">
    <h2>🏫 Select Your Class</h2>
    <p>Choose class to start attendance</p>
    <select id="classSelect">
      <option>Loading...</option>
    </select>
    <button id="classSelectBtn">✅ Confirm</button>
  </div>
</div>

<!-- ================= PAGE ================= -->
<h1 id="attendanceTitle">Attendance</h1>


<div class="pads">
  <div class="pad class-pad"
       ondrop="drop(event)"
       ondragover="allowDrop(event)">
    <h2>🏫 Class</h2>
    <div id="classPad"></div>
  </div>

  <div class="pad bus-pad"
     ondrop="drop(event)"
     ondragover="allowDrop(event)">
  <h2>🚌 Bus</h2>
  <div id="busPad"></div>
</div>


<script>
const API = "https://daily-effort-tracker-backend.onrender.com/api";
let CLASS_MEMBERS = [];


/* ================= DRAG ================= */
function allowDrop(ev) { ev.preventDefault(); }
function drag(ev) { ev.dataTransfer.setData("id", ev.target.id); }

function getTodayDate() {
  return new Date().toISOString().split("T")[0];
}
const STATUS_UI = {
  leave: {
    text: "On Bus",
    className: "status-bus"
  },
  present: {
    text: "Present",
    className: "status-present"
  },
  absent: {
    text: "Absent",
    className: "status-absent"
  }
};

async function loadTodayAttendance(classId) {
  const date = getTodayDate();

  // Match backend exactly: query params
  const res = await fetch(`${API}/Attendance?classId=${classId}&date=${date}`);

  if (!res.ok) {
    throw new Error("Failed to load attendance");
  }

  const result = await res.json();

  // Map: memberId -> status
  const attendanceMap = {};
  result.data.forEach(a => {
    attendanceMap[a.schoolMember] = a.status; // leave / present / absent
  });

  return attendanceMap;
}






async function drop(ev) {
  ev.preventDefault();

  // Get dragged element
  const id = ev.dataTransfer.getData("id");
  const el = document.getElementById(id);

  // Safety: do nothing if member is absent
  if (el.dataset.status === "absent") return;

  // Append to new pad
  ev.currentTarget.appendChild(el);

  // Determine new status
  const isBus = ev.currentTarget.classList.contains("bus-pad");
  const newStatus = isBus ? "leave" : "present";

  // Update UI
  el.dataset.status = newStatus;
  const ui = STATUS_UI[newStatus];
  el.className = `member ${ui.className}`;
  el.querySelector(".status").textContent = `Status: ${ui.text}`;

  // Call backend to update attendance
  try {
    const res = await fetch(`${API}/attendance/update`, {
      method: "PUT",          // ✅ Update only, no creation
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        schoolMember: id,
        class: window.selectedClass.id,
        date: getTodayDate(),
        status: newStatus
      })
    });

    if (!res.ok) {
      throw new Error("Attendance record not found");
    }

    console.log(`Attendance updated: ${id} → ${newStatus}`);
  } catch (err) {
    alert("Failed to update attendance: record may not exist.");
    console.warn(err);

    // Optional: revert UI if backend fails
    const oldStatus = el.dataset.status === "leave" ? "present" : "leave";
    const oldUI = STATUS_UI[oldStatus];
    el.dataset.status = oldStatus;
    el.className = `member ${oldUI.className}`;
    el.querySelector(".status").textContent = `Status: ${oldUI.text}`;
  }
}



function updateAttendanceTitle(className) {
  const user = JSON.parse(localStorage.getItem("user"));
  const title = document.getElementById("attendanceTitle");

  const nurseryName = user?.nurseryName || "Nursery";
  title.textContent = `${nurseryName} – ${className}\nAttendance`;
}

/* ================= LOAD CLASSES ================= */
async function loadClassesByUser() {
  const user = JSON.parse(localStorage.getItem("user"));
  if (!user) {
    alert("Not logged in");
    return;
  }

  const select = document.getElementById("classSelect");
  select.innerHTML = "<option>Loading...</option>";

  try {
    let res;

    if (user.role?.toLowerCase() === "teacher") {
      res = await fetch(`${API}/teachers/${user._id}/classes`);
    } else {
      res = await fetch(`${API}/nurseries/${user.nurseryId}/classes`);
    }

    if (!res.ok) throw new Error("Failed to load classes");

    const data = await res.json();

    select.innerHTML = `<option value="">-- Select Class --</option>`;
    data.classes.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c._id;
      opt.textContent = c.name;
      select.appendChild(opt);
    });

  } catch (err) {
    console.error(err);
    select.innerHTML = `<option value="">Failed to load</option>`;
  }
}


function shouldResetAttendance() {
  const now = new Date();
  const hour = now.getHours();
  const today = now.toISOString().split("T")[0];

  const lastReset = localStorage.getItem("attendanceLastReset");

  if (hour >= 7 && lastReset !== today) {
    localStorage.setItem("attendanceLastReset", today);
    return true;
  }
  return false;
}


async function loadMembers(classId) {
  const [membersRes, attendanceMap] = await Promise.all([
    fetch(`${API}/members/class/${classId}`),
    loadTodayAttendance(classId)
  ]);

  if (!membersRes.ok) throw new Error("Failed to load members");

  const members = await membersRes.json();

  // 🔹 DEBUG LOG
  console.log("Attendance Map:", attendanceMap); // shows { schoolMemberId: status, ... }
  console.log("Members fetched:", members);       // shows raw members array from backend

  CLASS_MEMBERS = members.map(m => ({
    id: m._id,
    name: m.member?.name || "Kid",
    status: attendanceMap[m._id] || "absent" // default only if no record
  }));

  renderMembers();
}


/* when backend is ready
if (shouldResetAttendance()) {
  renderMembers(); // reset to default (all on bus)
} else {
  loadSavedAttendance(); // load yesterday/today data
}

*/

/* ================= RENDER MEMBERS ================= */
function renderMembers() {
  const busPad = document.getElementById("busPad");
  const classPad = document.getElementById("classPad");

  busPad.innerHTML = "";
  classPad.innerHTML = "";

  CLASS_MEMBERS.forEach(m => {
  const ui = STATUS_UI[m.status] || STATUS_UI.present;

  const div = document.createElement("div");
  div.className = `member ${ui.className}`;
  div.id = m.id;
  div.dataset.status = m.status;

  // ❌ Absent → not draggable
  if (m.status === "absent") {
    div.draggable = false;
    div.style.cursor = "not-allowed";
  } else {
    div.draggable = true;
    div.ondragstart = drag;
  }

  div.innerHTML = `
    <div class="avatar">${m.name[0]}</div>
    <div>
      <div class="name">${m.name}</div>
      <div class="status">Status: ${ui.text}</div>
    </div>
  `;

  if (m.status === "leave") {
    busPad.appendChild(div);
  } else {
    classPad.appendChild(div);
  }
});

}



/* ================= INIT ================= */
window.addEventListener("DOMContentLoaded", async () => {
  document.getElementById("classPopup").style.display = "flex";
  await loadClassesByUser();
});

document.getElementById("classSelectBtn").onclick = async () => {
  const select = document.getElementById("classSelect");
  const classId = select.value;

  if (!classId) {
    alert("Select class");
    return;
  }

  const className = select.options[select.selectedIndex].text;

  // ✅ store selected class globally
  window.selectedClass = {
    id: classId,
    name: className
  };

  // ✅ update title (nursery + class)
  updateAttendanceTitle(className);

  // ✅ close popup
  document.getElementById("classPopup").style.display = "none";

  // ✅ load members
  await loadMembers(classId);
};

</script>

</body>
</html>
