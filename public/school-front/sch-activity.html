<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🌞 My Daily Activities Tracker</title>
  <style>
    .header {
  position: relative;
  padding: 10px 20px;
  border-bottom: 1px solid #ccc;
}

.header-buttons {
  position: absolute;
  top: 10px;
  right: 20px;
  display: flex;
  gap: 10px;
}
.form-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 10px;
  }

  .form-row input,
  .form-row select {
    padding: 6px 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
    font-size: 1em;
  }

  /* Set widths to match table columns proportionally */
  #activity { flex: 2 1 200px; }
  #timeMin { flex: 1 1 80px; }
  #evaluation { flex: 1 1 80px; }
  #note { flex: 2 1 150px; }
  #memberSelect { flex: 1 1 150px; }

  table th, table td {
    padding: 6px 8px;
    text-align: left;
    vertical-align: middle;
  }
  .buttons {
  display: flex;
  justify-content: flex-end; /* align buttons to the right */
  gap: 10px;                 /* space between buttons */
  margin-top: 10px;          /* spacing from input fields */
}

.buttons button {
  padding: 8px 12px;
  border-radius: 5px;
  border: none;
  background: #ffb74d;
  color: #fff;
  cursor: pointer;
}

.buttons button:hover {
  background: #ffa726;
}

/* Popup overlay */
    .popup {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.6);
      backdrop-filter: blur(3px);
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
    .popup-content {
      background: linear-gradient(135deg, #ffe8b3, #ffd54f);
      margin: 10% auto;
      padding: 25px 30px;
      border-radius: 20px;
      width: 350px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      transform: scale(0.8);
      animation: popIn 0.4s forwards;
    }
    @keyframes popIn { to { transform: scale(1); } }
    .popup-header h2 {
      font-size: 1.6em;
      margin-bottom: 5px;
      color: #ff9800;
      text-shadow: 1px 1px 2px #b37a00;
    }
    .popup-header p { font-size: 0.95em; color: #8b5e00; margin-bottom: 15px; }
    #classSelect {
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid #f3c623;
      width: 90%;
      font-size: 1em;
      font-weight: 500;
      background: #fff9e6;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    #classSelect:focus {
      outline: none;
      border-color: #ff9800;
      box-shadow: 0 0 10px rgba(255,152,0,0.4);
    }
    #classSelectBtn {
      margin-top: 20px;
      padding: 10px 25px;
      border: none;
      border-radius: 15px;
      background: linear-gradient(135deg, #4caf50, #2ecc71);
      color: white;
      font-size: 1em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    #classSelectBtn:hover {
      background: linear-gradient(135deg, #2ecc71, #27ae60);
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }


    body { font-family: Arial, sans-serif; padding: 20px; background: #fff8dc; }
    h1, h2 { text-align: center; color: #ff9800; }
    .header { text-align:center; margin-bottom:20px; }
    button { padding: 8px 12px; margin: 5px; border-radius:5px; border:none; background:#ffb74d; color:#fff; cursor:pointer; }
    button:hover { background:#ffa726; }
    input[type="text"], input[type="number"], input[type="date"], select { padding:6px 10px; border-radius:5px; border:1px solid #ccc; margin:5px; }
    table { width:100%; border-collapse: collapse; margin-top:15px; }
    th, td { border:1px solid #ccc; padding:8px; text-align:left; }
    th { background:#ffecb3; }
    .tracker-card { background:#fffdf4; padding:15px; margin:20px auto; border-radius:8px; box-shadow:0 0 5px #ccc; }
    #toast { visibility: hidden; min-width: 160px; background-color: #333; color: #fff; text-align: center; border-radius: 20px; padding: 10px; position: fixed; z-index: 1000; left: 50%; bottom: 30px; transform: translateX(-50%); font-size: 1.1em; box-shadow: 0 0 10px rgba(0,0,0,0.3); transition: visibility 0s, opacity 0.5s ease-in-out; opacity: 0; }
    #toast.show { visibility: visible; opacity: 1; }
    .member-tag { display:inline-block; background:#ffd54f; color:#8b5e00; padding:2px 6px; border-radius:5px; margin:2px; font-size:0.9em; }
  </style>
</head>
<body>

<!-- Class Selection Popup -->
  <div id="classPopup" class="popup">
    <div class="popup-content">
      <div class="popup-header">
        <h2>🏫 Select Your Class</h2>
        <p>Choose the class you want to manage today</p>
      </div>
      <select id="classSelect">
        <option value="">Loading classes...</option>
      </select>
      <br><br>
      <button id="classSelectBtn">✅ Confirm</button>
    </div>
  </div>
  <input type="hidden" id="classShow" value="">

<div class="header">
  <h1>🌈 My Daily Activities Tracker</h1>
  <h2>Welcome, <span id="userName"></span>!</h2>
   <div class="header-buttons">
    <button id="backBtn">⬅️ Back</button>
    <button onclick="logout()">🚪 Logout</button>
  </div>
</div>

<div id="checkedStarsBox" style="text-align:center; margin-bottom:15px; font-size:1.3em; font-weight:bold; background:linear-gradient(135deg, #fff5a8, #ffd54f); color:#8b5e00; border:2px solid #f3c623; border-radius:15px; padding:10px 20px; box-shadow:0 0 15px rgba(255,215,0,0.4); width:fit-content; margin:auto;">
  🏦 Stars Box: <span id="checkedStarsDisplay">0⭐</span>
</div>

<div class="tracker-card">
  <h2>📝 Add New Activity</h2>
  <div class="form-row">
    <input type="date" id="date" />
    <select id="memberSelect"><option value="">Select Member</option></select>
    <input type="text" id="activity" placeholder="Activity (e.g., Drawing, ..)" />
    <input type="number" id="timeMin" placeholder="Time (min)" />
    <input type="number" id="evaluation" placeholder="Evaluation(1–10)" min="1" max="10" />
    <input type="text" id="note" placeholder="Note (optional)" />
  </div>
  <div class="buttons">
    <button id="addBtn">➕ Add</button>
    <button id="saveBtn">💾 Save Day</button>
  </div>

  <table id="effortTable">
    <thead>
      <tr>
        <th>#</th>
        <th>🎯 Activity</th>
        <th>⏰ Time (min)</th>
        <th>⭐ Evaluation (10)</th>
        <th>📝 Note</th>
        <th>👤 Member</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<div class="tracker-card">
  <h2>🔍 Show Activity</h2>
  <div class="form-row">
    <h3>👧 User: <span id="filterUserName"></span></h3>
    <input type="date" id="filterDate" />
    <button id="showBtn">👀 Show Activity</button>
  </div>

  <table id="showTable">
    <thead>
      <tr>
        <th>#</th>
        <th>🎯 Activity</th>
        <th>⏰ Time</th>
        <th>⭐ Evaluation</th>
        <th>📝 Note</th>
        <th>📅 Date</th>
        <th>👤 Name</th>
      </tr>
    </thead>
    <tbody id="effortList"></tbody>
  </table>
</div>

<div id="toast">✨ Saved!</div>

<script>
const API ="http://localhost:3000/api";

let CLASS_MEMBERS = [];                   // all members in selected class

  // Utility: create option list HTML
  async function loadClassesByUser() {
  const user = JSON.parse(localStorage.getItem("user"));
  if (!user) return console.error("User not signed in");

  const classSelect = document.getElementById("classSelect");
  classSelect.innerHTML = '<option value="">Loading classes...</option>';

  try {
    let classes = [];

    if (user.role && user.role.toLowerCase() === "teacher") {
      // Teacher → fetch only assigned classes
      const res = await fetch(`${API}/teachers/${user._id}/classes`);
      if (res.ok) {
        const data = await res.json();
        classes = data.classes || [];
      } else {
        console.warn("Teacher classes endpoint returned", res.status);
      }
    } else {
      // Admin / Manager → fetch all nursery classes
      const res = await fetch(`${API}/nurseries/${user.nurseryId}/classes`);
      if (res.ok) {
        const data = await res.json();
        classes = data.classes || [];
      } else {
        console.warn("Nursery classes endpoint returned", res.status);
      }
    }

    // Populate select
    classSelect.innerHTML = '<option value="">-- Select Class --</option>';
    classes.forEach(c => {
      const option = new Option(c.name, c._id);
      classSelect.appendChild(option);
    });

  } catch (err) {
    console.error("Failed to load classes:", err);
    classSelect.innerHTML = '<option value="">Failed to load classes</option>';
  }
}

// Call this function when page loads
window.addEventListener("DOMContentLoaded", async () => {
  // show popup
  document.getElementById("classPopup").style.display = "block";

  // load classes
  await loadClassesByUser();
});

  // Show popup when page loads
window.addEventListener("DOMContentLoaded", () => {
  document.getElementById("classPopup").style.display = "block";
});

// Handle class selection
document.getElementById("classSelectBtn").onclick = async () => {
  const selectedClass = document.getElementById("classSelect").value;
  if (!selectedClass) {
    alert("Please select a class!");
    return;
  }

  window.selectedClass = selectedClass;

  // Optional: store in hidden field
  const classShow = document.getElementById("classShow");
  if (classShow) classShow.value = selectedClass;

  document.getElementById("classPopup").style.display = "none";

  await loadMembersIntoSelector(selectedClass);
  fillMemberTagsOnLoad();

  console.log("Loaded class:", selectedClass);
};


  /*********************************************
 * GLOBAL STORAGE
 *********************************************/
  // update if needed
function fillAllMemberSelects() {
  const memberSelect = document.getElementById("memberSelect");
  if (!memberSelect) return;

  // Clear previous options
  memberSelect.innerHTML = '<option value="">Select Member</option>';

  // Add current members
  window.classMembersList.forEach(m => {
    const option = new Option(m.name, m.id);
    memberSelect.appendChild(option);
  });
}



async function loadMembersIntoSelector(classId) {
  try {
    const res = await fetch(`${API}/members/class/${classId}`);
    if (!res.ok) throw new Error("Failed to load class members");

    const members = await res.json();

    // Ensure array and fallback for undefined member
    window.classMembersList = Array.isArray(members)
      ? members.map(m => ({
          id: m.member?._id || m._id || "",
          name: m.member?.name || "Unknown"
        }))
      : [];

    fillAllMemberSelects();

  } catch (err) {
    console.error("Error loading members:", err);
    fillAllMemberSelects();
  }
}


//if(!currentUser){ window.location.href="login.html"; }
//else { document.getElementById("userName").textContent = `${currentUser} (${currentFamily}'s Family)`; }

// ----------------------
// Default date = today
// ----------------------
const today = new Date().toISOString().split("T")[0];
document.getElementById("date").value = today;
document.getElementById("filterDate").value = today;

// ----------------------
// Logout
// ----------------------
//function logout(){ localStorage.removeItem("currentUser"); window.location.href="welcome.html"; }

// ----------------------
// Prevent past dates
// ----------------------
function isPastDate(selectedDate){
  const now = new Date(); now.setHours(0,0,0,0);
  return new Date(selectedDate) < now;
}

// ----------------------
// Add new effort (local only)
// ----------------------
const tableBody = document.getElementById("tableBody");
const addedItems = [];
//----------------------------------------------------------------------------------------------------------------

// =======================
// Add Button
// =======================
document.getElementById("addBtn").addEventListener("click", () => {
  const date = document.getElementById("date").value;
  const activity = document.getElementById("activity").value.trim();
  const timeMin = document.getElementById("timeMin").value;
  const evaluation = document.getElementById("evaluation").value;
  const note = document.getElementById("note").value;

  const memberSelect = document.getElementById("memberSelect");
  const memberId = memberSelect.value;
  const memberName = memberSelect.options[memberSelect.selectedIndex].text;

  if (!date || !activity) return alert("Please fill date and activity.");
  if (isPastDate(date)) return alert("❌ Cannot add efforts for past dates!");
  if (!memberId) return alert("⚠️ Please select a member!");

  const duplicate = addedItems.some(it =>
    it.activity.toLowerCase() === activity.toLowerCase() &&
    it.timeMin == timeMin &&
    it.memberId === memberId
  );

  if (duplicate) return alert("⚠️ This activity for this member is already added today.");

  addedItems.push({
    date,
    activity,
    timeMin,
    evaluation,
    note,
    memberId,
    memberName
  });

  renderLocalItems();
});


// =======================
// Render Table (Merged)
// =======================
function renderLocalItems() {
  tableBody.innerHTML = addedItems.map((it, i) => `
    <tr>
      <td>${i + 1}</td>
      <td>${it.activity}</td>
      <td>${it.timeMin}</td>
      <td>${it.evaluation}</td>
      <td>${it.note || ""}</td>
      <td>${it.memberName}</td>
    </tr>
  `).join("");
}



// ----------------------
// Save all efforts
// ----------------------
document.getElementById("saveBtn").addEventListener("click", async () => {
  if (addedItems.length === 0) {
    alert("⚠️ Please add at least one effort.");
    return;
  }

  const classId = window.selectedClass;
  if (!classId) {
    alert("⚠️ No class selected!");
    return;
  }

  // Group items by member
  const groupedByMember = {};
  addedItems.forEach(it => {
    if (!groupedByMember[it.memberId]) {
      groupedByMember[it.memberId] = [];
    }
    groupedByMember[it.memberId].push({
      activity: it.activity,
      timeMin: Number(it.timeMin),
      evaluation: Number(it.evaluation) || 0,
      note: it.note || "",
      date: it.date
    });
  });

  let failedMembers = [];
  let successMessages = [];

  for (const memberId in groupedByMember) {
    const items = groupedByMember[memberId];
    const payload = {
      classId,
      kidmember: memberId,
      date: items[0].date,
      items
    };

    try {
      const res = await fetch(`${API}/sch-activities`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json(); // <-- read JSON response

      if (!res.ok || !data.success) {
        failedMembers.push(memberId);
        console.error(`Failed to save member ${memberId}:`, data.error);
      } else {
        successMessages.push(`Member ${memberId}: ${data.message}`);
      }

    } catch (err) {
      failedMembers.push(memberId);
      console.error(`Network error for member ${memberId}:`, err);
    }
  }

  // Reset UI
 if (failedMembers.length === 0) {
    addedItems.length = 0;   // clear local array
    renderLocalItems();       // clear table
    alert("✅ Activities saved successfully!\n" + successMessages.join("\n"));
  } else {
    alert(`⚠️ Could not save activity for ${failedMembers.length} member(s).\nSuccessful:\n${successMessages.join("\n")}`);
  }
});



// ----------------------
// Show saved efforts
// ----------------------
document.getElementById("showBtn").addEventListener("click", loadActivities);

async function loadActivities(){
  const date = document.getElementById("filterDate").value;
  const classId = window.selectedClass;
  if(!classId){
    alert("⚠️ No class selected!");
    return;
  }

  try{
    // Fetch activities for selected class and date
    const res = await fetch(`${API_BASE}/api/sch-activities?classId=${classId}&date=${date}`);
    const data = await res.json();
    const ActivityList = document.getElementById("ActivityList");

    if(!data.length){
      ActivityList.innerHTML = `<tr><td colspan="7" style="text-align:center;">No records found 💬</td></tr>`;
      document.getElementById("checkedStarsDisplay").textContent = "0⭐";
      return;
    }

    // Flatten items for all members
    const allItems = data.flatMap(doc => 
      doc.items.map((it, i) => ({
        ...it,
        date: doc.date,
        member: doc.kidmember.name || doc.kidmember, // use populated name if available
        index: i
      }))
    );

    ActivityList.innerHTML = allItems.map((it,i) => `
      <tr>
        <td>${i+1}</td>
        <td>${it.activity||""}</td>
        <td>${it.timeMin||""}</td>
        <td>${currentRole==="parent"?`<input type="number" class="starInput" min="0" max="10" value="${it.evaluation||0}" data-index="${i}" data-date="${it.date}" data-member="${it.member}">`:it.evaluation||0}</td>
        <td>${it.note||""}</td>
        <td>${it.date||""}</td>
        <td>${it.member||currentUser}</td>
      </tr>
    `).join("");

    attachStarListeners();
    updateStarsFromItems(allItems);

  } catch(err){
    console.error("❌ Load failed:", err);
    alert("⚠️ Could not load activities.");
  }
}

// ----------------------
// Update stars dynamically
// ----------------------
function updateStarsFromItems(items){
  const total = items.reduce((s,it) => s + (Number(it.evaluation)||0), 0);
  document.getElementById("checkedStarsDisplay").textContent = `${total}⭐`;
}

function attachStarListeners(){
  document.querySelectorAll(".starInput").forEach(input => {
    input.addEventListener("change", async e => {
      if(currentRole !== "parent") return;
      const box = e.target;
      const newEval = Number(box.value);
      const saveData = {
        member: box.dataset.member,
        date: box.dataset.date,
        index: box.dataset.index,
        evaluation: newEval
      };
      try{
        await fetch(`${API_BASE}/api/sch-activities/updateEvaluation`, {
          method: "PATCH",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify(saveData)
        });
        loadActivities();
        showToast("✨ Stars updated!");
      } catch(err){
        console.error("❌ Star update failed:", err);
        alert("⚠️ Could not update stars!");
      }
    });
  });
}

// ----------------------
function showToast(msg="✨ Saved!"){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}

document.getElementById("backBtn").onclick = () => { window.location.href = "sch-choose.html"; };

// ----------------------
// Auto-load today's saved activities
// ----------------------
loadActivities();


</script>
</body>
</html>
