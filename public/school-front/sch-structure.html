<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nursery Structure</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />

<style>
  body { margin:0; font-family:"Poppins",sans-serif; background:linear-gradient(135deg, #fceabb, #f8b500); padding:20px; }
  .card { background:white; padding:25px; border-radius:20px; box-shadow:0 8px 20px rgba(0,0,0,0.15); margin-bottom:30px; max-width:1000px; margin:auto; }
  h1 { margin-bottom:15px; font-weight:600; color:#333; }
  table { width:100%; border-collapse: collapse; margin-top:15px; }
  th, td { padding:10px; border:1px solid #ddd; border-radius:6px; text-align:left; }
  th { background:#2196f3; color:white; }
  td { background:#f9f9f9; }
  .btn { padding:8px 14px; margin:5px; border-radius:8px; border:none; cursor:pointer; color:white; font-weight:500; transition:0.2s; }
  .btn-edit { background:#4caf50; } .btn-edit:hover { background:#45a049; }
  .btn-delete { background:#f44336; } .btn-delete:hover { background:#d32f2f; }
  .btn-add { background:#2196f3; } .btn-add:hover { background:#1976d2; }
  select, input { padding:6px 8px; margin:4px 0; width:95%; border-radius:6px; border:1px solid #ccc; }
  .modal { display:none; position:fixed; z-index:200; left:0; top:0; width:100%; height:100%; overflow:auto; background:rgba(0,0,0,0.5); }
  .modal-content { background:white; margin:5% auto; padding:20px; border-radius:20px; width:90%; max-width:400px; position:relative; text-align:center; }
  .close { position:absolute; top:10px; right:15px; font-size:22px; cursor:pointer; }
</style>
</head>
<body>

<div class="card">
  <h1>Workers</h1>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Role</th>
        <th>Assigned Class</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="workersTableBody"></tbody>
  </table>
  <button class="btn btn-add" onclick="openAddTeacherModal()">Add Teacher</button>
</div>

<!-- Teacher Profile Modal -->
<div id="teacherModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h2 id="modalTitle">Add Teacher</h2>
    <form id="teacherForm">
      <input type="text" id="teacherNameInput" placeholder="Full Name" required /><br>
      <select id="teacherRoleInput" required>
        <option value="">Select Role</option>
        <option value="Member">Member</option>
        <option value="Teacher">Teacher</option>
        <option value="Supervisor">Supervisor</option>
        <option value="Manager">Manager</option>
      </select><br>
      <input type="email" id="teacherEmailInput" placeholder="Email" required /><br>
      <input type="text" id="teacherPhoneInput" placeholder="Phone" required /><br>
      <select id="teacherClassInput">
        <option value="">Assign Class</option>
      </select><br>
      <button type="submit" class="btn btn-add">Save</button>
    </form>
  </div>
</div>

<script>
  // Example data
  let classes = [
    { name: "Class A", passKey: "A123" },
    { name: "Class B", passKey: "B456" }
  ];

  let workers = [
    { name: "Alice", role: "Teacher", assignedClass: "Class A", email:"alice@mail.com", phone:"1234" },
    { name: "Bob", role: "Supervisor", assignedClass: "Class B", email:"bob@mail.com", phone:"5678" }
  ];

  const workersTableBody = document.getElementById('workersTableBody');
  const modal = document.getElementById('teacherModal');
  const form = document.getElementById('teacherForm');
  const title = document.getElementById('modalTitle');
  const nameInput = document.getElementById('teacherNameInput');
  const roleInput = document.getElementById('teacherRoleInput');
  const emailInput = document.getElementById('teacherEmailInput');
  const phoneInput = document.getElementById('teacherPhoneInput');
  const classInput = document.getElementById('teacherClassInput');

  let editingIndex = null;

  function renderWorkers() {
    workersTableBody.innerHTML = '';
    workers.forEach((worker, index) => {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${worker.name}</td>
        <td>${worker.role}</td>
        <td>${worker.assignedClass}</td>
        <td>${worker.email}</td>
        <td>${worker.phone}</td>
        <td>
          <button class="btn btn-edit" onclick="editWorker(${index})">Edit</button>
          <button class="btn btn-delete" onclick="deleteWorker(${index})">Delete</button>
        </td>
      `;
      workersTableBody.appendChild(row);
    });
  }

  function openAddTeacherModal() {
    editingIndex = null;
    title.textContent = "Add Teacher";
    form.reset();
    populateClassOptions();
    modal.style.display = 'block';
  }

  function populateClassOptions() {
    classInput.innerHTML = '<option value="">Assign Class</option>';
    classes.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.name;
      opt.textContent = c.name;
      classInput.appendChild(opt);
    });
  }

  function closeModal() {
    modal.style.display = 'none';
  }

  function editWorker(index) {
    editingIndex = index;
    title.textContent = "Edit Teacher";
    const worker = workers[index];
    nameInput.value = worker.name;
    roleInput.value = worker.role;
    emailInput.value = worker.email;
    phoneInput.value = worker.phone;
    populateClassOptions();
    classInput.value = worker.assignedClass;
    modal.style.display = 'block';
  }

  function deleteWorker(index) {
    if(confirm('Delete this worker?')) {
      workers.splice(index,1);
      renderWorkers();
    }
  }

  form.onsubmit = function(e) {
    e.preventDefault();
    const workerData = {
      name: nameInput.value,
      role: roleInput.value,
      email: emailInput.value,
      phone: phoneInput.value,
      assignedClass: classInput.value
    };

    if(editingIndex !== null) {
      workers[editingIndex] = workerData;
    } else {
      workers.push(workerData);
    }

    renderWorkers();
    closeModal();
  }

  renderWorkers();
</script>

</body>
</html>
