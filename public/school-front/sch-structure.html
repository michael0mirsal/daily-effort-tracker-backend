<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nursery Structure</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
<style>
  body { margin:0; font-family:"Poppins",sans-serif; background:linear-gradient(135deg, #fceabb, #f8b500); padding:20px; }
  .card { background:white; padding:25px; border-radius:20px; box-shadow:0 8px 20px rgba(0,0,0,0.15); margin-bottom:30px; max-width:1000px; margin:auto; }
  h1 { margin-bottom:15px; font-weight:600; color:#333; }
  table { width:100%; border-collapse: collapse; margin-top:15px; }
  th, td { padding:10px; border:1px solid #ddd; border-radius:6px; text-align:left; }
  th { background:#2196f3; color:white; }
  td { background:#f9f9f9; }
  .btn { padding:8px 14px; margin:5px; border-radius:8px; border:none; cursor:pointer; color:white; font-weight:500; transition:0.2s; }
  .btn-edit { background:#4caf50; } .btn-edit:hover { background:#45a049; }
  .btn-delete { background:#f44336; } .btn-delete:hover { background:#d32f2f; }
  .btn-add { background:#2196f3; } .btn-add:hover { background:#1976d2; }
  input, select { padding:6px 8px; margin:4px 0; width:95%; border-radius:6px; border:1px solid #ccc; }
  .modal { display:none; position:fixed; z-index:200; left:0; top:0; width:100%; height:100%; overflow:auto; background:rgba(0,0,0,0.5); }
  .modal-content { background:white; margin:5% auto; padding:20px; border-radius:20px; width:90%; max-width:400px; position:relative; text-align:center; }
  .close { position:absolute; top:10px; right:15px; font-size:22px; cursor:pointer; }
  .tooltip { position:absolute; background:white; padding:10px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.2); display:none; z-index:100; font-size:14px; }
</style>
</head>
<body>

<!-- Top-right buttons -->
<div style="position:fixed; top:20px; right:20px; display:flex; flex-direction:column; gap:10px; z-index:300;">
  <button class="btn btn-delete" onclick="logout()">Logout</button>
  <button class="btn btn-edit" onclick="goBack()">Back</button>
</div>

<!-- Nursery Info -->
<div class="card">
  <h1>Nursery Info</h1>

  <p><strong>Name:</strong>
    <input type="text" id="nurseryName" />
  </p>

  <p><strong>Email:</strong>
    <input type="text" id="nurseryEmail" />
  </p>

  <p><strong>Phone:</strong>
    <input type="text" id="nurseryPhone" />
  </p>

  <p><strong>Pass Key:</strong>
    <input type="text" id="nurseryPassKey" />
  </p>

  <hr />

  <h2>Manager Info</h2>

  <p><strong>Manager Name:</strong>
    <input type="text" id="managerName" />
  </p>

  <p><strong>Manager Pass Key:</strong>
    <input type="text" id="managerPassKey" />
  </p>

  <button class="btn btn-add" onclick="saveNursery()">Save Nursery Info</button>
</div>

<!-- Classes Table -->
<div class="card">
  <h1>Classes</h1>
  <table>
    <thead>
      <tr>
        <th>Class Name</th>
        <th>Class Pass Key</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="classesTableBody"></tbody>
  </table>
  <button class="btn btn-add" onclick="openClassModal()">Add Class</button>
</div>

<!-- Teachers Table -->
<div class="card">
  <h1>Workers</h1>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Role</th>
        <th>Assigned Class</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="workersTableBody"></tbody>
  </table>
  <button class="btn btn-add" onclick="openAddTeacherModal()">Add Teacher</button>
</div>

<!-- Class Modal -->
<div id="classModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeClassModal()">&times;</span>
    <h2 id="classModalTitle">Add Class</h2>
    <form id="classForm">
      <input type="text" id="classNameInput" placeholder="Class Name" required /><br>
      <input type="text" id="classPassKeyInput" placeholder="Class Pass Key" required /><br>
      <button type="submit" class="btn btn-add">Save Class</button>
    </form>
  </div>
</div>

<!-- Teacher Modal -->
<div id="teacherModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeTeacherModal()">&times;</span>
    <h2 id="teacherModalTitle">Add Teacher</h2>
    <form id="teacherForm">
      <input type="text" id="teacherNameInput" placeholder="Full Name" required /><br>
      <select id="teacherRoleInput" required>
        <option value="">Select Role</option>
        <option value="Teacher">Teacher</option>
        <option value="Supervisor">Supervisor</option>
        <option value="Manager">Manager</option>
      </select><br>
      <input type="email" id="teacherEmailInput" placeholder="Email" required /><br>
      <input type="text" id="teacherPhoneInput" placeholder="Phone" required /><br>
      <select id="teacherClassInput">
        <option value="">Assign Class</option>
      </select><br>
      <button type="submit" class="btn btn-add">Save Teacher</button>
    </form>
  </div>
</div>

<!-- Tooltip -->
<div class="tooltip" id="classTooltip"></div>

<script>
/* ---------------------
   API CONFIG
----------------------*/
const API = "http://localhost:3000/api/nurseries";

/* IMPORTANT: Declare arrays */
let classes = [];
let workers = [];

/* ---------------------
   LOAD NURSERY INFO FROM DB
----------------------*/
async function loadNursery() {
  try {
    const nurseryId = localStorage.getItem("nurseryId") || "6935e44bd5f8f6d780a82492";
    if (!nurseryId) return alert("Missing nursery ID");

    const res = await fetch(`${API}/${nurseryId}/dashboard`);
    const result = await res.json();

    if (!result.success) return alert("Failed to load nursery");

    const data = result.nursery;

    document.getElementById("nurseryName").value = data.name || "";
    document.getElementById("nurseryEmail").value = data.email || "";
    document.getElementById("nurseryPhone").value = data.phone || "";
    document.getElementById("nurseryPassKey").value = data.passKey || "";

    document.getElementById("managerName").value = data.manager || "";
    document.getElementById("managerPassKey").value = data.managerPassKey || "";

  } catch (err) {
    console.error(err);
  }
}

/* ---------------------
   SAVE NURSERY INFO
----------------------*/
async function saveNursery() {
  const nurseryId = localStorage.getItem("nurseryId");

  const payload = {
    name: document.getElementById("nurseryName").value,
    email: document.getElementById("nurseryEmail").value,
    phone: document.getElementById("nurseryPhone").value,
    passKey: document.getElementById("nurseryPassKey").value,
    manager: document.getElementById("managerName").value,
    managerPassKey: document.getElementById("managerPassKey").value
  };

  try {
    await fetch(`${API}/${nurseryId}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    alert("Nursery info saved!");
  } catch (err) {
    console.error(err);
  }
}

/* ---------------------
   CLASS CRUD
----------------------*/
async function addClass() {
  const nurseryId = localStorage.getItem("nurseryId");

  const name = document.getElementById("classNameInput").value;
  const passKey = document.getElementById("classPassKeyInput").value;

  const res = await fetch(`${API}/${nurseryId}/classes`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, passKey })
  });

  const data = await res.json();

  if (data.success) {
    classes.push(data.class);
    renderClasses();
    closeClassModal();
  } else {
    alert("Error adding class");
  }
}

async function deleteClass(classId) {
  const nurseryId = localStorage.getItem("nurseryId");

  const res = await fetch(`${API}/${nurseryId}/classes/${classId}`, {
    method: "DELETE"
  });

  const result = await res.json();

  if (result.success) {
    classes = classes.filter(c => c._id !== classId);
    renderClasses();
  } else {
    alert("Failed to delete class");
  }
}

/* ---------------------
   TEACHER CRUD
----------------------*/
async function addWorker() {
  const nurseryId = localStorage.getItem("nurseryId");

  const payload = {
    name: document.getElementById("teacherNameInput").value,
    role: document.getElementById("teacherRoleInput").value,
    email: document.getElementById("teacherEmailInput").value,
    phone: document.getElementById("teacherPhoneInput").value,
    assignedClass: document.getElementById("teacherClassInput").value || null
  };

  const res = await fetch(`${API}/${nurseryId}/teachers`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  const data = await res.json();

  if (data.success) {
    workers.push(data.teacher);
    renderWorkers();
    closeTeacherModal();
  } else {
    alert("Error adding teacher");
  }
}

async function saveTeacher(index = null) {
  const nurseryId = localStorage.getItem("nurseryId");

  const payload = {
    name: document.getElementById("teacherNameInput").value,
    role: document.getElementById("teacherRoleInput").value,
    email: document.getElementById("teacherEmailInput").value,
    phone: document.getElementById("teacherPhoneInput").value,
    assignedClass: document.getElementById("teacherClassInput").value
  };

  try {
    let data;
    if (index !== null) {
      // EDIT existing teacher
      const teacherId = workers[index]._id;
      const res = await fetch(`${API}/${nurseryId}/teachers/${teacherId}/assign`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...payload, classId: payload.assignedClass })
      });
      data = await res.json();
      workers[index] = data.teacher; // update local array
    } else {
      // ADD new teacher
      const res = await fetch(`${API}/${nurseryId}/teachers`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      data = await res.json();
      workers.push(data.teacher);
    }

    renderWorkers();
    closeTeacherModal();
  } catch (err) {
    console.error(err);
    alert("Error saving teacher");
  }
}


async function updateAssignedClass(index, newClassId) {
  const nurseryId = localStorage.getItem("nurseryId");
  const teacherId = workers[index]._id;

  const res = await fetch(`${API}/${nurseryId}/teachers/${teacherId}/assign`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ classId: newClassId })
  });

  const data = await res.json();

  if (data.success) {
    workers[index] = data.teacher;
  } else {
    alert("Failed to update assignment");
  }
}

async function deleteWorker(index) {
  const nurseryId = localStorage.getItem("nurseryId");
  const teacherId = workers[index]._id;

  if (!confirm("Delete this teacher?")) return;

  const res = await fetch(`${API}/${nurseryId}/teachers/${teacherId}`, {
    method: "DELETE"
  });

  const data = await res.json();

  if (data.success) {
    workers.splice(index, 1);
    renderWorkers();
  } else {
    alert("Failed to delete teacher");
  }
}

/* ---------------------
   LOAD CLASSES & TEACHERS
----------------------*/
async function loadClasses() {
  const nurseryId = localStorage.getItem("nurseryId");
  const res = await fetch(`${API}/${nurseryId}/classes`);
  const data = await res.json();

  if (data.success) {
    classes = data.classes;
    renderClasses();

    const classSelect = document.getElementById("teacherClassInput");
    classSelect.innerHTML =
      `<option value="">Assign Class</option>` +
      classes.map(c => `<option value="${c._id}">${c.name}</option>`).join('');
  }
}

async function loadWorkers() {
  const nurseryId = localStorage.getItem("nurseryId");
  const res = await fetch(`${API}/${nurseryId}/teachers`);
  const data = await res.json();

  if (data.success) {
    workers = data.teachers;
    renderWorkers();
  }
}

/* ---------------------
   TABLE RENDERING
----------------------*/
const classesTableBody = document.getElementById('classesTableBody');
const workersTableBody = document.getElementById('workersTableBody');

function renderClasses() {
  classesTableBody.innerHTML = '';
  classes.forEach((cls, index) => {
    const row = document.createElement('tr');
    row.innerHTML = `
      <td onmouseover="showClassTooltip(event, ${index})" onmouseout="hideTooltip()">${cls.name}</td>
      <td>${cls.passKey}</td>
      <td>
        <button class="btn btn-edit" onclick="editClass(${index})">Edit</button>
        <button class="btn btn-delete" onclick="deleteClass('${cls._id}')">Delete</button>
      </td>
    `;
    classesTableBody.appendChild(row);
  });
}

// Table rendering fix
function renderWorkers() {
  workersTableBody.innerHTML = '';
  workers.forEach((worker, index) => {
    const classOptions = classes.map(c =>
      `<option value="${c._id}" ${worker.assignedClass === c._id ? "selected" : ""}>${c.name}</option>`
    ).join('');

    const row = document.createElement('tr');
    row.innerHTML = `
      <td>${worker.name}</td>
      <td>${worker.role}</td>
      <td><select onchange="updateAssignedClass(${index}, this.value)">${classOptions}</select></td>
      <td>${worker.email}</td>
      <td>${worker.phone}</td>
      <td>
        <button class="btn btn-edit" onclick="editWorker(${index})">Edit</button>
        <button class="btn btn-delete" onclick="deleteWorker(${index})">Delete</button>
      </td>
    `;
    workersTableBody.appendChild(row);
  });
}


/* ---------------------
   MODALS
----------------------*/
let editingClassIndex = null;

function openClassModal(isEdit = false, cls = null) {
  document.getElementById("classModal").style.display = "block";
  document.getElementById("classModalTitle").innerText = isEdit ? "Edit Class" : "Add Class";

  if (isEdit) {
    document.getElementById("classNameInput").value = cls.name;
    document.getElementById("classPassKeyInput").value = cls.passKey;
    editingClassIndex = classes.findIndex(c => c._id === cls._id); // remember which class we edit
  } else {
    document.getElementById("classForm").reset();
    editingClassIndex = null;
  }
}

async function saveClass() {
  const nurseryId = localStorage.getItem("nurseryId");
  const name = document.getElementById("classNameInput").value;
  const passKey = document.getElementById("classPassKeyInput").value;

  if (editingClassIndex !== null) {
    // EDIT existing class
    const classId = classes[editingClassIndex]._id;
    const res = await fetch(`${API}/${nurseryId}/classes/${classId}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, passKey })
    });
    const data = await res.json();
    if (data.success) {
      classes[editingClassIndex] = data.class;
      renderClasses();
      closeClassModal();
    } else {
      alert("Failed to update class");
    }
  } else {
    // ADD new class
    const res = await fetch(`${API}/${nurseryId}/classes`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, passKey })
    });
    const data = await res.json();
    if (data.success) {
      classes.push(data.class);
      renderClasses();
      closeClassModal();
    } else {
      alert("Error adding class");
    }
  }
}

document.getElementById("classForm").onsubmit = e => {
  e.preventDefault();
  saveClass();
};


function closeClassModal() {
  document.getElementById("classModal").style.display = "none";
}

let editingTeacherIndex = null;

function openAddTeacherModal(isEdit = false, worker = null) {
  document.getElementById("teacherModal").style.display = "block";
  document.getElementById("teacherModalTitle").innerText = isEdit ? "Edit Teacher" : "Add Teacher";

  const classSelect = document.getElementById("teacherClassInput");
  classSelect.innerHTML =
    `<option value="">-- Select Class --</option>` +
    classes.map(c => `<option value="${c._id}">${c.name}</option>`).join('');

  if (isEdit && worker) {
    document.getElementById("teacherNameInput").value = worker.name;
    document.getElementById("teacherRoleInput").value = worker.role;
    document.getElementById("teacherEmailInput").value = worker.email;
    document.getElementById("teacherPhoneInput").value = worker.phone;
    classSelect.value = worker.assignedClass || "";

    editingTeacherIndex = workers.findIndex(w => w._id === worker._id);
  } else {
    document.getElementById("teacherForm").reset();
    editingTeacherIndex = null;
  }
}

async function saveTeacher() {
  const nurseryId = localStorage.getItem("nurseryId");

  const name = document.getElementById("teacherNameInput").value.trim();
  const role = document.getElementById("teacherRoleInput").value.trim();
  const email = document.getElementById("teacherEmailInput").value.trim();
  const phone = document.getElementById("teacherPhoneInput").value.trim();
  const assignedClass = document.getElementById("teacherClassInput").value;

  // ----------------------
  // Frontend validation
  // ----------------------
  if (!name || !role || !email || !phone) {
    return alert("Please fill all teacher details.");
  }

  if (!assignedClass) {
    return alert("Please assign a class before saving the teacher.");
  }

  const payload = { name, role, email, phone, assignedClass };

  try {
    let res, data;

    if (editingTeacherIndex !== null) {
      // EDIT existing teacher
      const teacherId = workers[editingTeacherIndex]._id;
      res = await fetch(`${API}/${nurseryId}/teachers/${teacherId}/assign`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      data = await res.json();

      if (data.success) {
        workers[editingTeacherIndex] = data.teacher;
      } else {
        return alert("Failed to update teacher");
      }
    } else {
      // ADD new teacher
      res = await fetch(`${API}/${nurseryId}/teachers`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      data = await res.json();

      if (data.success) {
        workers.push(data.teacher);
      } else {
        return alert("Error adding teacher");
      }
    }

    renderWorkers();
    closeTeacherModal();
  } catch (err) {
    console.error(err);
    alert("Error saving teacher");
  }
}

document.getElementById("teacherForm").onsubmit = e => {
  e.preventDefault();
  saveTeacher();
};

function closeTeacherModal() {
  document.getElementById("teacherModal").style.display = "none";
}


/* ---------------------
   TOOLTIP
----------------------*/
function showClassTooltip(e, index) {
  const tooltip = document.getElementById("classTooltip");
  tooltip.innerHTML = `<strong>Class:</strong> ${classes[index].name}<br><strong>Pass Key:</strong> ${classes[index].passKey}`;
  tooltip.style.left = e.pageX + 10 + "px";
  tooltip.style.top = e.pageY + 10 + "px";
  tooltip.style.display = "block";
}

function hideTooltip() {
  document.getElementById("classTooltip").style.display = "none";
}



/* ---------------------
   EDIT HANDLERS
----------------------*/
function editClass(index) {
  openClassModal(true, classes[index]);
}

function editWorker(index) {
  openAddTeacherModal(true, workers[index]);
}

/* ---------------------
   LOGOUT & BACK
----------------------*/
function logout() {
  localStorage.clear();
  window.location.href = "/choose-user.html";
}

function goBack() {
  window.history.back();
}

/* ---------------------
   INITIAL LOAD
----------------------*/
window.onload = () => {
  loadNursery();
  loadClasses();
  loadWorkers();
};

</script>


</body>

</html>
