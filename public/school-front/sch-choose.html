<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nursery Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />

<style>
  body {
    margin: 0;
    font-family: "Poppins", sans-serif;
    background: linear-gradient(135deg, #fceabb, #f8b500);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 50px;
  }

  .card {
    background: white;
    padding: 30px;
    border-radius: 24px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.15);
    width: 90%;
    max-width: 600px;
    animation: fadeIn 0.8s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h1 {
    text-align: center;
    margin-bottom: 30px;
    font-weight: 600;
    color: #333;
  }

  ul {
    list-style: none;
    padding: 0;
  }

  li {
    background: #2196f3;
    color: white;
    padding: 15px 20px;
    border-radius: 12px;
    margin-bottom: 15px;
    cursor: pointer;
    font-weight: 500;
    transition: background 0.2s, transform 0.2s;
  }

  li:hover {
    background: #1976d2;
    transform: translateY(-2px);
  }
</style>
</head>

<body>
<div class="card">
  <h1>Nursery Dashboard</h1>
  <ul id="menuList"></ul>
</div>

<script>
  // Example user role (replace with real login info)
  // Options: member, teacher, supervisor, manager
  const userRole = 'supervisor'; // For demo, change role to see different menus

  const menuList = document.getElementById('menuList');

  // Define menu items per role
  const menuItems = {
    member: ["Class Activities", "Class Routines"],
    teacher: ["Class Activities", "Class Routines", "Class Behavior Chart"],
    supervisor: ["Which Class", "Class Activities", "Class Routines", "Class Behavior Chart", "Class Teacher Behavior"],
    manager: ["Which Class", "Class Activities", "Class Routines", "Class Behavior Chart", "Class Teacher Behavior", "Nursery Structure"]
  };

  // Render menu for current role
  const itemsToShow = menuItems[userRole] || [];
  itemsToShow.forEach(item => {
    const li = document.createElement('li');
    li.textContent = item;
    li.onclick = () => {
      alert(`Clicked: ${item}`);
      // TODO: redirect to respective page
    };
    menuList.appendChild(li);
  });
</script>
</body>
</html>
