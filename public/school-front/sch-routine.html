<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Class Routine</title>

<style>
  body {
    font-family: "Poppins", sans-serif;
    background: #f8f9fa;
    margin: 0;
    padding: 20px;
  }

  /* Buttons */
  .top-buttons {
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .btn {
    padding: 8px 14px;
    border-radius: 10px;
    border: none;
    color: white;
    cursor: pointer;
  }
  .btn-back { background: #3498db; }
  .btn-logout { background: #e74c3c; }

  h2 {
    color: #2c3e50;
    margin-top: 70px;
  }

  .routine-section {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    margin-top: 20px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 12px;
  }

  th, td {
    border-bottom: 1px solid #ddd;
    padding: 12px;
    text-align: left;
    font-size: 15px;
  }

  th {
    background: #f1f2f6;
    font-weight: 600;
  }

  .select-member {
    width: 180px;
    padding: 6px;
    border-radius: 6px;
  }

  #routineInput {
    width: 70%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
  }

  .btn-add {
    padding: 10px 18px;
    background: #2ecc71;
    border-radius: 8px;
    border: none;
    color: white;
    cursor: pointer;
    margin-left: 8px;
  }

</style>
</head>

<body>

<!-- Top Buttons -->
<div class="top-buttons">
  <button class="btn btn-logout" onclick="logout()">Logout</button>
  <button class="btn btn-back" onclick="goBack()">Back</button>
</div>

<h2>☀️ Class Routine</h2>

<div class="routine-section">

  <table id="routineTable">
    <thead>
      <tr>
        <th>Task</th>
        <th>Status</th>
        <th>Members</th>
      </tr>
    </thead>

    <tbody id="routineBody">
      <!-- Pre-filled examples -->
      <tr>
        <td>Morning Circle</td>
        <td><input type="checkbox"></td>
        <td>
          <select class="select-member" multiple>
            <option>Omar</option>
            <option>Laila</option>
            <option>Sara</option>
            <option>Adam</option>
            <option>Mariam</option>
          </select>
        </td>
      </tr>

      <tr>
        <td>Snack Time</td>
        <td><input type="checkbox"></td>
        <td>
          <select class="select-member" multiple>
            <option>Omar</option>
            <option>Laila</option>
            <option>Sara</option>
            <option>Adam</option>
            <option>Mariam</option>
          </select>
        </td>
      </tr>

    </tbody>
  </table>

  <input type="text" id="routineInput" placeholder="Add new routine task">
  <button class="btn-add" onclick="addRoutine()">➕ Add</button>

</div>

<script>
  const members = ["Omar", "Laila", "Sara", "Adam", "Mariam"];

  function addRoutine() {
    const input = document.getElementById("routineInput");
    const value = input.value.trim();
    if (!value) return alert("Enter a task name!");

    const tbody = document.getElementById("routineBody");

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${value}</td>
      <td><input type="checkbox"></td>
      <td>
        <select class="select-member" multiple>
          ${members.map(m => `<option>${m}</option>`).join("")}
        </select>
      </td>
    `;

    tbody.appendChild(tr);
    input.value = "";
  }

  function logout() { window.location.href = "index.html"; }
  function goBack() { window.history.back(); }
</script>

</body>
</html>
