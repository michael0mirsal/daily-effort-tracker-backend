<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Improved Class Routine</title>

<style>
  body {
    font-family: "Poppins", sans-serif;
    background: #f8f9fa;
    padding: 20px;
  }

  .routine-section {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 12px;
  }
  th, td {
    border-bottom: 1px solid #ddd;
    padding: 12px;
  }
  th {
    background: #f1f2f6;
    font-weight: 600;
  }

  .member-box {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .tag {
    background: #4daf7c;
    color: white;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .tag span {
    cursor: pointer;
    font-weight: bold;
  }

  .member-select {
    padding: 6px;
    border-radius: 6px;
    border: 1px solid #ccc;
  }

  #routineInput {
    width: 70%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
  }

  .btn-add {
    padding: 10px 18px;
    background: #2ecc71;
    border-radius: 8px;
    border: none;
    color: white;
    cursor: pointer;
  }

</style>
</head>
<body>

<h2>☀️ Class Routine with Active Members</h2>

<div class="routine-section">

  <table id="routineTable">
    <thead>
      <tr>
        <th>Task</th>
        <th>Status</th>
        <th>Members</th>
      </tr>
    </thead>

    <tbody id="routineBody"></tbody>
  </table>

  <input type="text" id="routineInput" placeholder="Add new routine task" />
  <button class="btn-add" onclick="addRoutine()">➕ Add</button>

</div>

<script>
  const membersList = ["Omar", "Laila", "Sara", "Adam", "Mariam"];

  function addRoutine() {
    const task = document.getElementById("routineInput").value.trim();
    if (!task) return alert("Enter task!");

    const tbody = document.getElementById("routineBody");

    // Build member dropdown dynamically
    const memberOptions = membersList.map(m => `<option value="${m}">${m}</option>`).join("");

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${task}</td>
      <td><input type="checkbox"></td>
      <td>
        <div class="member-box"></div>
        <select class="member-select">
          <option value="">Add member...</option>
          ${memberOptions}
        </select>
      </td>
    `;

    tbody.appendChild(tr);

    const select = tr.querySelector(".member-select");
    const memberBox = tr.querySelector(".member-box");

    // Handle adding members
    select.addEventListener("change", () => {
      const name = select.value;
      if (!name) return;

      // Prevent duplicates
      if ([...memberBox.children].some(tag => tag.dataset.name === name)) {
        select.value = "";
        return;
      }

      // Create tag
      const tag = document.createElement("div");
      tag.className = "tag";
      tag.dataset.name = name;
      tag.innerHTML = `${name} <span>x</span>`;

      // Remove member when clicking "x"
      tag.querySelector("span").onclick = () => tag.remove();

      memberBox.appendChild(tag);

      select.value = "";
    });

    document.getElementById("routineInput").value = "";
  }

</script>

</body>
</html>
