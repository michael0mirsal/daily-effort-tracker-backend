<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Class Routines</title>

<style>
  body {
    font-family: "Poppins", sans-serif;
    background: #f0f2f5;
    margin: 0;
    padding: 20px;
  }

  /* Header Buttons */
  .top-buttons {
    position: fixed;
    top: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .btn {
    padding: 8px 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    color: white;
    font-size: 14px;
  }
  .btn-logout { background: #e84118; }
  .btn-back { background: #0097e6; }

  h2 { margin-top: 70px; }
  h3 { color: #333; }

  /* Routine Card */
  .routine-card {
    background: white;
    padding: 20px;
    margin-top: 15px;
    border-radius: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.1);
  }

  .routine-title {
    font-size: 18px;
    font-weight: bold;
    color: #2f3640;
  }

  /* Toggle */
  .switch {
    position: relative;
    display: inline-block;
    width: 48px;
    height: 24px;
    margin-left: 15px;
  }
  .switch input { display:none; }
  .slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0;
    right: 0; bottom: 0;
    background-color: #ccc;
    transition: .3s;
    border-radius: 24px;
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 18px; width: 18px;
    left: 3px; bottom: 3px;
    background-color: white;
    transition: .3s;
    border-radius: 50%;
  }
  input:checked + .slider {
    background-color: #4cd137;
  }
  input:checked + .slider:before {
    transform: translateX(24px);
  }

  /* Multi-select container */
  .member-box {
    margin-top: 10px;
  }
  .member-select {
    width: 240px;
    height: 90px;
    padding: 8px;
    border-radius: 10px;
    border: 1px solid #aaa;
  }

  /* Add Member Button */
  .btn-add-member {
    background: #00a8ff;
    color: white;
    border-radius: 8px;
    padding: 6px 14px;
    margin-top: 10px;
    cursor: pointer;
    border: none;
  }
</style>
</head>

<body>

<!-- Top Right Header Buttons -->
<div class="top-buttons">
  <button class="btn btn-logout" onclick="logout()">Logout</button>
  <button class="btn btn-back" onclick="goBack()">Back</button>
</div>

<h2>👋 Welcome, <span id="username">User</span></h2>
<h3>Class Routines</h3>
<p>Select completed routines and add members who performed them:</p>

<div id="routineContainer"></div>

<script>
  // demo class members
  const classMembers = ["Omar", "Laila", "Sara", "Adam", "Mariam"];

  // routines list
  const routines = [
    "Morning Circle",
    "Snack Time",
    "Outdoor Play",
    "Story Reading",
    "Nap Time",
    "Activity Sheet",
    "Cleanup Time"
  ];

  const container = document.getElementById("routineContainer");

  routines.forEach((routine, index) => {
    const card = document.createElement("div");
    card.className = "routine-card";

    card.innerHTML = `
      <div class="routine-title">${routine}
        <label class="switch">
          <input type="checkbox">
          <span class="slider"></span>
        </label>
      </div>

      <div class="member-box">
        <label style="font-weight: 600;">Members involved:</label><br>
        <select multiple class="member-select" id="members-${index}">
          ${classMembers.map(m => `<option value="${m}">${m}</option>`).join("")}
        </select>
      </div>

      <button class="btn-add-member" onclick="addMember(${index})">+ Add Member</button>
    `;

    container.appendChild(card);
  });

  // Add a new member dynamically
  function addMember(index) {
    const name = prompt("Enter new member name:");
    if (!name) return;

    classMembers.push(name);

    const select = document.getElementById(`members-${index}`);
    const option = document.createElement("option");
    option.value = name;
    option.textContent = name;
    select.appendChild(option);

    alert("Member added successfully!");
  }

  function logout() {
    window.location.href = "index.html";
  }

  function goBack() {
    window.history.back();
  }
</script>

</body>
</html>
