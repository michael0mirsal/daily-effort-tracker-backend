<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class Members Management</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />

<style>
  body {
    margin: 0;
    font-family: "Poppins", sans-serif;
    background: #faf7e8;
    padding: 20px;
  }

  h1, h2 { text-align: center; color: #333; }
  h3 { color: #444; margin-top: 20px; }

  .container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 16px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
  }

  input, select {
    width: 100%;
    margin: 6px 0;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 15px;
  }

  button {
    padding: 12px 20px;
    background: #ff8c2a;
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-size: 16px;
    margin-top: 15px;
  }
  button:hover { background: #ff6a00; }

  .section-title {
    background: #ffefc7;
    padding: 10px;
    border-radius: 10px;
    margin: 30px 0 10px;
    font-weight: 600;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
  }

  th, td {
    border: 1px solid #ddd;
    padding: 10px;
  }

  th {
    background: #ffe9bb;
  }

</style>
</head>

<body>

<div class="container">

  <h1>Class Members</h1>

  <!-- CLASS DROPDOWN -->
  <h2>Select Class</h2>
  <select id="classSelect">
    <option value="">Select Class</option>
  </select>

  <button onclick="loadClassMembers()">Show Class Members</button>

  <table id="membersTable">
    <thead>
      <tr>
        <th>#</th>
        <th>Full Name</th>
        <th>Age</th>
        <th>Gender</th>
        <th>Parent 1 Phone</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="membersBody"></tbody>
  </table>

  <!-- ADD MEMBER FORM -->
  <h2 class="section-title">Add New Member</h2>

  <h3>Basic Info</h3>
  <input id="fullName" placeholder="Full Name">
  <select id="gender">
    <option value="male">Male</option>
    <option value="female">Female</option>
  </select>
  <input id="age" type="number" placeholder="Age">
  <input id="dateOfBirth" type="date">

  <h3>Avatar</h3>
  <input id="avatar" placeholder="Photo URL">

  <h3>Address</h3>
  <input id="street" placeholder="Street">
  <input id="city" placeholder="City">
  <input id="area" placeholder="Area">

  <h3>Parent 1</h3>
  <input id="parent1Name" placeholder="Parent 1 Name">
  <input id="parent1Phone" placeholder="Parent 1 Phone">
  <input id="parent1Email" placeholder="Parent 1 Email">

  <h3>Parent 2</h3>
  <input id="parent2Name" placeholder="Parent 2 Name">
  <input id="parent2Phone" placeholder="Parent 2 Phone">
  <input id="parent2Email" placeholder="Parent 2 Email">

  <h3>Emergency Contact</h3>
  <input id="emergencyContactName" placeholder="Contact Name">
  <input id="emergencyContactPhone" placeholder="Contact Phone">
  <input id="emergencyRelation" placeholder="Relation">

  <h3>Medical Info</h3>
  <input id="allergies" placeholder="Allergies">
  <input id="medications" placeholder="Medications">
  <input id="medicalNotes" placeholder="Medical Notes">

  <h3>Status</h3>
  <select id="status">
    <option value="active">Active</option>
    <option value="left">Left</option>
    <option value="graduated">Graduated</option>
  </select>

  <h3>Notes</h3>
  <input id="notes" placeholder="Notes (Optional)">

  <button onclick="addMember()">Add Member</button>

</div>

<script>
const API = "http://localhost:3000";

// =========================
// LOAD CLASSES INTO DROPDOWN
// =========================
async function loadClasses() {
  try {
    const res = await fetch(`${API}/api/classes`);
    const classes = await res.json();

    const sel = document.getElementById("classSelect");

    classes.forEach(c => {
      let opt = document.createElement("option");
      opt.value = c._id;
      opt.textContent = c.name;
      sel.appendChild(opt);
    });

  } catch (err) {
    console.error("Error loading classes:", err);
  }
}
loadClasses();


// =========================
// SHOW CLASS MEMBERS
// =========================
async function loadClassMembers() {
  const classId = classSelect.value;
  if (!classId) return alert("Select a class first!");

  try {
    const res = await fetch(`${API}/api/classMembers/${classId}`);
    const members = await res.json();

    const tbody = document.getElementById("membersBody");
    tbody.innerHTML = "";

    members.forEach((m, i) => {
      const row = `
        <tr>
          <td>${i + 1}</td>
          <td>${m.fullName}</td>
          <td>${m.age}</td>
          <td>${m.gender}</td>
          <td>${m.parent1Phone}</td>
          <td>${m.status}</td>
        </tr>
      `;
      tbody.innerHTML += row;
    });

  } catch (err) {
    console.error(err);
  }
}


// =========================
// ADD MEMBER (FULL SCHEMA)
// =========================
async function addMember() {

  const payload = {
    fullName: fullName.value,
    gender: gender.value,
    age: Number(age.value),
    dateOfBirth: dateOfBirth.value,

    avatar: avatar.value,

    address: {
      street: street.value,
      city: city.value,
      area: area.value
    },

    parent1Name: parent1Name.value,
    parent1Phone: parent1Phone.value,
    parent1Email: parent1Email.value,

    parent2Name: parent2Name.value,
    parent2Phone: parent2Phone.value,
    parent2Email: parent2Email.value,

    emergencyContactName: emergencyContactName.value,
    emergencyContactPhone: emergencyContactPhone.value,
    emergencyRelation: emergencyRelation.value,

    allergies: allergies.value,
    medications: medications.value,
    medicalNotes: medicalNotes.value,

    class: classSelect.value,
    nursery: "NurseryID-from-login",
    family: "FamilyID-from-login",

    role: "kid",
    status: status.value,
    notes: notes.value
  };

  if (!payload.fullName || !payload.age || !payload.class) {
    return alert("⚠ Full name, age, and class are required!");
  }

  try {
    const res = await fetch(`${API}/api/classMembers`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const data = await res.json();

    if (!res.ok) throw new Error(data.error || "Failed to add member");

    alert("Member added successfully!");

    loadClassMembers();

  } catch (err) {
    console.error(err);
    alert("Error adding member.");
  }
}
</script>

</body>
</html>
