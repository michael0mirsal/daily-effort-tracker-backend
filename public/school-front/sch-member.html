<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Add Member</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />

<style>
  body {
    margin: 0;
    font-family: "Poppins", sans-serif;
    background: #f6f7fb;
    padding: 20px;
    display: flex;
    justify-content: center;
  }

  .container {
    background: white;
    padding: 30px;
    border-radius: 18px;
    width: 95%;
    max-width: 800px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
  }

  h1 {
    text-align: center;
    margin-bottom: 25px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
  }

  label {
    font-size: 14px;
    margin-bottom: 6px;
    font-weight: 600;
  }

  input, select, textarea {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 14px;
  }

  textarea {
    resize: none;
  }

  .btn {
    padding: 12px 20px;
    background: #2196f3;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    margin-top: 20px;
  }

  .btn:hover {
    background: #0b7dda;
  }

  .class-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    margin-top: 30px;
  }

  .btn-show {
    background: #ff9800;
  }

  .btn-show:hover {
    background: #e68900;
  }

  /* Popup Modal */
  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
  }

  .modal-content {
    background: white;
    padding: 25px;
    border-radius: 16px;
    width: 90%;
    max-width: 600px;
    max-height: 80%;
    overflow-y: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    animation: fadeIn 0.4s ease-out;
  }

  @keyframes fadeIn {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .close {
    float: right;
    font-size: 20px;
    cursor: pointer;
    color: #444;
  }

  ul.member-list {
    list-style: none;
    padding: 0;
  }

  ul.member-list li {
    background: #2196f3;
    color: white;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 10px;
  }
</style>
</head>

<body>

<div class="container">

  <h1>Add New Member</h1>

  <!-- Class selection -->
  <div class="class-header">
    <div style="flex: 1; margin-right: 10px;">
      <label>Select Class</label>
      <select id="classSelect">
        <option value="">Loading...</option>
      </select>
    </div>

    <button class="btn btn-show" onclick="showClassMembers()">Show Members</button>
  </div>

  <!-- Add Member Form -->
  <div class="form-grid">

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="fullName" required>
    </div>

    <div class="form-group">
      <label>Gender</label>
      <select id="gender">
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
    </div>

    <div class="form-group">
      <label>Age</label>
      <input type="number" id="age">
    </div>

    <div class="form-group">
      <label>Date of Birth</label>
      <input type="date" id="dob">
    </div>

    <div class="form-group">
      <label>Street</label>
      <input type="text" id="street">
    </div>

    <div class="form-group">
      <label>City</label>
      <input type="text" id="city">
    </div>

    <div class="form-group">
      <label>Area</label>
      <input type="text" id="area">
    </div>

    <div class="form-group">
      <label>Avatar Link</label>
      <input type="text" id="avatar">
    </div>

    <div class="form-group">
      <label>Parent 1 Name</label>
      <input type="text" id="parent1Name">
    </div>

    <div class="form-group">
      <label>Parent 1 Phone</label>
      <input type="text" id="parent1Phone">
    </div>

    <div class="form-group">
      <label>Parent 1 Email</label>
      <input type="email" id="parent1Email">
    </div>

    <div class="form-group">
      <label>Parent 2 Name</label>
      <input type="text" id="parent2Name">
    </div>

    <div class="form-group">
      <label>Parent 2 Phone</label>
      <input type="text" id="parent2Phone">
    </div>

    <div class="form-group">
      <label>Parent 2 Email</label>
      <input type="email" id="parent2Email">
    </div>

    <div class="form-group">
      <label>Emergency Contact Name</label>
      <input type="text" id="emergencyName">
    </div>

    <div class="form-group">
      <label>Emergency Contact Phone</label>
      <input type="text" id="emergencyPhone">
    </div>

    <div class="form-group">
      <label>Emergency Relation</label>
      <input type="text" id="emergencyRelation">
    </div>

    <div class="form-group" style="grid-column: span 2;">
      <label>Medical Notes</label>
      <textarea id="medicalNotes" rows="3"></textarea>
    </div>

  </div>

  <button class="btn" onclick="submitMember()">Save Member</button>

</div>

<!-- POPUP -->
<div id="memberModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h2>Class Members</h2>
    <ul class="member-list" id="memberList"></ul>
  </div>
</div>

<script>
  const API = "http://localhost:3000/api";

  async function loadClasses() {
    const res = await fetch(`${API}/classes`);
    const data = await res.json();

    const select = document.getElementById("classSelect");
    select.innerHTML = "";

    data.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c._id;
      opt.textContent = c.name;
      select.appendChild(opt);
    });
  }

  loadClasses();

  async function showClassMembers() {
    const classId = document.getElementById("classSelect").value;
    if (!classId) return alert("Please select a class.");

    const res = await fetch(`${API}/members/class/${classId}`);
    const members = await res.json();

    const list = document.getElementById("memberList");
    list.innerHTML = "";

    members.forEach(m => {
      const li = document.createElement("li");
      li.textContent = m.fullName;
      list.appendChild(li);
    });

    document.getElementById("memberModal").style.display = "flex";
  }

  function closeModal() {
    document.getElementById("memberModal").style.display = "none";
  }

  async function submitMember() {
    const body = {
      fullName: fullName.value,
      gender: gender.value,
      age: age.value,
      dateOfBirth: dob.value,
      avatar: avatar.value,

      address: {
        street: street.value,
        city: city.value,
        area: area.value
      },

      parent1Name: parent1Name.value,
      parent1Phone: parent1Phone.value,
      parent1Email: parent1Email.value,

      parent2Name: parent2Name.value,
      parent2Phone: parent2Phone.value,
      parent2Email: parent2Email.value,

      emergencyContactName: emergencyName.value,
      emergencyContactPhone: emergencyPhone.value,
      emergencyRelation: emergencyRelation.value,

      medicalNotes: medicalNotes.value,

      class: classSelect.value,
      nursery: "YOUR_NURSERY_ID",
      family: "YOUR_FAMILY_ID",
      role: "kid",
      status: "active"
    };

    const res = await fetch(`${API}/members`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });

    if (res.ok) alert("Member added successfully!");
    else alert("Error adding member");
  }
</script>

</body>
</html>
