<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Class Members Management</title>
<style>
  body {
    font-family: Poppins, sans-serif;
    background: #faf3d4;
    padding: 20px;
  }

  h1, h2 {
    text-align: center;
    color: #d17b00;
  }

  .card {
    background: white;
    padding: 20px;
    border-radius: 18px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    max-width: 900px;
    margin: auto;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
  }

  input, select {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    width: 100%;
  }

  label {
    font-weight: bold;
    margin-bottom: 5px;
    display: block;
  }

  button {
    padding: 12px 18px;
    background: #ff9800;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    margin-top: 10px;
  }

  button:hover {
    background: #fb8c00;
  }

  .popup {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    justify-content: center;
    align-items: center;
  }

  .popup-content {
    background: white;
    width: 80%;
    max-width: 700px;
    padding: 20px;
    border-radius: 15px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
  }

  th, td {
    padding: 10px;
    border: 1px solid #ddd;
  }

  th {
    background: #ffe6b3;
  }

</style>
</head>
<body>

<h1>Class Members</h1>

<div class="card">

  <h2>Add Member</h2>

  <div class="form-grid">

    <div>
      <label>Full Name</label>
      <input id="fullName" type="text">
    </div>

    <div>
      <label>Gender</label>
      <select id="gender">
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
    </div>

    <div>
      <label>Age</label>
      <input id="age" type="number">
    </div>

    <div>
      <label>Date of Birth</label>
      <input id="dob" type="date">
    </div>

    <!-- Dad Info -->
    <div>
      <label>Dad Name</label>
      <input id="dadName" type="text">
    </div>

    <div>
      <label>Dad Phone</label>
      <input id="dadPhone" type="text">
    </div>

    <div>
      <label>Dad Email</label>
      <input id="dadEmail" type="email">
    </div>

    <!-- Mom Info -->
    <div>
      <label>Mom Name</label>
      <input id="momName" type="text">
    </div>

    <div>
      <label>Mom Phone</label>
      <input id="momPhone" type="text">
    </div>

    <div>
      <label>Mom Email</label>
      <input id="momEmail" type="email">
    </div>

    <!-- Emergency -->
    <div>
      <label>Emergency Name</label>
      <input id="emgName" type="text">
    </div>

    <div>
      <label>Emergency Phone</label>
      <input id="emgPhone" type="text">
    </div>

    <div>
      <label>Emergency Relation</label>
      <input id="emgRelation" type="text">
    </div>

    <!-- Class Selection -->
    <div>
      <label>Select Class</label>
      <select id="classSelect"></select>
    </div>

  </div>

  <button onclick="saveMember()">Save Member</button>

  <hr style="margin: 25px 0">

  <h2>Show Class Members</h2>

  <select id="classShow"></select>
  <button onclick="openPopup()">Show</button>

</div>

<!-- POPUP -->
<div id="popup" class="popup">
  <div class="popup-content">
    <h2>Class Members</h2>
    <table>
      <thead>
        <tr>
          <th>Name</th><th>Age</th><th>Dad</th><th>Mom</th>
        </tr>
      </thead>
      <tbody id="membersTable"></tbody>
    </table>

    <br>
    <button onclick="closePopup()">Close</button>
  </div>
</div>

<script>
const API = "http://localhost:3000/api";

// Load class dropdowns
async function loadClasses() {
  const res = await fetch(`${API}/classes`);
  const classes = await res.json();

  const classSelect = document.getElementById("classSelect");
  const classShow = document.getElementById("classShow");

  classes.forEach(c => {
    const opt = new Option(c.name, c._id);
    classSelect.appendChild(opt);
    classShow.appendChild(opt.cloneNode(true));
  });
}
loadClasses();

// Save Member
async function saveMember() {
  const body = {
    fullName: fullName.value,
    gender: gender.value,
    age: age.value,
    dateOfBirth: dob.value,

    dadName: dadName.value,
    dadPhone: dadPhone.value,
    dadEmail: dadEmail.value,

    momName: momName.value,
    momPhone: momPhone.value,
    momEmail: momEmail.value,

    emergencyContactName: emgName.value,
    emergencyContactPhone: emgPhone.value,
    emergencyRelation: emgRelation.value,

    class: classSelect.value,
    nursery: localStorage.getItem("nurseryId"),
    family: localStorage.getItem("familyId"),
  };

  await fetch(`${API}/members`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });

  alert("Member Saved!");
}

// Popup Show
async function openPopup() {
  const classId = classShow.value;

  const res = await fetch(`${API}/members/class/${classId}`);
  const members = await res.json();

  const table = document.getElementById("membersTable");
  table.innerHTML = "";

  members.forEach(m => {
    const row = `
      <tr>
        <td>${m.fullName}</td>
        <td>${m.age}</td>
        <td>${m.dadName}</td>
        <td>${m.momName}</td>
      </tr>
    `;
    table.innerHTML += row;
  });

  document.getElementById("popup").style.display = "flex";
}

function closePopup() {
  document.getElementById("popup").style.display = "none";
}
</script>

</body>
</html>
