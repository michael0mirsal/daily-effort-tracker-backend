<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nursery Tree</title>
<style>
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #fceabb, #f8b500);
    overflow: hidden;
}

#container {
    display: flex;
    height: 100%;
}

/* LEFT TREE PANEL */
#treePanel {
    width: 35%;
    height: 100%;
    background: rgba(255,255,255,0.3);
    padding: 20px;
    box-sizing: border-box;
    border-right: 4px dashed rgba(255,255,255,0.7);
    overflow-y: auto;
    border-radius: 0 30px 30px 0;
    box-shadow: inset -5px 0 10px rgba(0,0,0,0.1);
}

#nurseryTitle {
    text-align: center;
    color: #5c4033;
    font-size: 2rem;
    margin-bottom: 20px;
    text-shadow: 1px 1px #fff;
}

/* CLASS BRANCHES */
.class-branch {
    background: #fff3cd;
    padding: 12px 25px;
    border-radius: 20px;
    margin: 12px auto;
    cursor: pointer;
    font-size: 1.2rem;
    width: fit-content;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: 0.3s;
    color: #5c4033;
    font-weight: bold;
}

.class-branch:hover {
    transform: scale(1.05);
    background: #ffecb3;
}

/* CHILD ITEMS UNDER CLASS */
.child-items {
    margin-left: 30px;
    margin-top: 10px;
    display: none; /* hidden by default */
}

.child-items .teacher-box {
    background: #ffe8a1;
    padding: 8px 12px;
    border-radius: 12px;
    margin-bottom: 5px;
}
.child-items .kid-box {
    background: #fff;
    padding: 6px 10px;
    border-radius: 12px;
    margin-bottom: 3px;
}

/* RIGHT PANEL */
#rightPanel {
    width: 65%;
    height: 100%;
    position: relative;
    padding: 20px;
    box-sizing: border-box;
    overflow-y: auto;
    text-align: center;
}

/* TOP RIGHT BUTTONS */
#topButtons {
    position: absolute;
    top: 15px;
    right: 15px;
    display: flex;
    gap: 10px;
}
button {
    padding: 10px 20px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    font-weight: bold;
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
}
#logoutBtn { background: #e57373; color: white; }
#backBtn { background: #81c784; color: white; }

/* REPORT AREA */
#classReport {
    margin-top: 70px;
}
#reportContent {
    margin-top: 20px;
    padding: 25px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    font-size: 1.2rem;
    text-align: left;
}
</style>
</head>
<body>

<div id="container">
    <!-- LEFT TREE -->
    <div id="treePanel">
        <h2 id="nurseryTitle">Happy Kids Nursery</h2>
        <div id="classTree"></div>
    </div>

    <!-- RIGHT PANEL -->
    <div id="rightPanel">
        <div id="topButtons">
            <button id="backBtn">⬅ Back</button>
            <button id="logoutBtn">Logout</button>
        </div>

        <div id="classReport">
            <h2>Select a class to view full report</h2>
            <div id="reportContent"></div>
        </div>
    </div>
</div>

<script>
const API = "http://localhost:3000/api";

/* =====================================
   GLOBAL STATE
===================================== */
let TREE_CLASSES = [];
let MEMBERS_MAP = {};     // schoolMemberId -> name
let TREE_REPORTS = [];

/* =====================================
   LOAD CLASSES
===================================== */
async function loadTreeClasses() {
  const user = JSON.parse(localStorage.getItem("user"));
  if (!user) return;

  try {
    const res = await fetch(`${API}/nurseries/${user.nurseryId}/classes`);
    const data = await res.json();
    TREE_CLASSES = data.classes || [];
    buildTree();
  } catch (err) {
    console.error("❌ Failed to load tree classes", err);
  }
}

/* =====================================
   LOAD ALL MEMBERS OF CLASS
===================================== */
async function loadClassMembers(cls) {
  MEMBERS_MAP = {};

  if (!cls.members || cls.members.length === 0) return;

  try {
    const res = await fetch(`${API}/sch-members?ids=${cls.members.join(",")}`);
    const members = await res.json();

    members.forEach(sm => {
      if (sm._id && sm.name) {
        MEMBERS_MAP[sm._id] = sm.name;
      }
    });
  } catch (err) {
    console.error("❌ Failed to load class members", err);
  }
}

/* =====================================
   LOAD REPORTS (DATE REQUIRED)
===================================== */
async function loadClassReports(classId) {
  TREE_REPORTS = [];

  const dateInput = document.getElementById("filterDate");
  const date = dateInput && dateInput.value
    ? dateInput.value
    : new Date().toISOString().slice(0, 10); // TODAY

  try {
    const res = await fetch(`${API}/sch-activities?classId=${classId}&date=${date}`);
    TREE_REPORTS = await res.json();
  } catch (err) {
    console.error("❌ Failed to load reports", err);
  }
}

/* =====================================
   BUILD TREE
===================================== */
function buildTree() {
  const tree = document.getElementById("classTree");
  if (!tree) return;

  tree.innerHTML = "";

  TREE_CLASSES.forEach(cls => {
    const classDiv = document.createElement("div");
    classDiv.className = "class-branch";
    classDiv.textContent = cls.name;

    const childBox = document.createElement("div");
    childBox.className = "child-items";
    childBox.style.display = "none";

    // ---------- CLICK ----------
    classDiv.onclick = async () => {
      childBox.style.display =
        childBox.style.display === "block" ? "none" : "block";

      // Load members first
      await loadClassMembers(cls);

      // Show teachers
      childBox.innerHTML = "";
      if (!cls.teachers || cls.teachers.length === 0) {
        childBox.innerHTML += `<div class="teacher-box">👩‍🏫 No teacher</div>`;
      } else {
        cls.teachers.forEach(tid => {
          childBox.innerHTML += `
            <div class="teacher-box">
              👩‍🏫 ${MEMBERS_MAP[tid] || "Teacher"}
            </div>
          `;
        });
      }

      // Load reports
      await loadClassReports(cls._id);
      showTreeReport(cls);
    };

    tree.appendChild(classDiv);
    tree.appendChild(childBox);
  });
}

/* =====================================
   SHOW REPORT
===================================== */
function showTreeReport(cls) {
  const area = document.getElementById("reportContent");
  if (!area) return;

  let html = `<h2>${cls.name} – Daily Report</h2>`;

  if (!TREE_REPORTS.length) {
    area.innerHTML = html + "<p>No records found.</p>";
    return;
  }

  html += "<ul>";

  TREE_REPORTS.forEach(doc => {
    html += `
      <li>
        <b>🧒 ${doc.kidName || "Unknown Kid"}</b>
        <ul>
    `;

    doc.items.forEach(item => {
      html += `
        <li>
          🎯 ${item.activity || ""}
          | ⏱ ${item.timeMin || 0} min
          | ⭐ ${item.evaluation || 0}
          <br>📝 ${item.note || ""}
        </li>
      `;
    });

    html += "</ul></li>";
  });

  html += "</ul>";
  area.innerHTML = html;
}

/* =====================================
   INIT
===================================== */
window.addEventListener("DOMContentLoaded", loadTreeClasses);
</script>




</body>
</html>
