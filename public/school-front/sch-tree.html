<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nursery Tree</title>
<style>
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #fceabb, #f8b500);
    overflow: hidden;
}

#container {
    display: flex;
    height: 100%;
}

/* LEFT TREE PANEL */
#treePanel {
    width: 35%;
    height: 100%;
    background: rgba(255,255,255,0.3);
    padding: 20px;
    box-sizing: border-box;
    border-right: 4px dashed rgba(255,255,255,0.7);
    overflow-y: auto;
    border-radius: 0 30px 30px 0;
    box-shadow: inset -5px 0 10px rgba(0,0,0,0.1);
}

#nurseryTitle {
    text-align: center;
    color: #5c4033;
    font-size: 2rem;
    margin-bottom: 20px;
    text-shadow: 1px 1px #fff;
}

/* CLASS BRANCHES */
.class-branch {
    background: #fff3cd;
    padding: 12px 25px;
    border-radius: 20px;
    margin: 12px auto;
    cursor: pointer;
    font-size: 1.2rem;
    width: fit-content;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: 0.3s;
    color: #5c4033;
    font-weight: bold;
}

.class-branch:hover {
    transform: scale(1.05);
    background: #ffecb3;
}

/* CHILD ITEMS UNDER CLASS */
.child-items {
    margin-left: 30px;
    margin-top: 10px;
    display: none; /* hidden by default */
}

.child-items .teacher-box {
    background: #ffe8a1;
    padding: 8px 12px;
    border-radius: 12px;
    margin-bottom: 5px;
}
.child-items .kid-box {
    background: #fff;
    padding: 6px 10px;
    border-radius: 12px;
    margin-bottom: 3px;
}

/* RIGHT PANEL */
#rightPanel {
    width: 65%;
    height: 100%;
    position: relative;
    padding: 20px;
    box-sizing: border-box;
    overflow-y: auto;
    text-align: center;
}

/* TOP RIGHT BUTTONS */
#topButtons {
    position: absolute;
    top: 15px;
    right: 15px;
    display: flex;
    gap: 10px;
}
button {
    padding: 10px 20px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    font-weight: bold;
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
}
#logoutBtn { background: #e57373; color: white; }
#backBtn { background: #81c784; color: white; }

/* REPORT AREA */
#classReport {
    margin-top: 70px;
}
#reportContent {
    margin-top: 20px;
    padding: 25px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    font-size: 1.2rem;
    text-align: left;
}
</style>
</head>
<body>

<div id="container">
    <!-- LEFT TREE -->
    <div id="treePanel">
        <h2 id="nurseryTitle">Happy Kids Nursery</h2>
        <div id="classTree"></div>
    </div>

    <!-- RIGHT PANEL -->
    <div id="rightPanel">
        <div id="topButtons">
            <button id="backBtn">⬅ Back</button>
            <button id="logoutBtn">Logout</button>
        </div>

        <div id="classReport">
            <h2>Select a class to view full report</h2>
            <div id="reportContent"></div>
        </div>
    </div>
</div>

<script>
const API = "http://localhost:3000/api";

/* =====================================
   GLOBAL STATE
===================================== */
let TREE_CLASSES = [];
let MEMBERS_MAP = {};   // kidId -> name
let TEACHERS_MAP = {};  // teacherId -> name
let TREE_REPORTS = [];

/* =====================================
   LOAD CLASSES + MEMBERS + TEACHERS
===================================== */
async function loadTreeClasses() {
  const user = JSON.parse(localStorage.getItem("user"));
  if (!user) return;

  try {
    const res = await fetch(`${API}/nurseries/${user.nurseryId}/classes`);
    const data = await res.json();
    TREE_CLASSES = data.classes || [];

    // Extract all member and teacher IDs to batch load
    let allMemberIds = [];
    let allTeacherIds = [];
    TREE_CLASSES.forEach(cls => {
      allMemberIds.push(...cls.members.map(m => m._id || m));
      allTeacherIds.push(...cls.teachers.map(t => t._id || t));
    });

    // Remove duplicates
    allMemberIds = [...new Set(allMemberIds)];
    allTeacherIds = [...new Set(allTeacherIds)];

    // Load members
    if (allMemberIds.length > 0) {
      const memRes = await fetch(`${API}/sch-members?ids=${allMemberIds.join(",")}`);
      const members = await memRes.json();
      members.forEach(m => MEMBERS_MAP[m._id] = m.name);
    }

    // Load teachers
    if (allTeacherIds.length > 0) {
      const teachRes = await fetch(`${API}/teachers?ids=${allTeacherIds.join(",")}`);
      const teachers = await teachRes.json();
      teachers.forEach(t => TEACHERS_MAP[t._id] = t.name);
    }

    buildTree();
  } catch (err) {
    console.error("❌ Failed to load tree classes", err);
  }
}

/* =====================================
   LOAD REPORTS (DATE REQUIRED)
===================================== */
async function loadClassReports(classId) {
  TREE_REPORTS = [];

  const dateInput = document.getElementById("filterDate");
  const date = dateInput && dateInput.value
    ? dateInput.value
    : new Date().toISOString().slice(0, 10);

  try {
    const res = await fetch(`${API}/sch-activities?classId=${classId}&date=${date}`);
    TREE_REPORTS = await res.json();
  } catch (err) {
    console.error("❌ Failed to load reports", err);
  }
}

/* =====================================
   BUILD TREE
===================================== */
function buildTree() {
  const tree = document.getElementById("classTree");
  if (!tree) return;

  tree.innerHTML = "";

  TREE_CLASSES.forEach(cls => {
    const classDiv = document.createElement("div");
    classDiv.className = "class-branch";
    classDiv.textContent = cls.name;

    const childBox = document.createElement("div");
    childBox.className = "child-items";
    childBox.style.display = "none";

    classDiv.onclick = async () => {
      childBox.style.display = childBox.style.display === "block" ? "none" : "block";

      if (childBox.style.display === "block") {
        childBox.innerHTML = ""; // clear previous content

        // Load reports for this class
        await loadClassReports(cls._id);

        // Display teachers
        if (cls.teachers && cls.teachers.length > 0) {
          cls.teachers.forEach(tid => {
            const name = TEACHERS_MAP[tid._id || tid] || "Teacher";
            childBox.innerHTML += `<div class="teacher-box">👩‍🏫 ${name}</div>`;
          });
        } else {
          childBox.innerHTML += `<div class="teacher-box">👩‍🏫 No teacher</div>`;
        }

        // Display members
        if (cls.members && cls.members.length > 0) {
          cls.members.forEach(mid => {
            const name = MEMBERS_MAP[mid._id || mid] || "Kid";
            childBox.innerHTML += `<div class="member-box">🧒 ${name}</div>`;
          });
        }

        showTreeReport(cls);
      }
    };

    tree.appendChild(classDiv);
    tree.appendChild(childBox);
  });
}

/* =====================================
   SHOW REPORT
===================================== */
async function loadCombinedClassReport(cls) {
  const area = document.getElementById("reportContent");
  if (!area) return;

  const dateInput = document.getElementById("filterDate");
  const date = dateInput?.value || new Date().toISOString().slice(0, 10);

  area.innerHTML = `<h2>${cls.name} – Combined Report (${date})</h2>`;

  try {
    /* =========================
       1) Load ACTIVITIES
       ========================= */
    const actRes = await fetch(
      `${API}/sch-activities?classId=${cls._id}&date=${date}`
    );
    const activities = actRes.ok ? await actRes.json() : [];

    /* =========================
       2) Load ROUTINES
       ========================= */
    const rtRes = await fetch(
      `${API}/sch-routine/load?classId=${cls._id}&date=${date}`
    );
    const routines = rtRes.ok ? await rtRes.json() : [];

    /* =========================
       3) Normalize by kid
       ========================= */
    const kids = {};

    // --- Activities ---
    activities.forEach(doc => {
      const kidId = String(doc.schoolMember || doc.kidmember);
      const kidName =
        doc.kidName || MEMBERS_MAP[kidId] || "Unknown Kid";

      if (!kids[kidId]) {
        kids[kidId] = {
          id: kidId,
          name: kidName,
          activities: [],
          routines: [],
          totalTime: 0,
          totalStars: 0,
          starCount: 0
        };
      }

      (doc.items || []).forEach(it => {
        kids[kidId].activities.push(it);
        kids[kidId].totalTime += Number(it.timeMin || 0);
        kids[kidId].totalStars += Number(it.evaluation || 0);
        kids[kidId].starCount += 1;
      });
    });

    // --- Routines (ONLY completed) ---
    routines.forEach(r => {
      const kidId = String(r.kidmember);
      if (!kids[kidId]) return;

      (r.items || []).forEach(it => {
        if (it.done === true) {
          kids[kidId].routines.push(it);
        }
      });
    });

    /* =========================
       4) Render
       ========================= */
    if (!Object.keys(kids).length) {
      area.innerHTML += "<p>No data for this date.</p>";
      return;
    }

    let html = "<ul>";

    Object.values(kids).forEach(kid => {
      const avgStars = kid.starCount
        ? (kid.totalStars / kid.starCount).toFixed(1)
        : 0;

      html += `
        <li>
          <h3>🧒 ${kid.name}</h3>
          <p>
            ⏱ Total Time: <b>${kid.totalTime} min</b> |
            ⭐ Avg Stars: <b>${avgStars}</b>
          </p>

          <b>✅ Completed Routines</b>
          <ul>
            ${
              kid.routines.length
                ? kid.routines.map(r =>
                    `<li>${r.task} (${r.section})</li>`
                  ).join("")
                : "<li>None</li>"
            }
          </ul>

          <b>📊 Activities</b>
          <ul>
            ${
              kid.activities.length
                ? kid.activities.map(a => `
                    <li>
                      🎯 ${a.activity}
                      | ⏱ ${a.timeMin} min
                      | ⭐ ${a.evaluation}
                      <br>📝 ${a.note || ""}
                    </li>
                  `).join("")
                : "<li>No activities</li>"
            }
          </ul>
        </li>
      `;
    });

    html += "</ul>";
    area.innerHTML += html;

    // Enable PDF export
    addExportPDFButton();

  } catch (err) {
    console.error("❌ Combined report error:", err);
    area.innerHTML += "<p>Error loading combined report ⚠️</p>";
  }
}

// Logout
// ----------------------
function logout(){ localStorage.removeItem("currentUser"); window.location.href="sch-signin.html"; }

// ---


</script>





</body>
</html>
