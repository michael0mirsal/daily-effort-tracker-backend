<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nursery Tree</title>
<style>
:root {
  --primary: #2c3e50;
  --secondary: #3498db;
  --success: #27ae60;
  --warning: #f39c12;
  --danger: #e74c3c;
  --bg: #f4f6f8;
  --card: #ffffff;
  --text: #2d3436;
}

/* RESET */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: "Segoe UI", Roboto, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* ================= ZOOM WRAPPER ================= */
#zoomWrapper {
  width: 100%;
  height: 100%;
  overflow: auto;
  padding: 20px;
}

/* ================= SCALED CONTAINER ================= */
#container {
  transform: scale(0.75);
  transform-origin: top left;
  width: calc(100% / 0.75);
  min-height: calc(100% / 0.75);
  display: flex;
  height: auto;
  align-items: flex-start;
}

/* ================= LEFT TREE PANEL ================= */
#treePanel {
  width: 320px;
  background: linear-gradient(180deg, #ffffff, #f1f3f6);
  border-right: 1px solid #ddd;
  padding: 20px;
  overflow-y: auto;
  box-shadow: 4px 0 15px rgba(0,0,0,0.05);
}

#nurseryTitle {
  text-align: center;
  font-size: 1.4rem;
  margin-bottom: 20px;
  color: var(--primary);
  font-weight: 700;
}

.class-branch {
  background: #fff;
  border-radius: 14px;
  padding: 12px 15px;
  margin-bottom: 10px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  transition: 0.25s;
}

.class-branch:hover {
  background: #f0f6ff;
  transform: translateX(4px);
}

.child-items {
  margin: 8px 0 15px 15px;
}

.tree-section {
  margin-top: 10px;
  margin-left: 12px;
  border-left: 2px dashed #dcdde1;
  padding-left: 10px;
}

.tree-section-title {
  font-size: 0.85rem;
  font-weight: 700;
  color: #555;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.teacher-box {
  background: #eef3ff;
  border-left: 4px solid var(--secondary);
  border-radius: 8px;
  padding: 6px 10px;
  margin-bottom: 4px;
}

.member-box {
  background: #f9fafb;
  border-left: 4px solid var(--success);
  border-radius: 8px;
  padding: 6px 10px;
  margin-bottom: 4px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* ================= RIGHT REPORT PANEL ================= */
#rightPanel {
  flex: 1;
  padding: 25px;
  overflow-y: auto;
}

/* TOP BAR */
#topButtons {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-bottom: 20px;
}

button {
  padding: 10px 18px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-weight: 600;
}

#backBtn { background: #ecf0f1; }
#logoutBtn { background: var(--danger); color: white; }

/* ================= REPORT ================= */
#classReport h2 { margin-top: 0; }

.report-header {
  background: linear-gradient(135deg, var(--primary), #1f2d3a);
  color: white;
  padding: 25px;
  border-radius: 16px;
  margin-bottom: 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.report-header h2 { margin: 0; font-size: 1.8rem; }

.child-card {
  background: var(--card);
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 30px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

.child-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid #eee;
  padding-bottom: 10px;
  margin-bottom: 15px;
}

.child-title h3 { margin: 0; }

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px,1fr));
  gap: 15px;
  margin: 20px 0;
}

.kpi {
  background: #f9fafb;
  border-radius: 14px;
  padding: 15px;
  text-align: center;
}

.kpi h4 {
  margin: 0;
  font-size: 0.9rem;
  color: #777;
}

.kpi strong {
  display: block;
  margin-top: 8px;
  font-size: 1.4rem;
}

.section-title {
  margin-top: 25px;
  margin-bottom: 10px;
  font-size: 1.1rem;
  color: var(--primary);
  border-left: 4px solid var(--secondary);
  padding-left: 10px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 12px;
  border: 1px solid #dcdde1;
  border-radius: 10px;
  overflow: hidden;
}

th {
  background: #f1f3f6;
  font-weight: 700;
  color: #2c3e50;
  border-bottom: 2px solid #dcdde1;
}

th, td {
  padding: 12px;
  border-right: 1px solid #e0e0e0;
}

tr td:last-child, tr th:last-child { border-right: none; }
tr:nth-child(even) td { background: #fafbfc; }
tr:hover td { background: #eef4ff; }

.badge {
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 0.8rem;
  color: white;
}

.badge-success { background: var(--success); }
.badge-primary { background: var(--secondary); }

.empty { color: #888; font-style: italic; }

/* ================= MESSAGE MODAL ================= */
#msgModal {
  display: none;
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
  z-index:1000;
}

#msgModalContent {
  background:white;
  padding:25px;
  border-radius:12px;
  width:400px;
  max-width:90%;
  display:flex;
  flex-direction:column;
  gap:10px;
}

#msgModalContent input,#msgModalContent textarea,#msgModalContent select{
  width:100%;
  padding:8px;
  border-radius:6px;
  border:1px solid #ccc;
}

#msgModalContent button{
  padding:8px 12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
</style>
</head>
<body>

<div id="zoomWrapper">
  <div id="container">
    <!-- LEFT TREE -->
    <div id="treePanel">
      <h2 id="nurseryTitle">Loading...</h2>
      <p id="userName" style="text-align:center; margin-bottom: 15px; font-weight:600; color:var(--secondary);">Hello, User</p>
      <div id="classTree"></div>
    </div>

    <!-- RIGHT PANEL -->
    <div id="rightPanel">
      <div id="topButtons">
        <button id="backBtn">⬅ Back</button>
        <button id="logoutBtn">Logout</button>
      </div>
      <div id="classReport">
        <h2>Select a class to view full report</h2>
        <div id="reportContent"></div>
      </div>
    </div>
  </div>
</div>

<!-- MESSAGE MODAL -->
<div id="msgModal">
  <div id="msgModalContent">
    <h3>Send Message</h3>
    <input type="text" id="msgTitle" placeholder="Title"/>
    <textarea id="msgBody" placeholder="Message"></textarea>

    <!-- Target type -->
    <select id="msgTarget">
      <option value="class">All Class Members</option>
      <option value="individual">Select Member</option>
      <option value="family">Select Family</option>
    </select>

    <!-- Member & Family selection -->
    <select id="memberSelect" multiple style="display:none;"></select>
    <select id="familySelect" multiple style="display:none;"></select>

    <!-- Priority -->
    <select id="prioritySelect">
      <option value="normal">Normal</option>
      <option value="high">High</option>
      <option value="urgent">Urgent</option>
    </select>

    <div style="display:flex; justify-content:flex-end; gap:10px;">
      <button id="sendMsgBtn" style="background:var(--secondary); color:white;">Send</button>
      <button id="closeMsgBtn" style="background:#ccc;">Cancel</button>
    </div>
  </div>
</div>


<script>
const API = "http://localhost:3000/api";

/* ===================================== GLOBAL STATE ==================================== */
let TREE_CLASSES = [];
let MEMBERS_MAP = {};   // kidId -> name
let TEACHERS_MAP = {};  // teacherId -> name
let msgModal = null;

/* ===================================== DATE HELPER ==================================== */
function getSelectedDate() {
  const el = document.getElementById("filterDate");
  return el && el.value ? el.value : new Date().toISOString().slice(0, 10);
}

/* ===================================== LOAD CLASSES + MEMBERS + TEACHERS ==================================== */
async function loadTreeClasses() {
  const user = JSON.parse(localStorage.getItem("user"));
  if (!user) return;

  try {
    const res = await fetch(`${API}/nurseries/${user.nurseryId}/classes`);
    const data = await res.json();
    TREE_CLASSES = data.classes || [];

    const memberIds = new Set();
    const teacherIds = new Set();

    TREE_CLASSES.forEach(cls => {
      (cls.members || []).forEach(id => memberIds.add(String((id._id || id.id || id))));
      (cls.teachers || []).forEach(id => teacherIds.add(String((id._id || id.id || id))));
    });

    if (memberIds.size) {
      const r = await fetch(`${API}/sch-members?ids=${[...memberIds].join(",")}`);
      if (!r.ok) throw new Error(`Failed to fetch members: ${r.status}`);
      const list = await r.json();
      list.forEach(m => MEMBERS_MAP[m._id || m.id] = m.name);
    }

    if (teacherIds.size) {
      const r = await fetch(`${API}/teachers?ids=${[...teacherIds].join(",")}`);
      if (!r.ok) throw new Error(`Failed to fetch teachers: ${r.status}`);
      const list = await r.json();
      list.forEach(t => TEACHERS_MAP[t._id || t.id] = t.name);
    }

    buildTree();
  } catch (err) {
    console.error("❌ Tree load failed", err);
  }
}

/* ===================================== BUILD TREE ==================================== */
function buildTree() {
  const tree = document.getElementById("classTree");
  if (!tree) return;
  tree.innerHTML = "";

  TREE_CLASSES.forEach(cls => {
    const classDiv = document.createElement("div");
    classDiv.className = "class-branch";
    classDiv.textContent = cls.name;

    const childBox = document.createElement("div");
    childBox.className = "child-items";
    childBox.style.display = "none";

    classDiv.onclick = async () => {
      const open = childBox.style.display === "block";
      childBox.style.display = open ? "none" : "block";
      if (open) return;

      childBox.innerHTML = `
        <div class="tree-section">
          <div class="tree-section-title">👩‍🏫 Teachers</div>
          ${(cls.teachers || []).map(tid => `<div class="teacher-box">${TEACHERS_MAP[tid._id || tid.id || tid] || "Teacher"}</div>`).join("")}
        </div>
        <div class="tree-section">
          <div class="tree-section-title">🧒 Kids</div>
          ${(cls.members || []).map(mid => `<div class="member-box">${MEMBERS_MAP[mid._id || mid.id || mid] || "Kid"}</div>`).join("")}
        </div>
      `;

      loadCombinedClassReport(cls);
    };

    tree.appendChild(classDiv);
    tree.appendChild(childBox);
  });
}

/* ===================================== COMBINED REPORT ==================================== */
async function loadCombinedClassReport(cls) {
  const area = document.getElementById("reportContent");
  if (!area) {
    console.error("❌ reportContent not found");
    return;
  }

  const date = getSelectedDate();
  area.innerHTML = `<h2>${cls.name} – Loading Report (${date})...</h2>`;

  try {
    const [rRes, aRes] = await Promise.all([
      fetch(`${API}/sch-routine/load?classId=${cls._id}&date=${date}`),
      fetch(`${API}/sch-activities?classId=${cls._id}&date=${date}`)
    ]);

    const routines = rRes.ok ? await rRes.json() : [];
    const activities = aRes.ok ? await aRes.json() : [];

    const kids = {};
    const kidsByName = {};

    (cls.members || []).forEach(m => {
      const id = String(m._id || m);
      const name = MEMBERS_MAP[id] || m.name || "Unknown";
      kids[id] = { id, name, totalTime: 0, routineStars: 0, activityStars: 0, routines: [], activities: [] };
      kidsByName[name.toLowerCase()] = kids[id];
    });

    activities.forEach(doc => {
      const kidId = String(doc.schoolMember || doc.schoolMemberId || doc.kidmember);
      const kid = kids[kidId];
      if (!kid) return;
      (doc.items || []).forEach(it => {
        kid.totalTime += Number(it.timeMin || 0);
        kid.activityStars += Number(it.evaluation || 0);
        kid.activities.push(it);
      });
    });

    routines.forEach(r => {
      const kidId = String(r.kidmember || r.kidId);
      const nameKey = (r.kidName || "").toLowerCase();
      const kid = kids[kidId] || kidsByName[nameKey];
      if (!kid) return;
      (r.items || []).forEach(it => {
        if (it.done === true) {
          kid.routineStars += 1;
          kid.routines.push({ task: it.task, section: it.section });
        }
      });
    });

    let html = `
      <div class="report-header">
        <h2>${cls.name} – Daily Performance Report</h2>
        <button id="headerMsgBtn">✉ Send Message</button>
      </div>
    `;

    if (!Object.keys(kids).length) {
      html += `<p class="empty">No members in this class</p>`;
    }

    Object.values(kids).forEach(k => {
      const totalStars = k.routineStars + k.activityStars;
      const grouped = {};
      k.routines.forEach(r => {
        if (!grouped[r.section]) grouped[r.section] = [];
        grouped[r.section].push(r.task);
      });

      html += `
        <div class="child-card">
          <div class="child-title">
            <h3>🧒 ${k.name}</h3>
            <span class="badge badge-primary">${totalStars} ⭐ Total</span>
          </div>
          <div class="kpi-grid">
            <div class="kpi"><h4>Total Time</h4><strong>${k.totalTime} min</strong></div>
            <div class="kpi"><h4>Routine Stars</h4><strong>${k.routineStars} ⭐</strong></div>
            <div class="kpi"><h4>Activity Stars</h4><strong>${k.activityStars} ⭐</strong></div>
          </div>
          <div class="section-title">✅ Completed Routines</div>
          ${
            k.routines.length
              ? Object.entries(grouped).map(([section, tasks]) =>
                  `<strong>${section.toUpperCase()}</strong>
                   <ul>${tasks.map(t => `<li>${t}</li>`).join("")}</ul>`
                ).join("")
              : `<p class="empty">No completed routines</p>`
          }
          <div class="section-title">📊 Activities</div>
          ${
            k.activities.length
              ? `<table>
                  <tr><th>Activity</th><th>Time</th><th>Stars</th><th>Note</th></tr>
                  ${k.activities.map(a =>
                    `<tr>
                      <td>${a.activity}</td>
                      <td>${a.timeMin} min</td>
                      <td><span class="badge badge-success">${a.evaluation} ⭐</span></td>
                      <td>${a.note || "-"}</td>
                    </tr>`).join("")}
                </table>`
              : `<p class="empty">No activities recorded</p>`
          }
        </div>
      `;
    });

    area.innerHTML = html;
    attachMessageButton(cls);

  } catch (err) {
    console.error("❌ Failed loading combined report:", err);
    area.innerHTML = `<p style="color:red;">Error loading report ⚠️</p>`;
  }
}

/* ===================================== ATTACH MESSAGE BUTTON ==================================== */
function attachMessageButton(cls) {
  const msgBtn = document.getElementById("headerMsgBtn");
  if (!msgBtn) return;

  msgBtn.onclick = async () => {
    if (!msgModal) return;

    msgModal.dataset.classId = cls._id;
    msgModal.style.display = "flex";
    msgModal.style.visibility = "visible";
    msgModal.style.opacity = "1";
    msgModal.style.pointerEvents = "auto";
    msgModal.style.zIndex = "9999";

    try {
      await loadClassMembers(cls);
    } catch (err) {
      const memberSelect = document.getElementById("memberSelect");
      if (memberSelect) memberSelect.innerHTML = "<option disabled>Error loading members</option>";
    }
  };
}

/* ===================================== MESSAGE MODAL LOGIC ==================================== */
async function sendMessage(payload) {
  try {
    const res = await fetch(`${API}/msg/send`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error(`Server responded with status ${res.status}`);
    return await res.json();
  } catch (err) {
    console.error("Send Message Error:", err);
    throw err;
  }
}


async function loadClassMembers(cls) {
  const memberSelect = document.getElementById("memberSelect");
  if (!memberSelect) return [];

  memberSelect.disabled = true;
  memberSelect.innerHTML = `<option>Loading members...</option>`;

  let membersList = (cls.members || []).map(m => {
    const id = String(m._id || m.id || m);
    return { _id: id, name: MEMBERS_MAP[id] || m.name || "Unknown" };
  });

  // Fetch missing names if needed
  const missingIds = membersList.filter(m => !m.name || m.name === "Unknown").map(m => m._id);
  if (missingIds.length) {
    try {
      const res = await fetch(`${API}/sch-members?ids=${missingIds.join(",")}`);
      if (!res.ok) throw new Error(`Failed to fetch members: ${res.status}`);
      const data = await res.json();
      data.forEach(m => {
        const idx = membersList.findIndex(mem => mem._id === (m._id || m.id));
        if (idx > -1) membersList[idx].name = m.name || "Unknown";
      });
    } catch (err) {
      memberSelect.innerHTML = "<option disabled>Error loading members</option>";
      return [];
    }
  }

  if (!membersList.length) {
    memberSelect.innerHTML = `<option disabled>No members in this class</option>`;
    memberSelect.disabled = false;
    memberSelect.style.display = "none"; // hide by default
    return [];
  }

  // multi-select enabled
  memberSelect.innerHTML = membersList.map(m => `<option value="${m._id}">${m.name}</option>`).join("");
  memberSelect.disabled = false;

  // **Show only if "individual" is selected**
  const target = document.getElementById("msgTarget").value;
  memberSelect.style.display = target === "individual" ? "block" : "none";
  
  return membersList;
}

function initMessageModal() {
  msgModal = document.getElementById("msgModal");
  const memberSelect = document.getElementById("memberSelect");
  const familySelect = document.getElementById("familySelect");

  // Close button
  document.getElementById("closeMsgBtn").onclick = () => {
    msgModal.style.display = "none";
    msgModal.style.opacity = "0";
    msgModal.style.pointerEvents = "none";
    delete msgModal.dataset.classId;
    delete msgModal.dataset.nurseryId;
  };

  // Target selector change
  document.getElementById("msgTarget").onchange = function() {
    memberSelect.style.display = this.value === "individual" ? "block" : "none";
    familySelect.style.display = this.value === "family" ? "block" : "none";
  };

  // Send message
  document.getElementById("sendMsgBtn").onclick = async () => {
  const title = document.getElementById("msgTitle").value.trim();
  const message = document.getElementById("msgBody").value.trim();
  const target = document.getElementById("msgTarget").value;
  const priority = document.getElementById("prioritySelect").value || "normal";

  if (!title || !message) return alert("Please fill title and message");

  const user = JSON.parse(localStorage.getItem("user"));
  if (!user || !user._id || !user.role) return alert("User not logged in properly");

  // Prepare payload
  const payload = {
    senderId: user._id,
    senderModel: user.role, // must match backend enum: "Supervisor", "Teacher", "Manager"
    title,
    message,
    priority,
    classId: msgModal.dataset.classId || undefined,
    nurseryId: msgModal.dataset.nurseryId || undefined
  };

  // Add target
  if (target === "individual") {
    const memberId = document.getElementById("memberSelect").value;
    if (memberId) payload.targetSchoolMember = memberId;
  } else if (target === "family") {
    const familyIds = Array.from(document.getElementById("familySelect").selectedOptions)
                           .map(o => o.value)
                           .filter(v => v);
    if (familyIds.length) payload.targetFamily = familyIds;
  }

  // Validation: at least one target required
  if (!payload.targetSchoolMember &&
      (!payload.targetFamily || payload.targetFamily.length === 0) &&
      !payload.classId &&
      !payload.nurseryId) {
    return alert("Please select at least one target!");
  }

  try {
    const res = await fetch(`${API}/msg/send`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    if (!res.ok) throw new Error(data.error || `Error ${res.status}`);

    alert(`Message sent successfully! Receivers: ${data.receiversCount}`);
    // Reset modal
    msgModal.style.display = "none";
    document.getElementById("msgTitle").value = "";
    document.getElementById("msgBody").value = "";
    document.getElementById("msgTarget").value = "class";
    document.getElementById("memberSelect").style.display = "none";
    document.getElementById("familySelect").style.display = "none";
    document.getElementById("prioritySelect").value = "normal";

  } catch (err) {
    console.error("Send Message Error:", err);
    alert("Failed to send message: " + err.message);
  }
  };
}



/* ===================================== INIT ==================================== */
window.addEventListener("DOMContentLoaded", () => {
  const user = JSON.parse(localStorage.getItem("user"));
  document.getElementById("nurseryTitle").textContent = user?.nurseryName || "Happy Kids Nursery";
  document.getElementById("userName").textContent = user?.name ? `Hello, ${user.name}!` : "Hello, User";

  const backBtn = document.getElementById("backBtn");
  if (backBtn) backBtn.onclick = () => window.location.href = "sch-choose.html";

  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) logoutBtn.onclick = () => {
    localStorage.removeItem("user");
    window.location.href = "sch-signin.html";
  };

  initMessageModal();
  loadTreeClasses();
});
</script>


</body>
</html>
