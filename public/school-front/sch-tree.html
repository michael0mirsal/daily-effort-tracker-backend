<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nursery Tree</title>
<style>
:root {
  --primary: #2c3e50;
  --secondary: #3498db;
  --success: #27ae60;
  --warning: #f39c12;
  --danger: #e74c3c;
  --bg: #f4f6f8;
  --card: #ffffff;
  --text: #2d3436;
}

/* RESET */
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; font-family: "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

/* ================= ZOOM WRAPPER ================= */
#zoomWrapper { width: 100%; height: 100%; overflow: auto; padding: 20px; }

/* ================= SCALED CONTAINER ================= */
#container { transform: scale(0.75); transform-origin: top left; width: calc(100% / 0.75); min-height: calc(100% / 0.75); display: flex; align-items: flex-start; }

/* ================= LEFT TREE PANEL ================= */
#treePanel { width: 320px; background: linear-gradient(180deg, #ffffff, #f1f3f6); border-right: 1px solid #ddd; padding: 20px; overflow-y: auto; box-shadow: 4px 0 15px rgba(0,0,0,0.05); }

#nurseryTitle { text-align: center; font-size: 1.4rem; margin-bottom: 20px; color: var(--primary); font-weight: 700; }
.class-branch { background: #fff; border-radius: 14px; padding: 12px 15px; margin-bottom: 10px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.08); transition: 0.25s; }
.class-branch:hover { background: #f0f6ff; transform: translateX(4px); }
.child-items { margin: 8px 0 15px 15px; }
.tree-section { margin-top: 10px; margin-left: 12px; border-left: 2px dashed #dcdde1; padding-left: 10px; }
.tree-section-title { font-size: 0.85rem; font-weight: 700; color: #555; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.teacher-box { background: #eef3ff; border-left: 4px solid var(--secondary); border-radius: 8px; padding: 6px 10px; margin-bottom: 4px; cursor:pointer; }
.member-box { background: #f9fafb; border-left: 4px solid var(--success); border-radius: 8px; padding: 6px 10px; margin-bottom: 4px; cursor:pointer; }

/* ================= RIGHT REPORT PANEL ================= */
#rightPanel { flex: 1; padding: 25px; overflow-y: auto; }
#topButtons { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 20px; }
button { padding: 10px 18px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; }
#backBtn { background: #ecf0f1; }
#logoutBtn { background: var(--danger); color: white; }
#sendMsgBtn { background: var(--secondary); color: white; }

/* ================= REPORT ================= */
#classReport h2 { margin-top: 0; }
.report-header { background: linear-gradient(135deg, var(--primary), #1f2d3a); color: white; padding: 25px; border-radius: 16px; margin-bottom: 25px; }
.report-header h2 { margin: 0; font-size: 1.8rem; }
.child-card { background: var(--card); border-radius: 18px; padding: 22px; margin-bottom: 30px; box-shadow: 0 8px 25px rgba(0,0,0,0.08); }
.child-title { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
.child-title h3 { margin: 0; }
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; margin: 20px 0; }
.kpi { background: #f9fafb; border-radius: 14px; padding: 15px; text-align: center; }
.kpi h4 { margin: 0; font-size: 0.9rem; color: #777; }
.kpi strong { display: block; margin-top: 8px; font-size: 1.4rem; }
.section-title { margin-top: 25px; margin-bottom: 10px; font-size: 1.1rem; color: var(--primary); border-left: 4px solid var(--secondary); padding-left: 10px; }
table { width: 100%; border-collapse: collapse; margin-top: 12px; border: 1px solid #dcdde1; border-radius: 10px; overflow: hidden; }
th { background: #f1f3f6; font-weight: 700; color: #2c3e50; border-bottom: 2px solid #dcdde1; }
th, td { padding: 12px; border-right: 1px solid #e0e0e0; }
tr td:last-child, tr th:last-child { border-right: none; }
tr:nth-child(even) td { background: #fafbfc; }
tr:hover td { background: #eef4ff; }
.badge { padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; color: white; }
.badge-success { background: var(--success); }
.badge-primary { background: var(--secondary); }
.empty { color: #888; font-style: italic; }

/* ================= MESSAGE MODAL ================= */
#msgModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); z-index:1000; justify-content:center; align-items:center; }
#msgModal .modal-content { background:#fff; border-radius:12px; padding:20px; max-width:500px; width:90%; position:relative; }
#msgModal input, #msgModal textarea, #msgModal select { width:100%; margin-bottom:10px; padding:6px; border-radius:6px; border:1px solid #ccc; font-size:1rem; }
#msgModal .modal-buttons { text-align:right; }
#msgModal .modal-buttons button { margin-left:10px; padding:8px 14px; border-radius:6px; font-weight:600; }

</style>
</head>
<body>

<div id="zoomWrapper">
  <div id="container">
    <!-- LEFT TREE -->
    <div id="treePanel">
      <h2 id="nurseryTitle">Loading...</h2>
      <p id="userName" style="text-align:center; margin-bottom: 15px; font-weight:600; color:var(--secondary);">Hello, User</p>
      <div id="classTree"></div>
    </div>

    <!-- RIGHT PANEL -->
    <div id="rightPanel">
      <div id="topButtons">
        <button id="backBtn">⬅ Back</button>
        <button id="sendMsgBtn">✉️ Send Message</button>
        <button id="logoutBtn">Logout</button>
      </div>
      <div id="classReport">
        <h2>Select a class to view full report</h2>
        <div id="reportContent"></div>
      </div>
    </div>
  </div>
</div>

<!-- MESSAGE MODAL -->
<div id="msgModal">
  <div class="modal-content">
    <h3>Send New Message</h3>
    <label>Title</label>
    <input type="text" id="msgTitle" placeholder="Message title">
    <label>Message</label>
    <textarea id="msgBody" rows="4" placeholder="Type your message"></textarea>
    <label>Type</label>
    <select id="msgTargetType">
      <option value="nursery">Entire Nursery</option>
      <option value="class">Specific Class</option>
      <option value="student">Specific Student</option>
    </select>
    <input type="text" id="msgClassId" placeholder="Class ID" style="display:none;">
    <input type="text" id="msgStudentId" placeholder="Student ID" style="display:none;">
    <input type="file" id="msgAttachments" multiple>
    <div class="modal-buttons">
      <button id="msgCancelBtn" style="background:#eee;">Cancel</button>
      <button id="msgSendBtn" style="background:var(--secondary); color:white;">Send</button>
    </div>
  </div>
</div>

<script>
const API = "http://localhost:3000/api";

/* =====================================
   GLOBAL STATE
===================================== */
let TREE_CLASSES = [];
let MEMBERS_MAP = {};
let TEACHERS_MAP = {};

/* =====================================
   DATE HELPER
===================================== */
function getSelectedDate() {
  const el = document.getElementById("filterDate");
  return el && el.value ? el.value : new Date().toISOString().slice(0, 10);
}

/* =====================================
   LOAD CLASSES + MEMBERS + TEACHERS
===================================== */
async function loadTreeClasses() {
  const user = JSON.parse(localStorage.getItem("user"));
  if (!user) return;
  try {
    const res = await fetch(`${API}/nurseries/${user.nurseryId}/classes`);
    const data = await res.json();
    TREE_CLASSES = data.classes || [];

    const memberIds = new Set();
    const teacherIds = new Set();

    TREE_CLASSES.forEach(cls => {
      (cls.members || []).forEach(id => memberIds.add(String(id._id || id)));
      (cls.teachers || []).forEach(id => teacherIds.add(String(id._id || id)));
    });

    if (memberIds.size) {
      const r = await fetch(`${API}/sch-members?ids=${[...memberIds].join(",")}`);
      const list = await r.json();
      list.forEach(m => MEMBERS_MAP[m._id] = m.name);
    }

    if (teacherIds.size) {
      const r = await fetch(`${API}/teachers?ids=${[...teacherIds].join(",")}`);
      const list = await r.json();
      list.forEach(t => TEACHERS_MAP[t._id] = t.name);
    }

    buildTree();
  } catch (err) { console.error("Tree load failed", err); }
}

/* =====================================
   BUILD TREE
===================================== */
function buildTree() {
  const tree = document.getElementById("classTree");
  if (!tree) return;
  tree.innerHTML = "";

  TREE_CLASSES.forEach(cls => {
    const classDiv = document.createElement("div");
    classDiv.className = "class-branch";
    classDiv.textContent = cls.name;

    const childBox = document.createElement("div");
    childBox.className = "child-items";
    childBox.style.display = "none";

    classDiv.onclick = async () => {
      const open = childBox.style.display === "block";
      childBox.style.display = open ? "none" : "block";
      if (open) return;

      childBox.innerHTML = `
  <div class="tree-section">
    <div class="tree-section-title">👩‍🏫 Teachers</div>
    ${(cls.teachers || []).map(tid => `<div class="teacher-box">${TEACHERS_MAP[tid._id || tid]||"Teacher"}</div>`).join("")}
  </div>
  <div class="tree-section">
    <div class="tree-section-title">🧒 Kids</div>
    ${(cls.members || []).map(mid => `<div class="member-box" data-member="${mid._id||mid}">${MEMBERS_MAP[mid._id||mid]||"Kid"}</div>`).join("")}
  </div>
      `;
      loadCombinedClassReport(cls);
    };

    tree.appendChild(classDiv);
    tree.appendChild(childBox);
  });

  // Dynamic click to open message modal
  document.addEventListener("click", e => {
    if(e.target.classList.contains("member-box")) openMessageModal("student", e.target.dataset.member);
    if(e.target.classList.contains("class-branch")) {
      const cls = TREE_CLASSES.find(c=>c.name===e.target.textContent);
      if(cls) openMessageModal("class", cls._id);
    }
  });
}

/* =====================================
   MESSAGE MODAL LOGIC
===================================== */
const sendMsgBtn = document.getElementById("sendMsgBtn");
const msgModal = document.getElementById("msgModal");
const msgCancelBtn = document.getElementById("msgCancelBtn");
const msgTargetType = document.getElementById("msgTargetType");
const msgClassId = document.getElementById("msgClassId");
const msgStudentId = document.getElementById("msgStudentId");

function openMessageModal(type, id=null) {
  msgModal.style.display="flex";
  msgTargetType.value=type;
  msgClassId.value = type==="class"?id:"";
  msgStudentId.value = type==="student"?id:"";
  msgClassId.style.display = type==="class"?"block":"none";
  msgStudentId.style.display = type==="student"?"block":"none";
}

sendMsgBtn.onclick = ()=>openMessageModal("nursery");
msgCancelBtn.onclick = ()=>{ msgModal.style.display="none"; }
msgTargetType.addEventListener("change", ()=>{
  msgClassId.style.display = msgTargetType.value==="class"?"block":"none";
  msgStudentId.style.display = msgTargetType.value==="student"?"block":"none";
});

document.getElementById("msgSendBtn").onclick = async ()=>{
  const sender = JSON.parse(localStorage.getItem("user"));
  const data = {
    senderId: sender._id,
    senderModel: "StaffMember",
    title: document.getElementById("msgTitle").value,
    message: document.getElementById("msgBody").value,
    attachments: Array.from(document.getElementById("msgAttachments").files).map(f=>({name:f.name,url:URL.createObjectURL(f)}))
  };
  if(msgTargetType.value==="student") data.targetSchoolMember=msgStudentId.value;
  if(msgTargetType.value==="class") data.classId=msgClassId.value;
  if(msgTargetType.value==="nursery") data.nurseryId = sender.nurseryId;

  try{
    const res = await fetch(`${API}/messages/send`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
    if(res.ok){ alert("Message sent!"); msgModal.style.display="none"; }
    else alert("Failed to send message");
  } catch(err){ console.error(err); alert("Error sending message"); }
};

/* =====================================
   INIT
===================================== */
window.addEventListener("DOMContentLoaded", () => {
  const user = JSON.parse(localStorage.getItem("user"));
  document.getElementById("nurseryTitle").textContent = user?.nurseryName||"Happy Kids Nursery";
  document.getElementById("userName").textContent = user?.name?`Hello, ${user.name}!`:"Hello, User";
  loadTreeClasses();
});

/* BACK + LOGOUT */
document.getElementById("backBtn").onclick = ()=>window.location.href="sch-choose.html";
document.getElementById("logoutBtn").onclick = ()=>{
  localStorage.removeItem("user");
  window.location.href="sch-signin.html";
};
</script>

</body>
</html>
