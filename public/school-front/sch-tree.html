<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nursery Tree</title>
<style>
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #fceabb, #f8b500);
    overflow: hidden;
}

#container {
    display: flex;
    height: 100%;
}

/* LEFT TREE PANEL */
#treePanel {
    width: 35%;
    height: 100%;
    background: rgba(255,255,255,0.3);
    padding: 20px;
    box-sizing: border-box;
    border-right: 4px dashed rgba(255,255,255,0.7);
    overflow-y: auto;
    border-radius: 0 30px 30px 0;
    box-shadow: inset -5px 0 10px rgba(0,0,0,0.1);
}

#nurseryTitle {
    text-align: center;
    color: #5c4033;
    font-size: 2rem;
    margin-bottom: 20px;
    text-shadow: 1px 1px #fff;
}

/* CLASS BRANCHES */
.class-branch {
    background: #fff3cd;
    padding: 12px 25px;
    border-radius: 20px;
    margin: 12px auto;
    cursor: pointer;
    font-size: 1.2rem;
    width: fit-content;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: 0.3s;
    color: #5c4033;
    font-weight: bold;
}

.class-branch:hover {
    transform: scale(1.05);
    background: #ffecb3;
}

/* CHILD ITEMS UNDER CLASS */
.child-items {
    margin-left: 30px;
    margin-top: 10px;
    display: none; /* hidden by default */
}

.child-items .teacher-box {
    background: #ffe8a1;
    padding: 8px 12px;
    border-radius: 12px;
    margin-bottom: 5px;
}
.child-items .kid-box {
    background: #fff;
    padding: 6px 10px;
    border-radius: 12px;
    margin-bottom: 3px;
}

/* RIGHT PANEL */
#rightPanel {
    width: 65%;
    height: 100%;
    position: relative;
    padding: 20px;
    box-sizing: border-box;
    overflow-y: auto;
    text-align: center;
}

/* TOP RIGHT BUTTONS */
#topButtons {
    position: absolute;
    top: 15px;
    right: 15px;
    display: flex;
    gap: 10px;
}
button {
    padding: 10px 20px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    font-weight: bold;
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
}
#logoutBtn { background: #e57373; color: white; }
#backBtn { background: #81c784; color: white; }

/* REPORT AREA */
#classReport {
    margin-top: 70px;
}
#reportContent {
    margin-top: 20px;
    padding: 25px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    font-size: 1.2rem;
    text-align: left;
}
</style>
</head>
<body>

<div id="container">
    <!-- LEFT TREE -->
    <div id="treePanel">
        <h2 id="nurseryTitle">Happy Kids Nursery</h2>
        <div id="classTree"></div>
    </div>

    <!-- RIGHT PANEL -->
    <div id="rightPanel">
        <div id="topButtons">
            <button id="backBtn">⬅ Back</button>
            <button id="logoutBtn">Logout</button>
        </div>

        <div id="classReport">
            <h2>Select a class to view full report</h2>
            <div id="reportContent"></div>
        </div>
    </div>
</div>

<script>
const API = "http://localhost:3000/api";

/* =====================================
   GLOBAL STATE
===================================== */
let TREE_CLASSES = [];
let MEMBERS_MAP = {};   // kidId -> name
let TEACHERS_MAP = {};  // teacherId -> name

/* =====================================
   DATE HELPER (ALWAYS TODAY)
===================================== */
function getSelectedDate() {
  const el = document.getElementById("filterDate");
  return el && el.value
    ? el.value
    : new Date().toISOString().slice(0, 10);
}

/* =====================================
   LOAD CLASSES + MEMBERS + TEACHERS
===================================== */
async function loadTreeClasses() {
  const user = JSON.parse(localStorage.getItem("user"));
  if (!user) return;

  try {
    const res = await fetch(`${API}/nurseries/${user.nurseryId}/classes`);
    const data = await res.json();
    TREE_CLASSES = data.classes || [];

    const memberIds = new Set();
    const teacherIds = new Set();

    TREE_CLASSES.forEach(cls => {
      (cls.members || []).forEach(id => memberIds.add(String(id._id || id)));
      (cls.teachers || []).forEach(id => teacherIds.add(String(id._id || id)));
    });

    if (memberIds.size) {
      const r = await fetch(`${API}/sch-members?ids=${[...memberIds].join(",")}`);
      const list = await r.json();
      list.forEach(m => MEMBERS_MAP[m._id] = m.name);
    }

    if (teacherIds.size) {
      const r = await fetch(`${API}/teachers?ids=${[...teacherIds].join(",")}`);
      const list = await r.json();
      list.forEach(t => TEACHERS_MAP[t._id] = t.name);
    }

    buildTree();
  } catch (err) {
    console.error("❌ Tree load failed", err);
  }
}

/* =====================================
   BUILD TREE (NO DUPLICATES)
===================================== */
function buildTree() {
  const tree = document.getElementById("classTree");
  if (!tree) return;
  tree.innerHTML = "";

  TREE_CLASSES.forEach(cls => {
    const classDiv = document.createElement("div");
    classDiv.className = "class-branch";
    classDiv.textContent = cls.name;

    const childBox = document.createElement("div");
    childBox.className = "child-items";
    childBox.style.display = "none";

    classDiv.onclick = async () => {
      const open = childBox.style.display === "block";
      childBox.style.display = open ? "none" : "block";

      if (open) return;

      childBox.innerHTML = "";

      /* Teachers */
      (cls.teachers || []).forEach(tid => {
        const name = TEACHERS_MAP[tid._id || tid] || "Teacher";
        childBox.innerHTML += `<div class="teacher-box">👩‍🏫 ${name}</div>`;
      });

      /* Members */
      (cls.members || []).forEach(mid => {
        const name = MEMBERS_MAP[mid._id || mid] || "Kid";
        childBox.innerHTML += `<div class="member-box">🧒 ${name}</div>`;
      });

      loadCombinedClassReport(cls);
    };

    tree.appendChild(classDiv);
    tree.appendChild(childBox);
  });
}

/* =====================================
   COMBINED REPORT (FINAL FIX)
===================================== */

async function loadCombinedClassReport(cls) {
  const area = document.getElementById("reportContent");
  if (!area) return;

  const date = getSelectedDate();
  area.innerHTML = `<h2>${cls.name} – Combined Report (${date})</h2>`;

  try {
    // Fetch routines and activities for the class & date
    const [rRes, aRes] = await Promise.all([
      fetch(`${API}/sch-routine/load?classId=${cls._id}&date=${date}`),
      fetch(`${API}/sch-activities?classId=${cls._id}&date=${date}`)
    ]);

    const routines = rRes.ok ? await rRes.json() : [];
    const activities = aRes.ok ? await aRes.json() : [];

    // Initialize member map
    const kids = {};
    cls.members.forEach(mid => {
      const id = String(mid._id || mid);
      kids[id] = {
        id,
        name: MEMBERS_MAP[id] || "Unknown",
        time: 0,
        stars: [],
        activities: [],
        routines: []
      };
    });

    // Merge activities per member
    activities.forEach(doc => {
      const kidId = String(doc.schoolMember || doc.schoolMemberId || doc.kidmember);
      if (!kids[kidId]) return; // skip outsiders

      (doc.items || []).forEach(it => {
        kids[kidId].time += Number(it.timeMin || 0);
        if (it.evaluation) kids[kidId].stars.push(Number(it.evaluation));
        kids[kidId].activities.push(it);
      });
    });

    // Merge routines per member (done and not done)
    routines.forEach(r => {
      const kidId = String(r.kidmember);
      if (!kids[kidId]) return;

      (r.items || []).forEach(it => {
        kids[kidId].routines.push(it);
      });
    });

    // Render all members
    Object.values(kids).forEach(k => {
      const totalStars = k.stars.length > 0
        ? k.stars.reduce((a, b) => a + b, 0)
        : 0;

      const routinesHtml = k.routines.length
        ? `<ul>${k.routines.map(r => {
            const doneMark = r.done ? "✅" : "❌";
            return `<li>${doneMark} ${r.task}</li>`;
          }).join("")}</ul>`
        : "<p>None</p>";

      const activitiesHtml = k.activities.length
        ? `<ul>${k.activities.map(a => `
            <li>
              🎯 ${a.activity} | ⏱ ${a.timeMin || 0} min | ⭐ ${a.evaluation || 0}
              <br>📝 ${a.note || ""}
            </li>`).join("")}</ul>`
        : "<p>None</p>";

      area.innerHTML += `
        <hr>
        <div class="kid-report">
          <h3>🧒 ${k.name}</h3>
          <p>⏱ Total Time: ${k.time} min | ⭐ Collected: ${totalStars} ⭐</p>

          <h4>✅ Routines</h4>
          ${routinesHtml}

          <h4>📊 Activities</h4>
          ${activitiesHtml}
        </div>
      `;
    });

    // If no members or data
    if (!Object.values(kids).some(k => k.activities.length || k.routines.length)) {
      area.innerHTML += "<p>No routines or activities for this date.</p>";
    }

  } catch (err) {
    console.error("Combined report error:", err);
    area.innerHTML += `<p style="color:red;">Error loading report ⚠️</p>`;
  }
}





// Helper to get selected date or default to today
function getSelectedDate() {
  const dateEl = document.getElementById("filterDate");
  return dateEl?.value || new Date().toISOString().slice(0, 10);
}




/* =====================================
   INIT
===================================== */
window.addEventListener("DOMContentLoaded", () => {
  const d = document.getElementById("filterDate");
  if (d && !d.value) d.value = getSelectedDate();
  loadTreeClasses();
});

/* BACK + LOGOUT */
document.getElementById("backBtn").onclick = () => {
  window.location.href = "sch-choose.html";
};
function logout() {
  localStorage.removeItem("user");
  window.location.href = "sch-signin.html";
}
</script>





</body>
</html>
