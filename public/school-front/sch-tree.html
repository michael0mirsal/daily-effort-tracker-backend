<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Nursery Tree — Classes A/B/C</title>
<style>
  :root{
    --node-bg: #fff3cd;
    --node-color: #5c4033;
    --line-color: #5c4033;
    --pane-bg: rgba(255,255,255,0.28);
    --app-bg: linear-gradient(135deg,#fceabb,#f8b500);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:Inter, Arial, Helvetica, sans-serif;background:var(--app-bg);}

  .app {
    display:flex;
    height:100vh;
    align-items:stretch;
  }

  /* LEFT: tree pane */
  #nurseryPane {
    flex:0 0 42%;
    padding:22px;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    background:var(--pane-bg);
    border-right:4px dashed rgba(255,255,255,0.7);
  }

  /* Tree root container */
  .tree {
    width:100%;
    max-width:520px;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
    transform-origin: top center;
  }

  /* Node style */
  .node {
    background:var(--node-bg);
    color:var(--node-color);
    padding:10px 18px;
    border-radius:999px;
    box-shadow:0 6px 14px rgba(0,0,0,0.15);
    text-align:center;
    margin:10px 0;
    position:relative;
    white-space:nowrap;
    font-weight:600;
    transition: transform .18s ease;
  }
  .node:hover { transform: translateY(-3px) scale(1.02); }

  /* Children container (vertical stacking) */
  .children {
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
  }

  /* Short vertical connector from parent node down into its children block */
  .children::before {
    content:"";
    position:absolute;
    top:-12px;             /* attaches to bottom of parent node */
    left:50%;
    transform:translateX(-50%);
    width:2px;
    height:12px;
    background:var(--line-color);
    z-index:0;
  }

  /* Each class branch: centered, with optional internal spacing */
  .class-branch {
    width:86%;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
    margin-top:6px;
  }

  /* Small connector above each class node to visually continue the vertical line */
  .class-branch::before{
    content:"";
    position:absolute;
    top:-8px;
    left:50%;
    transform:translateX(-50%);
    width:2px;
    height:8px;
    background:var(--line-color);
    z-index:0;
  }

  /* Make sure deep page doesn't scroll horizontally; vertical handled by scaling */
  #mainContent {
    flex:1;
    padding:22px;
    display:flex;
    flex-direction:column;
    gap:12px;
    align-items:flex-start;
    justify-content:flex-start;
  }

  h1{ margin:0; color:#5c4033; font-size:18px; }
  p{ margin:0; color:rgba(0,0,0,0.55) }

  /* Slightly compact nodes when scaling */
  .compact .node { padding:8px 14px; font-size:0.95rem; }

  /* subtle appear animation */
  .fade-in { animation: fadeInUp .28s ease both; }
  @keyframes fadeInUp { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }
</style>
</head>
<body>
  <div class="app">

    <!-- LEFT: tree pane -->
    <div id="nurseryPane" aria-label="Nursery tree pane">
      <div class="tree" id="treeRoot">
        <!-- Root -->
        <div class="node" id="nurseryNode">Happy Kids Nursery</div>

        <!-- Classes container (vertical) -->
        <div class="children" id="classesContainer" aria-live="polite">
          <!-- Pre-populated branches -->
          <div class="class-branch fade-in">
            <div class="node">Class A</div>
          </div>

          <div class="class-branch fade-in">
            <div class="node">Class B</div>
          </div>

          <div class="class-branch fade-in">
            <div class="node">Class C</div>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT: simple info -->
    <div id="mainContent" role="region" aria-label="Controls and info">
      <h1>Nursery — classes</h1>
      <p>Root: <strong>Happy Kids Nursery</strong></p>
      <p>Branches: <strong>Class A, Class B, Class C</strong></p>
      <p>Next steps: add teachers &amp; children under each class, make branches expandable, or allow adding classes dynamically.</p>
    </div>
  </div>

<script>
/* Auto-fit: scale the tree vertically if its rendered height exceeds available pane height.
   Called on load and on window resize. Keeps layout visible without vertical scrollbar.
*/
(function(){
  const treeRoot = document.getElementById('treeRoot');
  const nurseryPane = document.getElementById('nurseryPane');

  function adjustScale() {
    // small timeout to let layout settle if called right after DOM changes
    requestAnimationFrame(()=> {
      const paneRect = nurseryPane.getBoundingClientRect();
      const treeRect = treeRoot.getBoundingClientRect();

      // available space to occupy (leave small margin)
      const avail = Math.max(60, paneRect.height * 0.94);
      const current = treeRect.height;

      if (current > avail && current > 0) {
        // clamp scale to not be too small
        const scale = Math.max(0.5, avail / current);
        treeRoot.style.transform = `scale(${scale})`;
        treeRoot.classList.add('compact');
      } else {
        treeRoot.style.transform = '';
        treeRoot.classList.remove('compact');
      }
    });
  }

  // initial adjustment
  window.addEventListener('load', adjustScale);
  window.addEventListener('resize', adjustScale);

  // expose function if needed for later steps
  window._nursery = window._nursery || {};
  window._nursery.adjustScale = adjustScale;
})();
</script>
</body>
</html>
