<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nursery Tree</title>
<style>
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #fceabb, #f8b500);
    overflow: hidden;
}

#container {
    display: flex;
    height: 100%;
}

/* LEFT TREE PANEL */
#treePanel {
    width: 35%;
    height: 100%;
    background: rgba(255,255,255,0.3);
    padding: 20px;
    box-sizing: border-box;
    border-right: 4px dashed rgba(255,255,255,0.7);
    overflow-y: auto;
    border-radius: 0 30px 30px 0;
    box-shadow: inset -5px 0 10px rgba(0,0,0,0.1);
}

#nurseryTitle {
    text-align: center;
    color: #5c4033;
    font-size: 2rem;
    margin-bottom: 20px;
    text-shadow: 1px 1px #fff;
}

/* CLASS BRANCHES */
.class-branch {
    background: #fff3cd;
    padding: 12px 25px;
    border-radius: 20px;
    margin: 12px auto;
    cursor: pointer;
    font-size: 1.2rem;
    width: fit-content;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: 0.3s;
    color: #5c4033;
    font-weight: bold;
}

.class-branch:hover {
    transform: scale(1.05);
    background: #ffecb3;
}

/* CHILD ITEMS UNDER CLASS */
.child-items {
    margin-left: 30px;
    margin-top: 10px;
    display: none; /* hidden by default */
}

.child-items .teacher-box {
    background: #ffe8a1;
    padding: 8px 12px;
    border-radius: 12px;
    margin-bottom: 5px;
}
.child-items .kid-box {
    background: #fff;
    padding: 6px 10px;
    border-radius: 12px;
    margin-bottom: 3px;
}

/* RIGHT PANEL */
#rightPanel {
    width: 65%;
    height: 100%;
    position: relative;
    padding: 20px;
    box-sizing: border-box;
    overflow-y: auto;
    text-align: center;
}

/* TOP RIGHT BUTTONS */
#topButtons {
    position: absolute;
    top: 15px;
    right: 15px;
    display: flex;
    gap: 10px;
}
button {
    padding: 10px 20px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    font-weight: bold;
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
}
#logoutBtn { background: #e57373; color: white; }
#backBtn { background: #81c784; color: white; }

/* REPORT AREA */
#classReport {
    margin-top: 70px;
}
#reportContent {
    margin-top: 20px;
    padding: 25px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    font-size: 1.2rem;
    text-align: left;
}
</style>
</head>
<body>

<div id="container">
    <!-- LEFT TREE -->
    <div id="treePanel">
        <h2 id="nurseryTitle">Happy Kids Nursery</h2>
        <div id="classTree"></div>
    </div>

    <!-- RIGHT PANEL -->
    <div id="rightPanel">
        <div id="topButtons">
            <button id="backBtn">⬅ Back</button>
            <button id="logoutBtn">Logout</button>
        </div>

        <div id="classReport">
            <h2>Select a class to view full report</h2>
            <div id="reportContent"></div>
        </div>
    </div>
</div>

<script>
/* ===============================
   GLOBAL DATA (DYNAMIC)
================================ */
let classes = [];        // classes from DB
let membersMap = {};     // memberId -> member name
let reports = [];        // routines / activities


/* ===============================
   LOAD ALL DATA FROM BACKEND
================================ */
async function loadData() {
  try {
    // Load classes
    const classRes = await fetch("/api/class");
    classes = await classRes.json();

    // Load members (kids + teachers if same collection)
    const memberRes = await fetch("/api/sch-members");
    const members = await memberRes.json();
    members.forEach(m => membersMap[m._id] = m.name);

    // Load reports (activities / routines)
    const reportRes = await fetch("/api/sch-activities");
    reports = await reportRes.json();

    loadTree();
  } catch (err) {
    console.error("Failed to load data", err);
  }
}


/* ===============================
   BUILD TREE (CLASSES → TEACHERS → KIDS)
================================ */
function loadTree() {
  const tree = document.getElementById("classTree");
  tree.innerHTML = "";

  classes.forEach(cls => {
    const classDiv = document.createElement("div");
    classDiv.className = "class-branch";
    classDiv.textContent = cls.name;

    const childContainer = document.createElement("div");
    childContainer.className = "child-items";

    /* -------- Teachers -------- */
    if (!cls.teachers || cls.teachers.length === 0) {
      const tDiv = document.createElement("div");
      tDiv.className = "teacher-box";
      tDiv.textContent = "👩‍🏫 No teacher assigned";
      childContainer.appendChild(tDiv);
    } else {
      cls.teachers.forEach(tid => {
        const tDiv = document.createElement("div");
        tDiv.className = "teacher-box";
        tDiv.textContent = "👩‍🏫 " + (membersMap[tid] || tid);
        childContainer.appendChild(tDiv);
      });
    }

    /* -------- Kids -------- */
    if (!cls.members || cls.members.length === 0) {
      const kDiv = document.createElement("div");
      kDiv.className = "kid-box";
      kDiv.textContent = "🧒 No kids yet";
      childContainer.appendChild(kDiv);
    } else {
      cls.members.forEach(mid => {
        const kidDiv = document.createElement("div");
        kidDiv.className = "kid-box";
        kidDiv.textContent = "🧒 " + (membersMap[mid] || mid);
        childContainer.appendChild(kidDiv);
      });
    }

    /* -------- Toggle + Report -------- */
    classDiv.onclick = () => {
      childContainer.style.display =
        childContainer.style.display === "block" ? "none" : "block";
      showReport(cls);
    };

    tree.appendChild(classDiv);
    tree.appendChild(childContainer);
  });
}


/* ===============================
   SHOW REPORT (RIGHT PANEL)
   (Merged with original logic)
================================ */
function showReport(cls) {
  const reportArea = document.getElementById("reportContent");

  let html = `<h2>${cls.name} Full Report</h2>`;

  // Filter reports by classId
  const classReports = reports.filter(r => r.classId === cls._id);

  if (classReports.length === 0) {
    html += "<p>No activities or routines saved yet.</p>";
    reportArea.innerHTML = html;
    return;
  }

  // Group reports by date
  const reportByDate = {};
  classReports.forEach(r => {
    if (!reportByDate[r.date]) reportByDate[r.date] = [];
    reportByDate[r.date].push(r);
  });

  html += "<ul>";

  Object.keys(reportByDate).forEach(date => {
    html += `<li><strong>📅 ${date}</strong><ul>`;

    reportByDate[date].forEach(r => {
      html += `<li><b>🧒 ${membersMap[r.kidmember] || r.kidmember}</b><ul>`;

      r.items.forEach(item => {
        html += `
          <li>
            🎯 ${item.activity || "Activity"}
            | ⏱ ${item.timeMin || 0} min
            | ⭐ ${item.evaluation || "-"}
            <br>📝 ${item.note || ""}
          </li>
        `;
      });

      html += "</ul></li>";
    });

    html += "</ul></li>";
  });

  html += "</ul>";
  reportArea.innerHTML = html;
}


/* ===============================
   BACK BUTTON
================================ */
document.getElementById("backBtn").onclick = () => {
  document.getElementById("reportContent").innerHTML =
    "<p>Select a class to view full report</p>";
};


/* ===============================
   LOGOUT BUTTON
================================ */
document.getElementById("logoutBtn").onclick = () => {
  alert("Logging out...");
};


/* ===============================
   INIT
================================ */
loadData();
</script>


</body>
</html>
