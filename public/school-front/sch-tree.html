<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nursery Tree</title>
<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #fceabb, #f8b500);
    }

    /* MAIN LAYOUT */
    #container {
        display: flex;
        height: 100%;
        width: 100%;
    }

    /* LEFT TREE PANEL */
    #treePanel {
        width: 35%;
        height: 100%;
        background: rgba(255,255,255,0.3);
        padding: 20px;
        box-sizing: border-box;
        border-right: 4px dashed rgba(255,255,255,0.7);
        overflow-y: auto; /* scroll INSIDE only */
        border-radius: 0 30px 30px 0;
        box-shadow: inset -5px 0 10px rgba(0,0,0,0.1);
    }

    #nurseryTitle {
        text-align: center;
        color: #5c4033;
        font-size: 2rem;
        margin-bottom: 20px;
        text-shadow: 1px 1px #fff;
    }

    /* CLASS BRANCHES */
    .class-branch {
        background: #fff3cd;
        padding: 12px 25px;
        border-radius: 20px;
        margin: 12px auto;
        cursor: pointer;
        font-size: 1.2rem;
        width: fit-content;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        transition: 0.3s;
        color: #5c4033;
        font-weight: bold;
    }

    .class-branch:hover {
        transform: scale(1.05);
        background: #ffecb3;
    }

    /* RIGHT PANEL */
    #rightPanel {
        width: 65%;
        height: 100%;
        position: relative;
        padding: 20px;
        box-sizing: border-box;
        overflow-y: auto;
        text-align: center;
    }

    /* TOP RIGHT BUTTONS */
    #topButtons {
        position: absolute;
        top: 15px;
        right: 15px;
        display: flex;
        gap: 10px;
    }

    button {
        padding: 10px 20px;
        border-radius: 12px;
        border: none;
        cursor: pointer;
        font-size: 1rem;
        font-weight: bold;
        box-shadow: 0 3px 8px rgba(0,0,0,0.2);
    }

    #logoutBtn {
        background: #e57373;
        color: white;
    }

    #backBtn {
        background: #81c784;
        color: white;
    }

    /* REPORT AREA */
    #classReport {
        margin-top: 70px;
    }

    #reportContent {
        margin-top: 20px;
        padding: 25px;
        background: white;
        border-radius: 20px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        font-size: 1.2rem;
    }

</style>
</head>
<body>

<div id="container">

    <!-- LEFT TREE -->
    <div id="treePanel">
        <h2 id="nurseryTitle">Happy Kids Nursery</h2>
        <div id="classTree"></div>
    </div>

    <!-- RIGHT REPORT -->
    <div id="rightPanel">

        <!-- BUTTONS -->
        <div id="topButtons">
            <button id="backBtn">⬅ Back</button>
            <button id="logoutBtn">Logout</button>
        </div>

        <!-- REPORT -->
        <div id="classReport">
            <h2>Select a class to view its report</h2>
            <div id="reportContent"></div>
        </div>

    </div>
</div>

<script>
/* SAMPLE DATA (you can replace with API later) */
const classes = [
    {
        name: "Class A",
        report: [
            "Routine saved on 2 Dec",
            "Activity: Drawing",
            "Activity: Numbers practice"
        ]
    },
    {
        name: "Class B",
        report: [
            "Routine saved on 3 Dec",
            "Activity: Singing",
            "Activity: Coloring"
        ]
    },
    {
        name: "Class C",
        report: [
            "Routine saved on 4 Dec",
            "Activity: Math Games",
            "Activity: Story Time"
        ]
    }
];

/* BUILD TREE */
function loadTree() {
    const tree = document.getElementById("classTree");
    tree.innerHTML = "";

    classes.forEach(cls => {
        const div = document.createElement("div");
        div.className = "class-branch";
        div.textContent = cls.name;

        div.onclick = () => showReport(cls);

        tree.appendChild(div);
    });
}

/* SHOW REPORT ON RIGHT PANEL */
function showReport(cls) {
    const reportArea = document.getElementById("reportContent");

    reportArea.innerHTML = `
        <h2>${cls.name} Report</h2>
        <ul style="text-align:left; font-size:1.1rem;">
            ${cls.report.map(r => `<li>${r}</li>`).join("")}
        </ul>
    `;
}

loadTree();
</script>

</body>
</html>
