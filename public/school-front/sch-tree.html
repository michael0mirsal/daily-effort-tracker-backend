<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nursery Tree</title>
<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #fceabb, #f8b500);
    font-family: Arial, sans-serif;
    display: flex;
}

#nurseryPane {
    flex: 0 0 40%;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px;
    background: rgba(255,255,255,0.3);
    border-right: 4px dashed rgba(255,255,255,0.7);
}

.tree {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
}

/* ROOT NODE */
.node {
    background: #fff3cd;
    padding: 12px 20px;
    border-radius: 50px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    color: #5c4033;
    font-weight: bold;
    margin: 10px;
}

/* VERTICAL LINE FROM ROOT DOWN */
#rootBranch::after {
    content: "";
    width: 2px;
    height: 40px;
    background: #5c4033;
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
}

/* HORIZONTAL LINE THAT CONNECTS ALL CLASSES */
#classesRow {
    display: flex;
    gap: 30px;
    margin-top: 40px;
    position: relative;
}

#classesRow::before {
    content: "";
    position: absolute;
    top: -20px;
    left: 0;
    right: 0;
    height: 2px;
    background: #5c4033;
}

/* SMALL VERTICAL LINES FROM MAIN HORIZONTAL LINE TO EACH CLASS */
.classItem {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
}

.classItem::before {
    content: "";
    width: 2px;
    height: 20px;
    background: #5c4033;
    position: absolute;
    top: -20px;
}
</style>
</head>
<body>

<div id="nurseryPane">
    <div class="tree">

        <!-- NURSERY ROOT -->
        <div class="node" id="rootBranch">Happy Kids Nursery</div>

        <!-- CLASSES ON SAME BRANCH -->
        <div id="classesRow">

            <div class="classItem">
                <div class="node">Class A</div>
            </div>

            <div class="classItem">
                <div class="node">Class B</div>
            </div>

            <div class="classItem">
                <div class="node">Class C</div>
            </div>

        </div>

    </div>
</div>

</body>
</html>
