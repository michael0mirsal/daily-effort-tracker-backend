<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nursery Tree</title>
<style>
:root {
  --primary: #2c3e50;
  --secondary: #3498db;
  --success: #27ae60;
  --warning: #f39c12;
  --danger: #e74c3c;
  --bg: #f4f6f8;
  --card: #ffffff;
  --text: #2d3436;
}

/* RESET */
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  background: var(--bg);
  font-family: "Segoe UI", Roboto, Arial, sans-serif;
  color: var(--text);
  overflow: hidden;
}

/* ================= ZOOM OUT ================= */
#container {
  transform: scale(0.5);
  transform-origin: top left; /* scale from top-left corner */
  width: 200%; /* compensate for 50% scale */
  height: 200%; /* optional if needed */
}


/* ================= LEFT TREE PANEL ================= */
#treePanel {
  width: 320px;
  background: linear-gradient(180deg, #ffffff, #f1f3f6);
  border-right: 1px solid #ddd;
  padding: 20px;
  overflow-y: auto;
  box-shadow: 4px 0 15px rgba(0,0,0,0.05);
}

#nurseryTitle {
  text-align: center;
  font-size: 1.4rem;
  margin-bottom: 20px;
  color: var(--primary);
  font-weight: 700;
}

/* CLASS NODE */
.class-branch {
  background: #fff;
  border-radius: 14px;
  padding: 12px 15px;
  margin-bottom: 10px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  transition: 0.25s;
}

.class-branch:hover {
  background: #f0f6ff;
  transform: translateX(4px);
}

/* CHILD ITEMS WITH GRADUAL SECTIONS */
.child-items {
  margin: 8px 0 15px 15px;
}

/* TREE SECTIONS */
.tree-section {
  margin-top: 10px;
  margin-left: 12px;
  border-left: 2px dashed #dcdde1;
  padding-left: 10px;
}

.tree-section-title {
  font-size: 0.85rem;
  font-weight: 700;
  color: #555;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.teacher-box {
  background: #eef3ff;
  border-left: 4px solid var(--secondary);
  border-radius: 8px;
  padding: 6px 10px;
  margin-bottom: 4px;
}

.member-box {
  background: #f9fafb;
  border-left: 4px solid var(--success);
  border-radius: 8px;
  padding: 6px 10px;
  margin-bottom: 4px;
}

/* ================= RIGHT REPORT PANEL ================= */
#rightPanel {
  flex: 1;
  padding: 25px;
  overflow-y: auto;
}

/* TOP BAR */
#topButtons {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-bottom: 20px;
}

button {
  padding: 10px 18px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-weight: 600;
}

#backBtn {
  background: #ecf0f1;
}

#logoutBtn {
  background: var(--danger);
  color: white;
}

/* ================= REPORT ================= */
#classReport h2 {
  margin-top: 0;
}

/* REPORT HEADER */
.report-header {
  background: linear-gradient(135deg, var(--primary), #1f2d3a);
  color: white;
  padding: 25px;
  border-radius: 16px;
  margin-bottom: 25px;
}

.report-header h2 {
  margin: 0;
  font-size: 1.8rem;
}

/* CHILD CARD */
.child-card {
  background: var(--card);
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 30px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

/* TITLE */
.child-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid #eee;
  padding-bottom: 10px;
  margin-bottom: 15px;
}

.child-title h3 {
  margin: 0;
}

/* KPI */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 15px;
  margin: 20px 0;
}

.kpi {
  background: #f9fafb;
  border-radius: 14px;
  padding: 15px;
  text-align: center;
}

.kpi h4 {
  margin: 0;
  font-size: 0.9rem;
  color: #777;
}

.kpi strong {
  display: block;
  margin-top: 8px;
  font-size: 1.4rem;
}

/* SECTION */
.section-title {
  margin-top: 25px;
  margin-bottom: 10px;
  font-size: 1.1rem;
  color: var(--primary);
  border-left: 4px solid var(--secondary);
  padding-left: 10px;
}

/* ACTIVITY TABLE – STRONG BORDERS */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 12px;
  border: 1px solid #dcdde1;
  border-radius: 10px;
  overflow: hidden;
}

th {
  background: #f1f3f6;
  font-weight: 700;
  color: #2c3e50;
  border-bottom: 2px solid #dcdde1;
}

th, td {
  padding: 12px;
  border-right: 1px solid #e0e0e0;
}

tr td:last-child,
tr th:last-child {
  border-right: none;
}

tr:nth-child(even) td {
  background: #fafbfc;
}

tr:hover td {
  background: #eef4ff;
}

/* BADGE */
.badge {
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 0.8rem;
  color: white;
}

.badge-success { background: var(--success); }
.badge-primary { background: var(--secondary); }

/* EMPTY */
.empty {
  color: #888;
  font-style: italic;
}
</style>



</head>
<body>

<div id="container">
    <!-- LEFT TREE -->
    <div id="treePanel">
        <h2 id="nurseryTitle">Happy Kids Nursery</h2>
        <div id="classTree"></div>
    </div>

    <!-- RIGHT PANEL -->
    <div id="rightPanel">
        <div id="topButtons">
            <button id="backBtn">⬅ Back</button>
            <button id="logoutBtn">Logout</button>
        </div>

        <div id="classReport">
            <h2>Select a class to view full report</h2>
            <div id="reportContent"></div>
        </div>
    </div>
</div>

<script>
const API = "http://localhost:3000/api";

/* =====================================
   GLOBAL STATE
===================================== */
let TREE_CLASSES = [];
let MEMBERS_MAP = {};   // kidId -> name
let TEACHERS_MAP = {};  // teacherId -> name

/* =====================================
   DATE HELPER (ALWAYS TODAY)
===================================== */
function getSelectedDate() {
  const el = document.getElementById("filterDate");
  return el && el.value
    ? el.value
    : new Date().toISOString().slice(0, 10);
}

/* =====================================
   LOAD CLASSES + MEMBERS + TEACHERS
===================================== */
async function loadTreeClasses() {
  const user = JSON.parse(localStorage.getItem("user"));
  if (!user) return;

  try {
    const res = await fetch(`${API}/nurseries/${user.nurseryId}/classes`);
    const data = await res.json();
    TREE_CLASSES = data.classes || [];

    const memberIds = new Set();
    const teacherIds = new Set();

    TREE_CLASSES.forEach(cls => {
      (cls.members || []).forEach(id => memberIds.add(String(id._id || id)));
      (cls.teachers || []).forEach(id => teacherIds.add(String(id._id || id)));
    });

    if (memberIds.size) {
      const r = await fetch(`${API}/sch-members?ids=${[...memberIds].join(",")}`);
      const list = await r.json();
      list.forEach(m => MEMBERS_MAP[m._id] = m.name);
    }

    if (teacherIds.size) {
      const r = await fetch(`${API}/teachers?ids=${[...teacherIds].join(",")}`);
      const list = await r.json();
      list.forEach(t => TEACHERS_MAP[t._id] = t.name);
    }

    buildTree();
  } catch (err) {
    console.error("❌ Tree load failed", err);
  }
}

/* =====================================
   BUILD TREE (NO DUPLICATES)
===================================== */
function buildTree() {
  const tree = document.getElementById("classTree");
  if (!tree) return;
  tree.innerHTML = "";

  TREE_CLASSES.forEach(cls => {
    const classDiv = document.createElement("div");
    classDiv.className = "class-branch";
    classDiv.textContent = cls.name;

    const childBox = document.createElement("div");
    childBox.className = "child-items";
    childBox.style.display = "none";

    classDiv.onclick = async () => {
      const open = childBox.style.display === "block";
      childBox.style.display = open ? "none" : "block";

      if (open) return;

      childBox.innerHTML = `
  <div class="tree-section">
    <div class="tree-section-title">👩‍🏫 Teachers</div>
    ${(cls.teachers || []).map(tid => {
      const name = TEACHERS_MAP[tid._id || tid] || "Teacher";
      return `<div class="teacher-box">${name}</div>`;
    }).join("")}
  </div>

  <div class="tree-section">
    <div class="tree-section-title">🧒 Kids</div>
    ${(cls.members || []).map(mid => {
      const name = MEMBERS_MAP[mid._id || mid] || "Kid";
      return `<div class="member-box">${name}</div>`;
    }).join("")}
  </div>
`;


      loadCombinedClassReport(cls);
    };

    tree.appendChild(classDiv);
    tree.appendChild(childBox);
  });
}

/* =====================================
   COMBINED REPORT (FINAL FIX)
===================================== */

async function loadCombinedClassReport(cls) {
  const area = document.getElementById("reportContent");
  if (!area) return;

  const date = getSelectedDate();
  area.innerHTML = `<h2>${cls.name} – Combined Report (${date})</h2>`;

  try {
    /* =========================
       1) Fetch data
    ========================= */
    const [rRes, aRes] = await Promise.all([
      fetch(`${API}/sch-routine/load?classId=${cls._id}&date=${date}`),
      fetch(`${API}/sch-activities?classId=${cls._id}&date=${date}`)
    ]);

    const routines = rRes.ok ? await rRes.json() : [];
    const activities = aRes.ok ? await aRes.json() : [];

    /* =========================
       2) Init kids (ONCE)
    ========================= */
    const kids = {};
    const kidsByName = {};

    cls.members.forEach(mid => {
      const id = String(mid._id || mid);
      const name = MEMBERS_MAP[id] || mid.name || "Unknown";

      kids[id] = {
        id,
        name,

        // ⏱ time
        totalTime: 0,

        // ⭐ stars (SEPARATED)
        routineStars: 0,
        activityStars: 0,

        // data
        routines: [],
        activities: []
      };

      kidsByName[name.toLowerCase()] = kids[id];
    });

    /* =========================
       3) Merge activities
    ========================= */
    activities.forEach(doc => {
      const kidId = String(
        doc.schoolMember ||
        doc.schoolMemberId ||
        doc.kidmember
      );

      const kid = kids[kidId];
      if (!kid) return;

      (doc.items || []).forEach(it => {
        const time = Number(it.timeMin || 0);
        const stars = Number(it.evaluation || 0);

        kid.totalTime += time;
        kid.activityStars += stars;

        kid.activities.push(it);
      });
    });

    /* =========================
       4) Merge routines (ONLY done === true)
    ========================= */
    routines.forEach(r => {
      const kidId = String(r.kidmember || r.kidId);
      const nameKey = (r.kidName || "").toLowerCase();

      const kid = kids[kidId] || kidsByName[nameKey];
      if (!kid) return;

      (r.items || []).forEach(it => {
        if (it.done !== true) return; // 🔒 strict rule

        kid.routineStars += 1; // ⭐ 1 star per completed routine

        kid.routines.push({
          task: it.task,
          section: it.section
        });
      });
    });

  
      /* =========================
   5) Render – PROFESSIONAL
========================= */

area.innerHTML = `
  <div class="report-header">
    <h2>${cls.name} – Daily Performance Report</h2>
    <span>Date: ${date}</span>
  </div>
`;

Object.values(kids).forEach(k => {
  const totalStars = k.routineStars + k.activityStars;

  // group routines
  const grouped = {};
  k.routines.forEach(r => {
    if (!grouped[r.section]) grouped[r.section] = [];
    grouped[r.section].push(r.task);
  });

  area.innerHTML += `
    <div class="child-card">

      <div class="child-title">
        <h3>🧒 ${k.name}</h3>
        <span class="badge badge-primary">${totalStars} ⭐ Total</span>
      </div>

      <div class="kpi-grid">
        <div class="kpi">
          <h4>Total Time</h4>
          <strong>${k.totalTime} min</strong>
        </div>
        <div class="kpi">
          <h4>Routine Stars</h4>
          <strong>${k.routineStars} ⭐</strong>
        </div>
        <div class="kpi">
          <h4>Activity Stars</h4>
          <strong>${k.activityStars} ⭐</strong>
        </div>
      </div>

      <div class="section-title">✅ Completed Routines</div>
      ${
        k.routines.length
          ? Object.entries(grouped).map(([section, tasks]) => `
              <strong>${section.toUpperCase()}</strong>
              <ul>
                ${tasks.map(t => `<li>${t}</li>`).join("")}
              </ul>
            `).join("")
          : `<p class="empty">No completed routines</p>`
      }

      <div class="section-title">📊 Activities</div>
      ${
        k.activities.length
          ? `
            <table>
              <tr>
                <th>Activity</th>
                <th>Time</th>
                <th>Stars</th>
                <th>Note</th>
              </tr>
              ${k.activities.map(a => `
                <tr>
                  <td>${a.activity}</td>
                  <td>${a.timeMin} min</td>
                  <td><span class="badge badge-success">${a.evaluation} ⭐</span></td>
                  <td>${a.note || "-"}</td>
                </tr>
              `).join("")}
            </table>
          `
          : `<p class="empty">No activities recorded</p>`
      }

    </div>
  `;
});


  } catch (err) {
    console.error("Combined report error:", err);
    area.innerHTML += `<p style="color:red;">Error loading combined report ⚠️</p>`;
  }
}







// Helper to get selected date or default to today
function getSelectedDate() {
  const dateEl = document.getElementById("filterDate");
  return dateEl?.value || new Date().toISOString().slice(0, 10);
}




/* =====================================
   INIT
===================================== */
window.addEventListener("DOMContentLoaded", () => {
  const d = document.getElementById("filterDate");
  if (d && !d.value) d.value = getSelectedDate();
  loadTreeClasses();
});

/* BACK + LOGOUT */
document.getElementById("backBtn").onclick = () => {
  window.location.href = "sch-choose.html";
};
function logout() {
  localStorage.removeItem("user");
  window.location.href = "sch-signin.html";
}
</script>





</body>
</html>
