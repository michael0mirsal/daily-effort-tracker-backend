<!DOCTYPE html>
<html>
<head>
<style>
  body {
    font-family: Arial;
    padding: 20px;
  }

  .tree {
    padding-left: 20px;
    line-height: 24px;
  }

  .node {
    cursor: pointer;
    margin: 4px 0;
  }

  .children {
    margin-left: 20px;
    display: none;
  }

  .node.open + .children {
    display: block;
  }
</style>
</head>
<body>

<h2>Nursery Tree</h2>

<div id="tree" class="tree"></div>

<script>
const data = {
  nursery: "Happy Kids Nursery",
  classes: [
    {
      name: "Class 1",
      teacher: "Teacher A",
      kids: ["Alice", "Bob", "Charlie"]
    },
    {
      name: "Class 2",
      teacher: "Teacher B",
      kids: ["Daisy", "Ethan"]
    },
    {
      name: "Class 3",
      teacher: "Teacher C",
      kids: ["Fiona", "George", "Hannah"]
    }
  ]
};

function buildTree() {
  const root = document.getElementById("tree");

  // Nursery root
  const nurseryNode = document.createElement("div");
  nurseryNode.className = "node";
  nurseryNode.textContent = data.nursery;
  root.appendChild(nurseryNode);

  // Classes under nursery (same branch level)
  data.classes.forEach(cls => {
    const classNode = document.createElement("div");
    classNode.className = "node";
    classNode.textContent = cls.name;

    const container = document.createElement("div");
    container.className = "children";

    // Add teacher
    const teacher = document.createElement("div");
    teacher.textContent = "👩‍🏫 " + cls.teacher;
    container.appendChild(teacher);

    // Add kids
    cls.kids.forEach(k => {
      const kid = document.createElement("div");
      kid.textContent = "👦 " + k;
      container.appendChild(kid);
    });

    // Toggle show/hide teacher & kids
    classNode.addEventListener("click", () => {
      classNode.classList.toggle("open");
    });

    root.appendChild(classNode);
    root.appendChild(container);
  });
}

buildTree();
</script>

</body>
</html>
