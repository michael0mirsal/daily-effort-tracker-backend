<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nursery Tree 🌼</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    display: flex;
    height: 100vh;
    background: linear-gradient(135deg, #fceabb, #f8b500);
}

#nurseryTree {
    flex: 0 0 40%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(255, 255, 255, 0.3);
    border-radius: 0 30px 30px 0;
    padding: 20px;
    box-sizing: border-box;
}

.tree {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
}

/* Node styling */
.node {
    background: #fff3cd;
    padding: 5px 10px;
    border-radius: 50%;
    text-align: center;
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
    font-size: 1rem;
    color: #5c4033;
    margin: 5px;
    position: relative;
    transition: transform 0.3s ease, background 0.3s ease;
}

.node:hover {
    transform: scale(1.1);
    background: #ffecb3;
}

/* Branch lines */
.branch {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    width: 100%;
}

/* Vertical line from parent to children */
.branch::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    width: 2px;
    height: 10px;
    background: #5c4033;
}

/* Children container with horizontal line */
.children {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 10px;
    position: relative;
    width: 100%;
}

/* Horizontal line connecting children */
.children::before {
    content: '';
    position: absolute;
    top: 0;
    left: 5%;
    right: 5%;
    height: 2px;
    background: #5c4033;
    z-index: -1;
}

/* Vertical lines from each child to horizontal line */
.branch > .children > .branch > .node::before {
    content: '';
    position: absolute;
    top: -10px;
    left: 50%;
    width: 2px;
    height: 10px;
    background: #5c4033;
}

#mainContent {
    flex: 0 0 60%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
}

h1 {
    font-size: 2rem;
    color: #ff6f00;
    text-shadow: 1px 1px #fff;
    margin-bottom: 15px;
}
</style>
</head>
<body>

<div id="nurseryTree">
    <div class="tree">
        <div class="node">Happy Kids Nursery</div>

        <div class="children">
            <!-- Class 1 -->
            <div class="branch">
                <div class="node">Class 1</div>
                <div class="children">
                    <div class="branch">
                        <div class="node">Teacher A</div>
                        <div class="children">
                            <div class="branch"><div class="node">Alice</div></div>
                            <div class="branch"><div class="node">Bob</div></div>
                            <div class="branch"><div class="node">Charlie</div></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Class 2 -->
            <div class="branch">
                <div class="node">Class 2</div>
                <div class="children">
                    <div class="branch">
                        <div class="node">Teacher B</div>
                        <div class="children">
                            <div class="branch"><div class="node">Daisy</div></div>
                            <div class="branch"><div class="node">Ethan</div></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Class 3 -->
            <div class="branch">
                <div class="node">Class 3</div>
                <div class="children">
                    <div class="branch">
                        <div class="node">Teacher C</div>
                        <div class="children">
                            <div class="branch"><div class="node">Fiona</div></div>
                            <div class="branch"><div class="node">George</div></div>
                            <div class="branch"><div class="node">Hannah</div></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="mainContent">
    <h1>Welcome to Happy Kids Nursery</h1>
    <p>Dynamic tree layout: nursery → classes → teachers → kids</p>
</div>

</body>
</html>
