<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nursery Access – Login / Signup</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #a8edea, #fed6e3);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.15);
      width: 90%;
      max-width: 420px;
      text-align: center;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      margin-bottom: 15px;
      font-weight: 600;
      color: #333;
    }

    p {
      color: #555;
      margin-bottom: 20px;
    }

    .btn {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      font-size: 17px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 500;
      transition: transform 0.2s, background 0.2s;
      color: white;
    }

    .btn-login { background: #4caf50; }
    .btn-login:hover { background: #45a049; transform: translateY(-2px); }

    .btn-signup { background: #2196f3; }
    .btn-signup:hover { background: #1976d2; transform: translateY(-2px); }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border-radius: 12px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    .note {
      font-size: 13px;
      color: #ff4d4d;
      margin-bottom: 20px;
    }

    button.continue-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      cursor: pointer;
      background: #2196f3;
      color: white;
      font-weight: 500;
      transition: background 0.2s, transform 0.2s;
    }

    button.continue-btn:hover {
      background: #1976d2;
      transform: translateY(-2px);
    }

    .hidden { display: none; }
  </style>
  <style>
.error-msg {
  color: red;
  font-size: 14px;
  margin-top: 5px;
}

#homeBtn {
      background-color: #6fcf97;
      margin-top: 25px;
    }

    #homeBtn:hover {
      background-color: #57b883;
    }

    .tip-box {
      background: rgba(255, 255, 255, 0.7);
      border-radius: 15px;
      padding: 15px 25px;
      font-size: 1em;
      color: #333;
      width: 70%;
      max-width: 500px;
      margin-top: 20px;
      animation: fadeIn 2s ease-in-out;
    }

    .floating {
      position: absolute;
      font-size: 22px;
      opacity: 0.5;
      animation: float 8s linear infinite;
    }

</style>

</head>

<body>
  <div class="card" id="access-card">
    <h1>Nursery Access 🏫</h1>
    <p>Are you a nursery's member or new nursery sign up?</p>

    <button class="btn btn-login" onclick="chooseOption('login')">Existing Nursery</button>
    <button class="btn btn-signup" onclick="chooseOption('signup')">New Nursery</button>
  </div>
<button id="homeBtn" onclick="goHome()">🏠 Home Page</button>

  <div class="card hidden" id="license-card">
  <h1>Nursery Signup 🏫</h1>
  <p>Please enter your valid license number to continue:</p>

  <input type="text" id="license" placeholder="Enter your License Number" />
  <p class="note">⚠ This license will be used <strong>only once</strong>.</p>
  <p id="license-error" class="error-msg"></p>
  <button class="continue-btn" onclick="validateLicense()">Continue</button>
</div>

<script>

function goHome() { window.location.href = "welcome.html"; }

const accessCard = document.getElementById('access-card');
const licenseCard = document.getElementById('license-card');
const licenseError = document.getElementById('license-error');

function chooseOption(option) {
  if(option === 'login') {
    window.location.href = "/sch-signin.html";
  } else {
    accessCard.classList.add('hidden');
    licenseCard.classList.remove('hidden');
  }
}

async function validateLicense() {
  const licenseInput = document.getElementById('license').value.trim();
  if (!licenseInput) {
    licenseError.textContent = 'Please enter your license number.';
    return;
  }

  licenseError.textContent = ''; // reset error

  try {
    const res = await fetch('/api/nursery/validate-license', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ license: licenseInput.trim() }) // normalize case
    });

    const data = await res.json();

    if (res.ok) {

      
      // Redirect to signup after success
      window.location.href = "/sch-signup.html";
    } else {
      licenseError.textContent = data.message;
    }
  } catch (err) {
    console.error(err);
    licenseError.textContent = 'Server error. Please try again later.';
  }
}
</script>



  </script>
</body>
</html>
