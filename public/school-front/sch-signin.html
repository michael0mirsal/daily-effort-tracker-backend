<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nursery Sign In</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
  body {
    margin: 0;
    padding: 0;
    font-family: "Poppins", sans-serif;
    background: linear-gradient(135deg, #a8edea, #fed6e3);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .card {
    background: white;
    padding: 45px 40px;
    border-radius: 26px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.18);
    width: 90%;
    max-width: 450px;
    text-align: center;
    animation: fadeIn 0.8s ease-out;
  }

  h1 {
    margin-bottom: 25px;
    font-weight: 600;
    color: #333;
    font-size: 28px;
  }

  form {
    margin-top: 15px;
  }

  label {
    display: block;
    text-align: left;
    margin-bottom: 8px;
    margin-top: 12px;
    font-weight: 500;
    color: #444;
    font-size: 15px;
  }

  input, select {
    width: 100%;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid #d2d2d2;
    font-size: 16px;
    background: #fafafa;
    transition: border 0.2s, box-shadow 0.2s;
  }

  input:focus, select:focus {
    border-color: #7bb1ff;
    box-shadow: 0 0 8px rgba(123, 177, 255, 0.4);
    outline: none;
  }

  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    font-size: 17px;
    cursor: pointer;
    margin-top: 20px;
    font-weight: 600;
    color: white;
    background: #ff7a2a;
    transition: background 0.25s, transform 0.2s;
  }

  button:hover {
    background: #ff6000;
    transform: translateY(-2px);
  }

  #signinMsg {
    color: red;
    font-weight: 500;
    margin-bottom: 10px;
    font-size: 14px;
  }
</style>

</head>

<body>
  <div class="wrapper">
    <div class="card">
      <h1>Welcome Back 👋</h1>
      <p class="subtext">Sign in to access your nursery dashboard</p>

      <p id="signinMsg" class="error"></p>

      <form id="signinForm">

        <label>Your Name</label>
        <div class="input-group">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="name" placeholder="Enter your name" required>
        </div>

        <label>Select Role</label>
        <div class="input-group">
          <i class="fa-solid fa-users"></i>
          <select id="role" required>
            <option value="">Choose role...</option>
            <option value="admin">Nursery Admin</option>
            <option value="teacher">Teacher</option>
            <option value="parent">Parent</option>
          </select>
        </div>

        <label>Pass Key</label>
        <div class="input-group">
          <i class="fa-solid fa-key"></i>
          <input type="password" id="passKey" placeholder="Enter pass key" required>
        </div>

        <button type="submit">Sign In</button>
      </form>
    </div>
  </div>

  <script>
    const signinForm = document.getElementById("signinForm");
    const signinMsg = document.getElementById("signinMsg");

    signinForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const data = {
        name: document.getElementById("name").value.trim(),
        role: document.getElementById("role").value.trim(),
        passKey: document.getElementById("passKey").value.trim(),
      };

      for (let k in data) {
        if (!data[k]) {
          signinMsg.textContent = "Please fill all fields.";
          return;
        }
      }

      try {
        const res = await fetch("http://localhost:3000/api/school/signin", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const resData = await res.json();

        if (!res.ok) {
          signinMsg.textContent = resData.error || "Sign-in failed";
          return;
        }

        localStorage.setItem("user", JSON.stringify(resData.user));

        if (data.role === "admin") {
          window.location.href = "/admin-dashboard.html";
        } else if (data.role === "teacher") {
          window.location.href = "/teacher-dashboard.html";
        } else {
          window.location.href = "/parent-home.html";
        }

      } catch (err) {
        signinMsg.textContent = "Server error, try again later.";
        console.error(err);
      }
    });
  </script>

</body>
</html>
