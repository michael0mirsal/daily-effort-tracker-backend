<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nursery Sign In</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #a8edea, #fed6e3);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 90px 80px;
      border-radius: 26px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.15);
      width: 92%;
      max-width: 450px;
      backdrop-filter: blur(12px);
      animation: fadeIn 0.8s ease-out;
      text-align: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      margin-bottom: 8px;
      font-weight: 600;
      color: #222;
      font-size: 30px;
    }

    .subtext {
      font-size: 15px;
      margin-bottom: 25px;
      color: #666;
    }

    label {
      display: block;
      text-align: left;
      margin: 15px 0 8px;
      font-weight: 500;
      color: #444;
      font-size: 15px;
    }

    .input-group {
      position: relative;
    }

    .input-group i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #777;
      font-size: 15px;
    }

    input, select {
      width: 100%;
      padding: 14px 16px 14px 42px;
      border-radius: 14px;
      border: 1px solid #d2d2d2;
      font-size: 16px;
      background: #fafafa;
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      border-color: #67a4ff;
      background: #fff;
      box-shadow: 0 0 8px rgba(103, 164, 255, 0.4);
      outline: none;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 28px;
      border: none;
      border-radius: 16px;
      font-size: 18px;
      cursor: pointer;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, #ff914d, #ff7a2a);
      box-shadow: 0 8px 20px rgba(255, 125, 60, 0.3);
      transition: transform 0.25s, box-shadow 0.25s;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(255, 125, 60, 0.45);
    }

    #signinMsg {
      color: #d8000c;
      font-weight: 500;
      margin-bottom: 5px;
      font-size: 14px;
      text-align: center;
    }

.top-buttons {
    position: absolute;
    top: 20px;
    right: 20px;
    display: flex;
    gap: 10px;
  }

  .btn {
    padding: 10px 18px;
    border-radius: 12px;
    border: none;
    font-size: 14px;
    cursor: pointer;
    font-weight: 500;
    color: rgb(187, 169, 92);
    background: #ede1d9;
    transition: background 0.2s, transform 0.2s;
  }

  .btn:hover { background: #ff6000; transform: translateY(-2px); }

  </style>
</head>

<body>

<div class="top-buttons">
 
</div>

  <div class="card">
    <h1>Welcome Back 👋</h1>
    <p class="subtext">Sign in to access your Nursery Dashboard</p>

    <p id="signinMsg"></p>

    <form id="signinForm">

  <label>Your Name</label>
  <div class="input-group">
    <i class="fa-solid fa-user"></i>
    <input type="text" id="name" placeholder="Enter your name" required>
  </div>

  <label>Nursery Name</label>
  <div class="input-group">
    <i class="fa-solid fa-school"></i>
    <input type="text" id="nurseryName" placeholder="Enter nursery name" required>
  </div>

  <label>Select Role</label>
  <div class="input-group">
    <i class="fa-solid fa-users"></i>
    <select id="role" required>
      <option value="">Choose role...</option>
      <option value="manager">Nursery Manager</option>
      <option value="teacher">Teacher</option>
      <option value="supervisor">supervisor</option>
    </select>
  </div>

  <label>Nursery Pass Key</label>
  <div class="input-group">
    <i class="fa-solid fa-key"></i>
    <input type="password" id="passKey" placeholder="Enter nursery pass key" required>
  </div>

  <button type="submit">Sign In</button>
  <button class="btn" id="logoutBtn">Home</button>
</form>

  </div>

  <script>
    const signinForm = document.getElementById("signinForm");
    const signinMsg = document.getElementById("signinMsg");

    signinForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const data = {
    name: document.getElementById("name").value.trim(),
    nurseryName: document.getElementById("nurseryName").value.trim(),
    role: document.getElementById("role").value.trim(),
    passKey: document.getElementById("passKey").value.trim(),
  };

        // Check all fields
      for (let k in data) {
       if (!data[k]) {
       signinMsg.textContent = "Please fill all fields.";
         return;
       }
      }

      try {
        const res = await fetch("http://localhost:3000/api/school/signin", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify(data)
});

        const resData = await res.json();
        const user = resData.user;

        if (!res.ok) {
          signinMsg.textContent = resData.message || "Sign-in failed";
          return;
        }
        // Save user & nurseryId
        localStorage.setItem("user", JSON.stringify(user));
        localStorage.setItem("nurseryId", user.nurseryId || "");
        localStorage.setItem("currentUser", JSON.stringify({       // <--- ADD THIS
        name: user.name,
        role: user.role,
       _id: user._id
        }));
        

  if (user.role.toLowerCase() === "teacher") {
    localStorage.setItem("teacherId", user._id);
  } else {
    localStorage.removeItem("teacherId");
  }// ✅ add this
        // Only teachers need teacherId
    // ✅ Save user info


         // 4️⃣ Redirect by role (CLEAR & MEANINGFUL)
    switch (user.role) {
      case "manager":
        window.location.href = "/sch-choose.html";
        break;

      case "teacher":
        window.location.href = "/sch-choose.html";
        break;

      case "supervisor":
        window.location.href = "/sch-choose.html";
        break;

      default:
        signinMsg.textContent = "Unknown role";
    }

      } catch (err) {
        signinMsg.textContent = "Server error, try again later.";
      }
    });

    // Logout
  document.getElementById("logoutBtn").onclick = () => {
    localStorage.removeItem("user");
    window.location.href = "/welcome.html";
  };

  </script>

</body>
</html>
