<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In – Family / Nursery</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #a8edea, #fed6e3);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.15);
      width: 90%;
      max-width: 450px;
      text-align: center;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      margin-bottom: 20px;
      font-weight: 600;
      color: #333;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      cursor: pointer;
      margin: 10px 0;
      font-weight: 500;
      color: white;
      transition: background 0.2s, transform 0.2s;
    }

    .btn-family { background: #4caf50; }
    .btn-family:hover { background: #45a049; transform: translateY(-2px); }

    .btn-nursery { background: #2196f3; }
    .btn-nursery:hover { background: #1976d2; transform: translateY(-2px); }

    .hidden { display: none; }

    label {
      display: block;
      text-align: left;
      margin-bottom: 5px;
      font-weight: 500;
      color: #555;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 20px;
      border-radius: 12px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    .submit-btn {
      background: #ff7a2a;
    }

    .submit-btn:hover { background: #ff6000; transform: translateY(-2px); }
  </style>
</head>

<body>
  <div class="card">
    <h1>Sign In</h1>

    <p id="signinMsg" class="error"></p>

    <form id="signinForm">

      <label for="name">Your Name</label>
      <input type="text" id="name" placeholder="Enter your name" required>

      <label for="role">Select Role</label>
      <select id="role" required>
        <option value="">-- Choose your role --</option>
        <option value="admin">Nursery Admin</option>
        <option value="teacher">Teacher</option>
        <option value="parent">Parent</option>
      </select>

      <label for="passKey">Pass Key</label>
      <input type="password" id="passKey" placeholder="Enter pass key" required>

      <button type="submit">Sign In</button>
    </form>
  </div>

  <script>
    const signinForm = document.getElementById("signinForm");
    const signinMsg = document.getElementById("signinMsg");

    signinForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const data = {
        name: document.getElementById("name").value.trim(),
        role: document.getElementById("role").value.trim(),
        passKey: document.getElementById("passKey").value.trim(),
      };

      // Check empty fields
      for (let k in data) {
        if (!data[k]) {
          signinMsg.textContent = "Please fill all fields.";
          return;
        }
      }

      try {
        const res = await fetch("http://localhost:3000/api/school/signin", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const resData = await res.json();

        if (!res.ok) {
          signinMsg.textContent = resData.error || "Sign-in failed";
          return;
        }

        // Save logged user data
        localStorage.setItem("user", JSON.stringify(resData.user));

        // Redirect by role
        if (data.role === "admin") {
          window.location.href = "/admin-dashboard.html";
        } else if (data.role === "teacher") {
          window.location.href = "/teacher-dashboard.html";
        } else {
          window.location.href = "/parent-home.html";
        }

      } catch (err) {
        signinMsg.textContent = "Server error, try again later.";
        console.error(err);
      }
    });
  </script>

</body>
</html>
