<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nursery Signup</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #f6d365, #fda085);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.15);
      width: 90%;
      max-width: 450px;
      animation: fadeIn 0.8s ease-out;
      text-align: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      margin-bottom: 25px;
      font-weight: 600;
      color: #333;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      color: #555;
      text-align: left;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 20px;
      border-radius: 12px;
      border: 1px solid #ccc;
      font-size: 16px;
      font-family: "Poppins", sans-serif;
    }

    .note {
      font-size: 13px;
      color: #ff4d4d;
      margin-top: -15px;
      margin-bottom: 15px;
      text-align: left;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      cursor: pointer;
      background: #2196f3;
      color: white;
      font-weight: 500;
      transition: background 0.2s, transform 0.2s;
    }

    button:hover { background: #1976d2; transform: translateY(-2px); }
  </style>
</head>

<body>
  <div class="card">
    <h1>Nursery Signup 🏫</h1>

    <form id="signupForm">
      <label for="nurseryName">Nursery Name</label>
      <input type="text" id="nurseryName" placeholder="Enter Nursery Name" required />

      <label for="contactEmail">Contact Email</label>
      <input type="email" id="contactEmail" placeholder="Enter Email" required />

      <label for="contactPhone">Contact Phone</label>
      <input type="tel" id="contactPhone" placeholder="Enter Phone Number" required />

      <label for="nurseryKey">Nursery Pass Key</label>
      <input type="text" id="nurseryKey" placeholder="Enter Nursery Pass Key" required />
      <p class="note">This key will be used for the nursery to access the system and for teachers to join.</p>

      <button type="submit">Complete Signup</button>
    </form>
  </div>

  <script>
document.addEventListener("DOMContentLoaded", () => {
  const licenseInput = document.getElementById("licenseInput");
  const validateLicenseBtn = document.getElementById("validateLicenseBtn");
  const licenseError = document.getElementById("licenseError");
  const signupForm = document.getElementById("signupForm");

  let selectedLicense = null; // store valid license

  // ✅ License validation
  if (validateLicenseBtn) {
    validateLicenseBtn.addEventListener("click", async () => {
      const license = licenseInput.value.trim().toUpperCase();
      if (!license) {
        licenseError.textContent = "Please enter your license number.";
        return;
      }

      licenseError.textContent = ""; // reset error

      try {
        const res = await fetch("/api/nursery/validate-license", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ license })
        });

        const data = await res.json();

        if (res.ok) {
          selectedLicense = license;
          localStorage.setItem("selectedLicense", selectedLicense);
          alert("License validated! You can now complete signup.");
        } else {
          licenseError.textContent = data.message || "Invalid license.";
        }
      } catch (err) {
        console.error(err);
        licenseError.textContent = "Server error. Please try again later.";
      }
    });
  }

  // ✅ Signup form submission
  if (signupForm) {
    signupForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!selectedLicense) {
        alert("Please validate your license before signing up.");
        return;
      }

      const data = {
        name: document.getElementById("nurseryName").value.trim(),
        email: document.getElementById("contactEmail").value.trim(),
        phone: document.getElementById("contactPhone").value.trim(),
        passKey: document.getElementById("nurseryKey").value.trim(),
        license: selectedLicense,
        address: "Not provided" // optional, you can add input
      };

      // Basic empty check
      for (let k in data) {
        if (!data[k]) {
          alert("Please fill all fields and ensure license is validated.");
          return;
        }
      }

      try {
        const res = await fetch("/api/nurseries", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const resData = await res.json();

        if (resData.error) {
          alert(resData.error);
          return;
        }

        alert("Nursery registered successfully!");
        window.location.href = "/sch-login.html";

      } catch (err) {
        console.error(err);
        alert("Error connecting to server.");
      }
    });
  }
});
</script>

</body>
</html>
