<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nursery Signup 🏫</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #f6d365, #fda085);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.15);
      width: 90%;
      max-width: 450px;
      animation: fadeIn 0.8s ease-out;
      text-align: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 { margin-bottom: 25px; font-weight: 600; color: #333; }
    label { display: block; margin-bottom: 5px; font-weight: 500; color: #555; text-align: left; }
    input { width: 100%; padding: 12px 14px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #ccc; font-size: 16px; }
    .note { font-size: 13px; color: #ff4d4d; margin-bottom: 15px; text-align: left; }
    button { width: 100%; padding: 14px; border: none; border-radius: 14px; font-size: 17px; cursor: pointer; background: #2196f3; color: white; font-weight: 500; transition: background 0.2s, transform 0.2s; }
    button:hover { background: #1976d2; transform: translateY(-2px); }
    .success { color: green; margin-bottom: 10px; }
    .error { color: red; margin-bottom: 10px; }
  </style>
</head>

<body>
  <div class="card">
    <h1>Nursery Signup 🏫</h1>

    <!-- License Validation -->
    <label for="licenseKey">License Key</label>
    <input type="text" id="licenseKey" placeholder="Enter License Key" />
    <button id="validateLicenseBtn" type="button">Validate License</button>
    <p id="licenseMessage" class="note"></p>

    <form id="signupForm" style="display: none;">
      <label for="nurseryName">Nursery Name</label>
      <input type="text" id="nurseryName" placeholder="Enter Nursery Name" required />

      <label for="contactEmail">Contact Email</label>
      <input type="email" id="contactEmail" placeholder="Enter Email" required />

      <label for="contactPhone">Contact Phone</label>
      <input type="tel" id="contactPhone" placeholder="Enter Phone Number" required />

      <label for="nurseryAdmin">Nursery Manager</label>
      <input type="text" id="nurseryAdmin" placeholder="Enter Manager Name" required />

      <label for="managerKey">Manager Pass Key</label>
      <input type="text" id="managerKey" placeholder="Enter Manager Pass Key" required />

      <label for="nurseryKey">Nursery Pass Key</label>
      <input type="text" id="nurseryKey" placeholder="Enter Nursery Pass Key" required />
      <p class="note">This key will be used for nursery access and teachers to join.</p>

      <button type="submit">Complete Signup</button>
      <p id="signupMessage"></p>
    </form>
  </div>

  <script>
    const licenseInput = document.getElementById("licenseKey");
    const validateBtn = document.getElementById("validateLicenseBtn");
    const licenseMsg = document.getElementById("licenseMessage");
    const signupForm = document.getElementById("signupForm");
    const signupMsg = document.getElementById("signupMessage");

    let validatedLicense = null;

    // License Validation
    validateBtn.addEventListener("click", async () => {
      const license = licenseInput.value.trim();
      if (!license) {
        licenseMsg.textContent = "Please enter your license key.";
        licenseMsg.className = "error";
        return;
      }

      try {
        const res = await fetch("https://daily-effort-tracker-backend.onrender.com/api/nursery/validate-license", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ license })
        });
        const data = await res.json();

        if (res.ok) {
          licenseMsg.textContent = data.message;
          licenseMsg.className = "success";
          validatedLicense = license;
          signupForm.style.display = "block";
          licenseInput.disabled = true;
          validateBtn.disabled = true;
        } else {
          licenseMsg.textContent = data.message;
          licenseMsg.className = "error";
        }
      } catch (err) {
        licenseMsg.textContent = "Server error. Try again later.";
        licenseMsg.className = "error";
        console.error(err);
      }
    });

    // Nursery Signup
    signupForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!validatedLicense) {
        signupMsg.textContent = "Please validate your license first.";
        signupMsg.className = "error";
        return;
      }

      const data = {
        name: document.getElementById("nurseryName").value.trim(),
        email: document.getElementById("contactEmail").value.trim(),
        phone: document.getElementById("contactPhone").value.trim(),
        manager: document.getElementById("nurseryAdmin").value.trim(),
        managerPassKey: document.getElementById("managerKey").value.trim(),
        passKey: document.getElementById("nurseryKey").value.trim(),
        license: validatedLicense,
        address: "Not provided"
      };

      // Basic empty check
      for (let k in data) {
        if (!data[k]) {
          signupMsg.textContent = "Please fill all fields.";
          signupMsg.className = "error";
          return;
        }
      }

      try {
        const res = await fetch("https://daily-effort-tracker-backend.onrender.com/api/nurseries", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
        const resData = await res.json();

        if (res.ok) {
          signupMsg.textContent = "Nursery registered successfully!";
          signupMsg.className = "success";
          setTimeout(() => {
            window.location.href = "/sch-login.html";
          }, 1500);
        } else {
          signupMsg.textContent = resData.error || "Error during signup.";
          signupMsg.className = "error";
        }
      } catch (err) {
        signupMsg.textContent = "Error connecting to server.";
        signupMsg.className = "error";
        console.error(err);
      }
    });
  </script>
</body>
</html>
