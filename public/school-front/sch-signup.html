<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nursery Signup</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: "Poppins", sans-serif;
    background: linear-gradient(135deg, #f6d365, #fda085);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .card {
    background: white;
    padding: 40px;
    border-radius: 24px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.15);
    width: 90%;
    max-width: 450px;
    animation: fadeIn 0.8s ease-out;
    text-align: center;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  h1 { margin-bottom: 25px; font-weight: 600; color: #333; }
  label { display: block; margin-bottom: 5px; font-weight: 500; color: #555; text-align: left; }
  input { width: 100%; padding: 12px 14px; margin-bottom: 20px; border-radius: 12px; border: 1px solid #ccc; font-size: 16px; font-family: "Poppins", sans-serif; }
  .note { font-size: 13px; color: #ff4d4d; margin-top: -15px; margin-bottom: 15px; text-align: left; }
  button { width: 100%; padding: 14px; border: none; border-radius: 14px; font-size: 17px; cursor: pointer; background: #2196f3; color: white; font-weight: 500; transition: background 0.2s, transform 0.2s; }
  button:hover { background: #1976d2; transform: translateY(-2px); }
  .success { color: green; margin-bottom: 10px; text-align: left; }
  .error { color: red; margin-bottom: 10px; text-align: left; }
</style>
</head>
<body>

<div class="card">
  <h1>Nursery Signup 🏫</h1>

  <label for="licenseInput">License Key</label>
  <input type="text" id="licenseInput" placeholder="Enter your License Key" />
  <button id="validateLicenseBtn" type="button">Validate License</button>
  <p id="licenseMessage" class="note"></p>

  <form id="signupForm">
    <label for="nurseryName">Nursery Name</label>
    <input type="text" id="nurseryName" placeholder="Enter Nursery Name" required />

    <label for="contactEmail">Contact Email</label>
    <input type="email" id="contactEmail" placeholder="Enter Email" required />

    <label for="contactPhone">Contact Phone</label>
    <input type="tel" id="contactPhone" placeholder="Enter Phone Number" required />

    <label for="nurseryKey">Nursery Pass Key</label>
    <input type="text" id="nurseryKey" placeholder="Enter Nursery Pass Key" required />
    <p class="note">This key will be used for the nursery to access the system and for teachers to join.</p>

    <button type="submit">Complete Signup</button>
  </form>
</div>

<script>
const licenseInput = document.getElementById("licenseInput");
const validateBtn = document.getElementById("validateLicenseBtn");
const licenseMessage = document.getElementById("licenseMessage");
const signupForm = document.getElementById("signupForm");

// Disable signup form initially
signupForm.querySelectorAll("input, button[type=submit]").forEach(el => el.disabled = true);

validateBtn.addEventListener("click", async () => {
  const licenseKey = licenseInput.value.trim();
  if (!licenseKey) {
    licenseMessage.textContent = "Please enter your license key.";
    licenseMessage.className = "error";
    return;
  }

  licenseMessage.textContent = "Validating...";
  licenseMessage.className = "";

  try {
    const res = await fetch("http://localhost:3000/api/school/nursery/validate-license", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ license: licenseKey })
    });

    const data = await res.json();

    if (res.ok) {
      licenseMessage.textContent = data.message; // "License valid"
      licenseMessage.className = "success";
      // Enable signup form
      signupForm.querySelectorAll("input, button[type=submit]").forEach(el => el.disabled = false);
      localStorage.setItem("selectedLicense", licenseKey); // store license
    } else {
      licenseMessage.textContent = data.message;
      licenseMessage.className = "error";
      localStorage.removeItem("selectedLicense");
    }
  } catch (err) {
    licenseMessage.textContent = "Server error. Try again later.";
    licenseMessage.className = "error";
    console.error(err);
  }
});

signupForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  const license = localStorage.getItem("selectedLicense");
  if (!license) {
    alert("Please validate your license before signing up.");
    return;
  }

  const data = {
    name: document.getElementById("nurseryName").value.trim(),
    email: document.getElementById("contactEmail").value.trim(),
    phone: document.getElementById("contactPhone").value.trim(),
    passKey: document.getElementById("nurseryKey").value.trim(),
    license: license,
    address: "Not provided"
  };

  // Basic empty check
  for (let k in data) {
    if (!data[k]) {
      alert("Please fill all fields.");
      return;
    }
  }

  try {
    const res = await fetch("http://localhost:3000/api/nurseries", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    const resData = await res.json();

    if (res.ok) {
      alert("Nursery registered successfully!");
      localStorage.removeItem("selectedLicense"); // clear license
      window.location.href = "/sch-login.html";
    } else {
      alert(resData.error || "Signup failed.");
    }
  } catch (err) {
    alert("Error connecting to server.");
    console.error(err);
  }
});
</script>

</body>
</html>
