<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🆕 Create Family</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
      background: linear-gradient(135deg, #f0f9ff, #cbebff);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    input, button {
      padding: 12px;
      margin: 8px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #4f9ef7;
      width: 250px;
    }
    button {
      background-color: #4f9ef7;
      color: white;
      cursor: pointer;
      border: none;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #357acb;
    }
    h2 {
      color: #2c3e50;
      margin-bottom: 20px;
    }
    .message {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
<html>
<head>
  <meta charset="utf-8" />
  <title>Create Family</title>
  <style>
    body { font-family: Arial; text-align:center; padding:40px }
    input, button { padding:10px; margin:8px; width:250px; }
  </style>
</head>
<body>
  <h2>🆕 Create a New Family</h2>
  <input id="family" placeholder="Family name (e.g. Zarif Family)" /><br/>
  <input id="dad" placeholder="Dad's name" /><br/>
  <input id="mom" placeholder="Mom's name" /><br/>
  <input id="passkey" placeholder="Family pass key" type="password" /><br/>
  <button onclick="signup()">Create Family</button>
  <div id="msg" style="color:red;margin-top:10px;"></div>

  <script>
    async function signup() {
      const family = document.getElementById('family').value.trim();
      const dad = document.getElementById('dad').value.trim();
      const mom = document.getElementById('mom').value.trim();
      const passkey = document.getElementById('passkey').value.trim();
      const msg = document.getElementById('msg');

      if (!family || !dad || !mom || !passkey) {
        msg.textContent = '❌ Fill all fields';
        return;
      }

      try {
        const res = await fetch('https://daily-effort-tracker-backend-production.up.railway.app/api/families/signup', {

          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ family, dad, mom, passkey })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Signup failed');

        // Save family info locally for adding kids
        localStorage.setItem('currentFamily', JSON.stringify({ family, passkey }));

        alert('Family created 🎉');
        location.href = 'add-kids.html';

      } catch(err) {
        msg.textContent = '❌ Error: ' + err.message;
      }
    }
  </script>
</body>
</html>
