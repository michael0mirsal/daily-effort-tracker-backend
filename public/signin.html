<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🌟 Family Stars Login</title>
  <style>
    body {
      font-family: 'Poppins', Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #dff9fb, #c7ecee, #f0f9ff);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    h1 {
      font-size: 2.5em;
      color: #2d3436;
      margin-bottom: 10px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
      animation: fadeInDown 1.2s ease;
    }

    .section {
      background: rgba(255, 255, 255, 0.85);
      padding: 25px 45px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      animation: fadeInUp 1.5s ease;
    }

    input, select {
      padding: 12px;
      margin: 10px;
      border: 2px solid #74b9ff;
      border-radius: 10px;
      font-size: 16px;
      width: 250px;
      transition: box-shadow 0.3s;
    }

    input:focus, select:focus {
      box-shadow: 0 0 10px rgba(116, 185, 255, 0.7);
      outline: none;
    }

    button {
      background-color: #74b9ff;
      color: white;
      padding: 12px 25px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 18px;
      margin-top: 12px;
      transition: transform 0.2s, background 0.3s;
    }

    button:hover {
      background-color: #0984e3;
      transform: scale(1.05);
    }

    #homeBtn {
      background-color: #6fcf97;
      margin-top: 25px;
    }

    #homeBtn:hover {
      background-color: #57b883;
    }

    /* Motivational messages */
    #motivation {
      position: absolute;
      bottom: 15px;
      font-size: 1.1em;
      color: #2d3436;
      font-weight: 500;
      opacity: 0;
      animation: fadeText 6s infinite;
    }

    @keyframes fadeText {
      0%, 100% { opacity: 0; }
      20%, 80% { opacity: 1; }
    }

    /* Optional smooth fade animation for dropdown */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

  </style>
</head>
<body>

  <h1>👨‍👩‍👧 Welcome to Family Stars</h1>

  <div class="section">
    <h2>✨ Login to Track & Shine</h2>
    <input type="text" id="name" placeholder="Enter your name" /><br/>
    <select id="role">
      <option value="dad">Dad 👨</option>
      <option value="mom">Mom 👩</option>
      <option value="kid">Kid 👧</option>
    </select><br/>
    <input type="password" id="passkey" placeholder="Family pass key" /><br/>

    <!-- Hidden family selector (appears only if needed) -->
    <div id="familySelectContainer" style="display:none; animation: fadeInUp 0.5s ease;">
      <p>🧩 Multiple families found with this name. Please choose yours:</p>
      <select id="familySelect"></select>
    </div>

    <button onclick="login()">🚀 Login</button>
  </div>

  <button id="homeBtn" onclick="goHome()">🏠 Home Page</button>

  <div id="motivation">🌟 Family teamwork builds habits that last forever!</div>

  <script>
    // 💫 Rotating motivational messages
    const mot = document.getElementById("motivation");
    const messages = [
      "💪 Track your child’s daily effort with love.",
      "🎁 Reward consistency, not perfection.",
      "🌱 Motivation grows from small daily wins.",
      "❤️ Families that track together, grow together.",
      "🌟 Every star means a step toward greatness!"
    ];
    let i = 0;
    setInterval(() => {
      mot.textContent = messages[i++ % messages.length];
    }, 6000);

    // 🚀 Login Logic
    async function login() {
      const name = document.getElementById("name").value.trim();
      const role = document.getElementById("role").value;
      const passkey = document.getElementById("passkey").value.trim();
      const familySelectContainer = document.getElementById("familySelectContainer");
      const familySelect = document.getElementById("familySelect");

      if (!name || !role || !passkey) {
        alert("❌ Please fill all fields");
        return;
      }

      // If user already selected a family from dropdown
      let selectedFamily = familySelectContainer.style.display !== "none" ? familySelect.value : null;

      try {
        const res = await fetch("https://daily-effort-tracker-backend-production.up.railway.app/api/families/signin", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, role, passkey, family: selectedFamily })
        });

        const data = await res.json();

        // 🔸 When multiple families have same name
        if (res.status === 409 && data.families) {
          familySelect.innerHTML = data.families.map(f => `<option value="${f.name}">${f.name}</option>`).join('');
          familySelectContainer.style.display = "block";
          alert("⚠️ This name exists in multiple families. Please select your family and try again.");
          return;
        }

        if (!res.ok) throw new Error(data.message || "Login failed");

        const user = {
          name,
          role,
          family: data.family.name,
          dad: data.family.dad || '',
          mom: data.family.mom || '',
          members: data.family.members || []
        };

        localStorage.setItem("currentUser", JSON.stringify(user));
        window.location.href = "choose.html";

      } catch (err) {
        alert("❌ Error: " + err.message);
      }
    }

    function goHome() {
      window.location.href = "welcome.html";
    }
  </script>
</body>
</html>
