<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🌟 Family Stars Login</title>
  <style>
    body {
      font-family: 'Poppins', Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #dff9fb, #c7ecee, #f0f9ff);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    h1 {
      font-size: 2.5em;
      color: #2d3436;
      margin-bottom: 10px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
      animation: fadeInDown 1.2s ease;
    }

    .section {
      background: rgba(255, 255, 255, 0.85);
      padding: 25px 45px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      animation: fadeInUp 1.5s ease;
    }

    input, select {
      padding: 12px;
      margin: 10px;
      border: 2px solid #74b9ff;
      border-radius: 10px;
      font-size: 16px;
      width: 250px;
      transition: box-shadow 0.3s;
    }

    input:focus, select:focus {
      box-shadow: 0 0 10px rgba(116, 185, 255, 0.7);
      outline: none;
    }

    button {
      background-color: #74b9ff;
      color: white;
      padding: 12px 25px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 18px;
      margin-top: 12px;
      transition: transform 0.2s, background 0.3s;
    }

    button:hover {
      background-color: #0984e3;
      transform: scale(1.05);
    }

    #homeBtn {
      background-color: #6fcf97;
      margin-top: 25px;
    }

    #homeBtn:hover {
      background-color: #57b883;
    }

    /* Floating hearts, stars, sparkles */
    .float {
      position: absolute;
      font-size: 22px;
      opacity: 0.8;
      animation: floatUp 8s linear infinite;
    }

    @keyframes floatUp {
      from { transform: translateY(100vh) scale(1); opacity: 1; }
      to { transform: translateY(-10vh) scale(1.4); opacity: 0; }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Motivational messages */
    #motivation {
      position: absolute;
      bottom: 15px;
      font-size: 1.1em;
      color: #2d3436;
      font-weight: 500;
      opacity: 0;
      animation: fadeText 6s infinite;
    }

    @keyframes fadeText {
      0%, 100% { opacity: 0; }
      20%, 80% { opacity: 1; }
    }
  </style>
</head>
<body>

  <h1>👨‍👩‍👧 Welcome to Family Stars</h1>

  <div class="section">
    <h2>✨ Login to Track & Shine</h2>
    <input type="text" id="name" placeholder="Enter your name" /><br/>
    <select id="role">
      <option value="dad">Dad 👨</option>
      <option value="mom">Mom 👩</option>
      <option value="kid">Kid 👧</option>
    </select><br/>
    <input type="password" id="passkey" placeholder="Family pass key" /><br/>
    <button onclick="login()">🚀 Login</button>
  </div>

  <button id="homeBtn" onclick="goHome()">🏠 Home Page</button>

  <div id="motivation">🌟 Family teamwork builds habits that last forever!</div>

  <script>
    // Floating animations generator
    const emojis = ['💖', '⭐', '✨', '🌈', '💫', '💛'];
    function createFloat() {
      const el = document.createElement('div');
      el.className = 'float';
      el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.animationDuration = (6 + Math.random() * 5) + 's';
      el.style.fontSize = (16 + Math.random() * 24) + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 8000);
    }
    setInterval(createFloat, 700);

    // Rotating motivational messages
    const messages = [
      "💪 Track your child’s daily effort with love.",
      "🎁 Reward consistency, not perfection.",
      "🌱 Motivation grows from small daily wins.",
      "❤️ Families that track together, grow together.",
      "🌟 Every star means a step toward greatness!"
    ];
    const mot = document.getElementById("motivation");
    let i = 0;
    setInterval(() => {
      mot.textContent = messages[i % messages.length];
      i++;
    }, 6000);

    // Login logic
    async function login() {
      const name = document.getElementById("name").value.trim();
      const role = document.getElementById("role").value;
      const passkey = document.getElementById("passkey").value.trim();

      if (!name || !role || !passkey) {
        alert("❌ Please fill all fields");
        return;
      }

      try {
        const res = await fetch('/api/families/signin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, role, passkey })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Login failed');

        const user = {
          name,
          role,
          family: data.family.name,
          dad: data.family.dad || '',
          mom: data.family.mom || '',
          members: data.family.members || []
        };
        localStorage.setItem('currentUser', JSON.stringify(user));
        window.location.href = 'choose.html';
      } catch (err) {
        alert("❌ Error: " + err.message);
      }
    }

    function goHome() {
      window.location.href = 'welcome.html';
    }
  </script>

</body>
</html>
