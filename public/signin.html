<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🌟 Family Stars Login</title>
  <style>
    body {
      font-family: 'Poppins', Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #dff9fb, #c7ecee, #f0f9ff);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    h1 {
      font-size: 2.5em;
      color: #2d3436;
      margin-bottom: 10px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
      animation: fadeInDown 1.2s ease;
    }

    .section {
      background: rgba(255, 255, 255, 0.85);
      padding: 25px 45px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      animation: fadeInUp 1.5s ease;
    }

    input {
      padding: 12px;
      margin: 10px;
      border: 2px solid #74b9ff;
      border-radius: 10px;
      font-size: 16px;
      width: 250px;
      transition: box-shadow 0.3s;
    }

    input:focus {
      box-shadow: 0 0 10px rgba(116, 185, 255, 0.7);
      outline: none;
    }

    button {
      background-color: #74b9ff;
      color: white;
      padding: 12px 25px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 18px;
      margin-top: 12px;
      transition: transform 0.2s, background 0.3s;
    }

    button:hover {
      background-color: #0984e3;
      transform: scale(1.05);
    }

    #homeBtn {
      background-color: #6fcf97;
      margin-top: 25px;
    }

    #homeBtn:hover {
      background-color: #57b883;
    }

    #motivation {
      position: absolute;
      bottom: 15px;
      font-size: 1.1em;
      color: #2d3436;
      font-weight: 500;
      opacity: 0;
      animation: fadeText 6s infinite;
    }

    @keyframes fadeText {
      0%, 100% { opacity: 0; }
      20%, 80% { opacity: 1; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <h1>👨‍👩‍👧 Welcome to Family Stars</h1>

  <div class="section">
    <h2>✨ Login to Track & Shine</h2>

    <input type="text" id="family" placeholder="Enter family name" /><br/>
    <input type="text" id="name" placeholder="Enter your name" /><br/>
    <input type="password" id="passkey" placeholder="Family pass key" /><br/>

    <button onclick="login()">🚀 Login</button>
  </div>

  <button id="homeBtn" onclick="goHome()">🏠 Home Page</button>

  <div id="motivation">🌟 Family teamwork builds habits that last forever!</div>

  <script>
     const API_URL = "https://daily-effort-tracker-backend.onrender.com";
    // 💫 rotating motivation
    const mot = document.getElementById("motivation");
    const messages = [
      "💪 Track your child’s daily effort with love.",
      "🎁 Reward consistency, not perfection.",
      "🌱 Motivation grows from small daily wins.",
      "❤️ Families that track together, grow together.",
      "🌟 Every star means a step toward greatness!"
    ];
    let i = 0;
    setInterval(() => {
      mot.textContent = messages[i++ % messages.length];
    }, 6000);

    async function login() {
  const family = document.getElementById("family").value.trim();
  const name = document.getElementById("name").value.trim();
  const passkey = document.getElementById("passkey").value.trim();

  if (!family || !name || !passkey) {
    alert("❌ Please fill all fields");
    return;
  }

  try {
    const res = await fetch(`${API_URL}/api/families/signin`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ family, name, passkey })
    });

    const data = await res.json();

    if (!res.ok) {
      if (res.status === 404) alert("❌ Family not found");
      else if (res.status === 401) alert("❌ Wrong passkey");
      else if (res.status === 403) alert("❌ This name is not registered in this family");
      else if (res.status === 429) alert("⏳ Too many attempts. Try again later.");
      else alert("❌ " + (data.message || "Login failed"));
      return;
    }

    // =====================================================
    // 🔥 FIX #1 — Normalize backend response safely
    // Supports: { family:{} } OR [ {} ] OR { _id: ... }
    // =====================================================
    let familyObj = null;

    if (data.family) {
      familyObj = data.family;                  // ✅ preferred backend format
    } else if (Array.isArray(data) && data.length === 1) {
      familyObj = data[0];                     // ✅ fallback for array response
    } else if (data._id) {
      familyObj = data;                        // ✅ fallback for direct object
    }

    // =====================================================
    // 🔥 FIX #2 — Hard validation (prevents familyId undefined)
    // =====================================================
    if (!familyObj || !familyObj._id) {
      console.error("Invalid signin response:", data);
      alert("⚠️ Server returned invalid family data");
      return;
    }

    // =====================================================
    // 🔥 FIX #3 — Safe role detection (fallback if backend fails)
    // =====================================================
    let role = "kid";                           // ✅ default role
    const nameLower = name.toLowerCase();

    if ((familyObj.dad || "").toLowerCase() === nameLower) role = "dad";
    else if ((familyObj.mom || "").toLowerCase() === nameLower) role = "mom";
    else if (Array.isArray(familyObj.members)) {
      const member = familyObj.members.find(
        m => (m.name || "").toLowerCase() === nameLower
      );
      if (member) role = member.role || "kid";
    }

    // =====================================================
    // 🔥 FIX #4 — Save a COMPLETE and SAFE session object
    // This is what your family tree loader requires
    // =====================================================
    const user = {
      name,
      familyName: familyObj.name,
      familyId: familyObj._id,        // ✅ CRITICAL FIX — was missing before
      role,
      dad: familyObj.dad,
      mom: familyObj.mom,
      members: familyObj.members
    };

    // =====================================================
    // 🔥 FIX #5 — Store valid session
    // =====================================================
    localStorage.setItem("currentUser", JSON.stringify(user));

    console.log("✅ Saved session:", user);

    // =====================================================
    // 🔥 FIX #6 — Redirect only after successful save
    // =====================================================
    window.location.href = "choose.html";

  } catch (err) {
    alert("❌ Error: " + err.message);
  }
}

function goHome() {
    window.location.href = "welcome.html"; // or whatever your home page is
  }

  </script>

</body>
</html>
